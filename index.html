                        </div>
                        <button class="btn btn-sm btn-primary" onclick="app.startRoutineWorkout('${active.id}', ${todayProg.day}, ${idx})">Start</button>
                    </div>
                </div>`;
            });
        }
        html += `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:14px 0;">
                <button class="btn" style="background:var(--surface-elevated);" onclick="app.startEmptyWorkout()"><i class="fas fa-plus"></i> Empty Workout</button>
                <button class="btn" style="background:var(--surface-elevated);" onclick="app.logRestDayToday()"><i class="fas fa-bed"></i> Log Rest Day</button>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:16px;">
                <button class="btn btn-sm" style="background:var(--info-dim); color:var(--info); border-color:var(--info);" onclick="document.getElementById('start-workout-modal').style.display='none'; app.triggerFitImport();"><i class="fas fa-file-arrow-up"></i> Upload .FIT</button>
                <button class="btn btn-sm" style="background:var(--success-dim); color:var(--success); border-color:var(--success);" onclick="document.getElementById('start-workout-modal').style.display='none'; app.triggerCsvImport();"><i class="fas fa-file-csv"></i> Upload CSV</button>
            </div>
            <h3 style="margin:16px 0 8px 0;">All Workouts in ${active.name}</h3>
        `;
        [1, 2, 3, 4, 5, 6, 0].forEach(dIdx => {
            const d = active.days.find(x => x.day === dIdx);
            if (!d || !d.workouts || d.workouts.length === 0) return;
            d.workouts.forEach((w, wIdx) => {
                html += `
                <div class="card" style="padding:12px 14px; margin-bottom:8px;">
                    <div class="flex-between">
                        <div>
                            <div style="font-size:10px; font-weight:800; color:var(--text-secondary); text-transform:uppercase;">${utils.getDayName(d.day)}</div>
                            <div style="font-weight:800; font-size:15px;">${w.name}</div>
                            <div style="font-size:11px; color:var(--text-secondary);">${(w.exercises || []).length} exercises</div>
                        </div>
                        <button class="btn btn-sm" onclick="app.startRoutineWorkout('${active.id}', ${d.day}, ${wIdx})"><i class="fas fa-play"></i> Start</button>
                    </div>
                </div>`;
            });
        });
        html += `</div>`;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },
    startRoutineWorkout(routineId, dayIdx, workoutIdx) {
        const r = store.state.routines.find(x => x.id === routineId) || utils.getActiveRoutine();
        const d = r.days.find(x => x.day === dayIdx);
        if (!d || !d.workouts[workoutIdx]) return;
        workoutEngine.initNewOrResume(d.workouts[workoutIdx]);
    },
    startEmptyWorkout() {
        const name = prompt("Workout Session Name:", "Freestyle Session");
        if (!name) return;
        workoutEngine.startNewSession({ id: utils.generateId(), name: name.trim(), exercises: [] });
    },
    logRestDayToday() {
        const todayStr = utils.getLocalISODate(new Date());
        const exists = store.state.history.workouts.some(w => utils.getLocalISODate(w.date) === todayStr && w.isSkipped);
        if (!exists) {
            store.addWorkout({ id: utils.generateId(), date: new Date().toISOString(), name: 'Active Recovery / Rest Day', isSkipped: true, isActivity: false, exercises: [] });
        }
        document.getElementById('start-workout-modal').style.display = 'none';
        this.navigate(this.currentPage);
    },
    logQuickActivity() {
        const actName = prompt("Log Activity / Sport / Cardio (e.g. '30m Walk', 'Touch Rugby', 'Run 5km'):", "Daily Walk");
        if (!actName || !actName.trim()) return;
        const clean = actName.trim();
        store.addWorkout({ id: utils.generateId(), date: new Date().toISOString(), name: clean, isSkipped: false, isActivity: true, exercises: [] });
        store.addCardio({ date: new Date().toISOString(), type: clean, duration: 30 });
        this.navigate(this.currentPage);
    },
    promptQuickBodyweight() {
        const unit = utils.unitLabel();
        const todayStr = utils.getLocalISODate(new Date());
        const existing = store.state.history.bodyweight.find(e => utils.getLocalISODate(e.date) === todayStr);
        const defVal = existing ? existing.weight : (store.state.user.currentWeight || 90);
        const val = prompt(`Log Today's Morning Bodyweight (${unit}):`, defVal);
        if (val === null) return;
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        store.addBodyweight(num);
        this.navigate(this.currentPage);
    },
    saveInlineBodyweight() {
        const inp = document.getElementById('inline-bw-input');
        if (!inp) return;
        const num = parseFloat(inp.value);
        if (isNaN(num) || num <= 0) {
            this.promptQuickBodyweight();
            return;
        }
        store.addBodyweight(num);
        this.navigate('analytics');
    },
    editBodyweightEntry(isoDate, currentWeight) {
        const val = prompt(`Edit Bodyweight (${utils.unitLabel()}):`, currentWeight);
        if (val === null) return;
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        store.addBodyweight(num, isoDate);
        this.navigate(this.currentPage);
    },
    deleteWorkoutEntry(wId) {
        if (confirm("Delete this workout session from your history?")) {
            store.deleteWorkoutById(wId);
            this.navigate(this.currentPage);
        }
    },
    switchActiveRoutine(rId) {
        store.state.activeRoutineId = rId;
        store.save();
        this.navigate(this.currentPage);
    },
    swapRoutineDays(dayA, dayB) {
        if (dayA === dayB || isNaN(dayA) || isNaN(dayB)) return;
        const active = utils.getActiveRoutine();
        let dA = active.days.find(x => x.day === dayA);
        let dB = active.days.find(x => x.day === dayB);
        if (!dA) { dA = { day: dayA, workouts: [] }; active.days.push(dA); }
        if (!dB) { dB = { day: dayB, workouts: [] }; active.days.push(dB); }
        const temp = dA.workouts;
        dA.workouts = dB.workouts;
        dB.workouts = temp;
        store.save();
        this.navigate(this.currentPage);
    },
    createNewRoutine() {
        const name = prompt("Enter New Split / Routine Name (e.g. '4-Day Upper/Lower', 'Arnold Split'):");
        if (!name || !name.trim()) return;
        const newR = {
            id: 'r_' + utils.generateId(),
            name: name.trim(),
            days: [0, 1, 2, 3, 4, 5, 6].map(d => ({ day: d, workouts: [] }))
        };
        store.state.routines.push(newR);
        store.state.activeRoutineId = newR.id;
        store.save();
        this.openRoutineEditor(newR.id);
    },
    openRoutineEditor(routineId) {
        const r = store.state.routines.find(x => x.id === routineId) || utils.getActiveRoutine();
        this.draftRoutine = JSON.parse(JSON.stringify(r));
        this.renderRoutineEditorModal();
    },
    renderRoutineEditorModal() {
        const modal = document.getElementById('routine-editor-modal');
        const r = this.draftRoutine;
        const orderedDays = [1, 2, 3, 4, 5, 6, 0];
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('routine-editor-modal').style.display='none'">Cancel</button>
                <div style="font-weight:bold; font-size:16px;">Edit Split: ${r.name}</div>
                <button class="btn btn-sm btn-success" onclick="app.saveRoutineEditor()">Save</button>
            </div>
            <div style="padding:16px; overflow-y:auto; flex:1; padding-bottom:80px;">
                <label style="font-size:11px; color:var(--text-secondary); font-weight:bold; text-transform:uppercase;">Split Name</label>
                <input type="text" class="edit-input" value="${r.name}" oninput="app.draftRoutine.name = this.value">
        `;
        orderedDays.forEach((dayIdx, orderPos) => {
            let dayObj = r.days.find(x => x.day === dayIdx);
            if (!dayObj) { dayObj = { day: dayIdx, workouts: [] }; r.days.push(dayObj); }
            const prevDay = orderedDays[(orderPos - 1 + 7) % 7];
            const nextDay = orderedDays[(orderPos + 1) % 7];
            html += `
            <div class="card" style="padding:14px; margin-bottom:12px;">
                <div class="flex-between" style="margin-bottom:8px;">
                    <h3 style="margin:0; font-size:16px; color:var(--accent-color);">${utils.getDayName(dayIdx)}</h3>
                    <div style="display:flex; gap:6px;">
                        <button class="btn-icon" style="width:28px; height:28px; font-size:11px;" onclick="app.swapDraftRoutineDays(${dayIdx}, ${prevDay})" title="Move up"><i class="fas fa-arrow-up"></i></button>
                        <button class="btn-icon" style="width:28px; height:28px; font-size:11px;" onclick="app.swapDraftRoutineDays(${dayIdx}, ${nextDay})" title="Move down"><i class="fas fa-arrow-down"></i></button>
                        <button class="btn btn-sm" style="padding:4px 10px; font-size:11px;" onclick="app.addDraftWorkoutToDay(${dayIdx})">+ Session</button>
                    </div>
                </div>
                ${dayObj.workouts.length === 0 ? `<div class="text-muted" style="font-size:12px;">Rest Day</div>` : dayObj.workouts.map((w, wIdx) => `
                    <div style="background:var(--surface-elevated); padding:10px; border-radius:10px; margin-bottom:8px; border:1px solid var(--border);">
                        <div class="flex-between" style="margin-bottom:8px; gap:8px;">
                            <input type="text" class="edit-input" style="margin:0; font-weight:bold;" value="${w.name}" oninput="app.updateDraftWorkoutName(${dayIdx}, ${wIdx}, this.value)">
                            <button class="btn-icon" style="color:var(--pending); width:32px; height:32px; flex-shrink:0;" onclick="app.removeDraftWorkout(${dayIdx}, ${wIdx})"><i class="fas fa-trash"></i></button>
                        </div>
                        ${(w.exercises || []).map((ex, exIdx) => `
                            <div style="display:grid; grid-template-columns: 1fr 54px 72px auto; gap:6px; align-items:center; margin-bottom:6px;">
                                <div style="font-size:13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ex.name}</div>
                                <input type="number" class="inline-edit" value="${ex.targetSets || 3}" onchange="app.updateDraftExercise(${dayIdx}, ${wIdx}, ${exIdx}, 'targetSets', this.value)" title="Sets">
                                <input type="text" class="inline-edit" value="${ex.targetReps || '8-12'}" onchange="app.updateDraftExercise(${dayIdx}, ${wIdx}, ${exIdx}, 'targetReps', this.value)" title="Reps">
                                <button class="btn-icon" style="width:26px; height:26px; color:var(--pending);" onclick="app.removeDraftExercise(${dayIdx}, ${wIdx}, ${exIdx})"><i class="fas fa-xmark"></i></button>
                            </div>
                        `).join('')}
                        <button class="btn btn-sm" style="width:100%; margin-top:6px; font-size:12px;" onclick="app.promptAddDraftExercise(${dayIdx}, ${wIdx})">+ Add Exercise</button>
                    </div>
                `).join('')}
            </div>`;
        });
        if (store.state.routines.length > 1) {
            html += `<button class="btn" style="background:var(--pending-dim); color:var(--pending); border:1px solid var(--pending);" onclick="app.deleteRoutine('${r.id}')">Delete Split</button>`;
        }
        html += `</div>`;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },
    swapDraftRoutineDays(dayA, dayB) {
        const dA = this.draftRoutine.days.find(x => x.day === dayA);
        const dB = this.draftRoutine.days.find(x => x.day === dayB);
        if (dA && dB) {
            const tmp = dA.workouts;
            dA.workouts = dB.workouts;
            dB.workouts = tmp;
            this.renderRoutineEditorModal();
        }
    },
    addDraftWorkoutToDay(dayIdx) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (!d) return;
        d.workouts.push({ id: 'w_' + utils.generateId(), name: 'New Session', exercises: [] });
        this.renderRoutineEditorModal();
    },
    updateDraftWorkoutName(dayIdx, wIdx, val) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx]) d.workouts[wIdx].name = val;
    },
    removeDraftWorkout(dayIdx, wIdx) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d) { d.workouts.splice(wIdx, 1); this.renderRoutineEditorModal(); }
    },
    updateDraftExercise(dayIdx, wIdx, exIdx, field, val) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx] && d.workouts[wIdx].exercises[exIdx]) {
            d.workouts[wIdx].exercises[exIdx][field] = field === 'targetSets' ? (parseInt(val) || 3) : val;
        }
    },
    removeDraftExercise(dayIdx, wIdx, exIdx) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx]) {
            d.workouts[wIdx].exercises.splice(exIdx, 1);
            this.renderRoutineEditorModal();
        }
    },
    promptAddDraftExercise(dayIdx, wIdx) {
        const exName = prompt("Enter Exercise Name (e.g. Bench Press, Squat, Lat Pulldown):");
        if (!exName || !exName.trim()) return;
        const master = utils.getMasterExercise(exName.trim());
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx]) {
            d.workouts[wIdx].exercises.push({
                name: master.name,
                muscles: utils.getMuscles(master),
                targetSets: master.targetSets || 3,
                targetReps: master.targetReps || '8-12'
            });
            this.renderRoutineEditorModal();
        }
    },
    saveRoutineEditor() {
        const idx = store.state.routines.findIndex(x => x.id === this.draftRoutine.id);
        if (idx > -1) store.state.routines[idx] = this.draftRoutine;
        else store.state.routines.push(this.draftRoutine);
        store.save();
        document.getElementById('routine-editor-modal').style.display = 'none';
        this.navigate(this.currentPage);
    },
    deleteRoutine(rId) {
        if (store.state.routines.length <= 1) return;
        if (confirm("Delete this training split?")) {
            store.state.routines = store.state.routines.filter(x => x.id !== rId);
            if (store.state.activeRoutineId === rId) store.state.activeRoutineId = store.state.routines[0].id;
            store.save();
            document.getElementById('routine-editor-modal').style.display = 'none';
            this.navigate(this.currentPage);
        }
    },
    /* ANALYTICS CONTROLS & CHARTS */
    setChartRange(val) {
        store.state.settings.chartRange = val;
        store.save();
        this.navigate('analytics');
    },
    setVolFilter(val) {
        store.state.settings.lastVolFilter = val;
        store.state.settings.overloadExerciseFilter = 'ALL_MUSCLE';
        store.save();
        this.navigate('analytics');
    },
    setOverloadExerciseFilter(val) {
        store.state.settings.overloadExerciseFilter = val;
        store.save();
        this.navigate('analytics');
    },
    cycleWeightGoal() {
        const goals = ['cutting', 'bulking', 'maintaining'];
        const cur = store.state.settings.weightGoal || 'cutting';
        const next = goals[(goals.indexOf(cur) + 1) % goals.length];
        store.state.settings.weightGoal = next;
        store.save();
        this.navigate('analytics');
    },
    toggleCaloriesOnBwChart() {
        store.state.settings.showCaloriesOnBwChart = !store.state.settings.showCaloriesOnBwChart;
        store.save();
        this.navigate('analytics');
    },
    promptTrackExercisePR() {
        const grouped = utils.getGroupedExercises();
        const allNames = [];
        Object.values(grouped).forEach(list => list.forEach(e => { if (!allNames.includes(e.name)) allNames.push(e.name); }));
        const input = prompt(`Enter Exercise Name to track in PR Zone (e.g. ${allNames.slice(0, 6).join(', ')}):`);
        if (!input || !input.trim()) return;
        const clean = input.trim();
        if (!store.state.trackedPRs) store.state.trackedPRs = ['Bench Press', 'Squat', 'Deadlift'];
        if (!store.state.trackedPRs.some(x => x.toLowerCase() === clean.toLowerCase())) {
            store.state.trackedPRs.push(clean);
            store.save();
            this.navigate('analytics');
        }
    },
    removeTrackedPR(liftName) {
        if (!store.state.trackedPRs) return;
        store.state.trackedPRs = store.state.trackedPRs.filter(x => x !== liftName);
        store.save();
        this.navigate('analytics');
    },
    saveManualPROverride(liftName, idx) {
        const wEl = document.getElementById(`pr-w-${idx}`);
        const rEl = document.getElementById(`pr-r-${idx}`);
        const w = wEl ? parseFloat(wEl.value) : 0;
        const r = rEl ? parseInt(rEl.value) : 1;
        if (isNaN(w) || w <= 0 || isNaN(r) || r <= 0) return;
        store.addManualPR(liftName, w, r);
        this.navigate('analytics');
    },
    initCharts() {
        Object.values(this.chartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });
        this.chartInstances = {};
        const range = store.state.settings.chartRange || '90';
        const daysLimit = range === 'ALL' ? 0 : parseInt(range);
        const cutoff = daysLimit ? (Date.now() - daysLimit * 86400000) : 0;
        // 1. Progressive Overload Volume Chart
        const volCtx = document.getElementById('volChart');
        if (volCtx && window.Chart) {
            const volHist = utils.getWorkoutVolumeHistory();
            const filter = store.state.settings.lastVolFilter || 'total';
            const exFilter = store.state.settings.overloadExerciseFilter || 'ALL_MUSCLE';
            let rawSeries = [];
            let labelName = 'Total Volume';
            if (filter === 'total') {
                rawSeries = volHist.total || [];
            } else if (exFilter && exFilter !== 'ALL_MUSCLE') {
                rawSeries = (volHist.byExercise && volHist.byExercise[exFilter]) || [];
                labelName = exFilter;
            } else {
                rawSeries = (volHist.byMuscle && volHist.byMuscle[filter]) || [];
                labelName = `${filter} Volume`;
            }
            const filtered = rawSeries.filter(p => !cutoff || p.x >= cutoff);
            const sma = utils.calculateSMA(filtered, 3);
            this.chartInstances.vol = new Chart(volCtx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: labelName,
                            data: filtered,
                            borderColor: 'rgba(2, 136, 209, 0.35)',
                            backgroundColor: 'rgba(2, 136, 209, 0.12)',
                            borderWidth: 1.5,
                            pointRadius: 3,
                            fill: true,
                            tension: 0.25
                        },
                        {
                            label: '3-Session Trend',
                            data: sma,
                            borderColor: '#0288d1',
                            borderWidth: 3,
                            pointRadius: 0,
                            fill: false,
                            tension: 0.35
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#a89f91', boxWidth: 18 } } },
                    scales: {
                        x: { type: 'time', time: { unit: 'day' }, ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }
        // 2. Bodyweight Chart (with Daily Weight, 7d Trend, Target, and Optional Calories)
        const bwCtx = document.getElementById('bwChart');
        if (bwCtx && window.Chart) {
            const bwRaw = store.state.history.bodyweight
                .map(b => ({ x: new Date(b.date).setHours(0,0,0,0), y: b.weight }))
                .filter(p => !cutoff || p.x >= cutoff)
                .sort((a, b) => a.x - b.x);
            const bwSma = utils.calculateSMA(bwRaw, 7);
            const targetW = parseFloat(store.state.user.targetWeight) || 85;
            const targetLine = bwRaw.length >= 2
                ? [{ x: bwRaw[0].x, y: targetW }, { x: bwRaw[bwRaw.length - 1].x, y: targetW }]
                : [{ x: Date.now() - 7*86400000, y: targetW }, { x: Date.now(), y: targetW }];
            const datasets = [
                {
                    label: 'Daily Weight',
                    data: bwRaw,
                    borderColor: 'rgba(245, 124, 0, 0.35)',
                    backgroundColor: 'rgba(245, 124, 0, 0.35)',
                    borderWidth: 1.5,
                    pointRadius: 3.5,
                    yAxisID: 'y'
                },
                {
                    label: '7d Trend',
                    data: bwSma,
                    borderColor: '#f57c00',
                    borderWidth: 3,
                    pointRadius: 0,
                    tension: 0.35,
                    yAxisID: 'y'
                },
                {
                    label: 'Target',
                    data: targetLine,
                    borderColor: '#388e3c',
                    borderDash: [6, 4],
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false,
                    yAxisID: 'y'
                }
            ];
            const scales = {
                x: { type: 'time', time: { unit: 'day' }, ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                y: { position: 'left', ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } }
            };
            if (store.state.settings.showCaloriesOnBwChart) {
                const calRaw = store.state.history.nutrition
                    .filter(n => n.cal > 0)
                    .map(n => ({ x: new Date(n.date).setHours(0,0,0,0), y: Math.round(n.cal) }))
                    .filter(p => !cutoff || p.x >= cutoff)
                    .sort((a, b) => a.x - b.x);
                datasets.push({
                    label: 'Calories (kcal)',
                    data: calRaw,
                    borderColor: '#00e5ff',
                    backgroundColor: 'rgba(0, 229, 255, 0.15)',
                    borderWidth: 2,
                    pointRadius: 2.5,
                    tension: 0.3,
                    yAxisID: 'y1'
                });
                scales.y1 = { position: 'right', ticks: { color: '#00e5ff' }, grid: { drawOnChartArea: false } };
            }
            this.chartInstances.bw = new Chart(bwCtx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#a89f91', boxWidth: 18 } } },
                    scales
                }
            });
        }
        // 3. Weekly Hypertrophy Horizontal Bar Chart
        const hyperCtx = document.getElementById('hyperChart');
        if (hyperCtx && window.Chart) {
            const hyper = utils.getWeeklyHypertrophyStatus();
            const labels = HYPERTROPHY_GROUPS;
            const dataVals = labels.map(m => hyper.weekSets[m] || 0);
            const colors = dataVals.map(v => v >= 10 ? '#388e3c' : (v >= 5 ? '#f57c00' : '#0288d1'));
            this.chartInstances.hyper = new Chart(hyperCtx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Completed Hard Sets',
                        data: dataVals,
                        backgroundColor: colors,
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { beginAtZero: true, max: 20, ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.06)' } },
                        y: { ticks: { color: '#f4f0ea', font: { weight: 'bold' } }, grid: { display: false } }
                    }
                }
            });
        }
    },
    /* NUTRITION ACTIONS */
    changeNutritionDate(newDateStr) {
        if (!newDateStr) return;
        this.selectedNutritionDate = newDateStr;
        this.navigate('nutrition');
    },
    getOrCreateNutritionEntry(dStr) {
        let entry = store.state.history.nutrition.find(n => utils.getLocalISODate(n.date) === dStr);
        if (!entry) {
            entry = { date: dStr + 'T12:00:00.000Z', cal: 0, pro: 0, car: 0, fat: 0, loggedMeals: [], waterLog: [] };
            store.state.history.nutrition.push(entry);
        }
        if (!entry.loggedMeals) entry.loggedMeals = [];
        if (!entry.waterLog) entry.waterLog = [];
        return entry;
    },
    recalcNutritionTotals(entry) {
        let c = 0, p = 0, cb = 0, f = 0;
        (entry.loggedMeals || []).forEach(m => {
            c += parseFloat(m.cal) || 0;
            p += parseFloat(m.pro) || 0;
            cb += parseFloat(m.car) || 0;
            f += parseFloat(m.fat) || 0;
        });
        entry.cal = Math.round(c);
        entry.pro = Math.round(p);
        entry.car = Math.round(cb);
        entry.fat = Math.round(f);
        store.save();
        this.checkRankPromotion();
    },
    openMealSearchModal(dStr, mealWindowType = 'Breakfast') {
        this.activeMealWindow = mealWindowType;
        const modal = document.getElementById('meal-search-modal');
        const savedMeals = store.state.savedMeals || [];
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('meal-search-modal').style.display='none'">Close</button>
                <div style="font-weight:bold; font-size:16px;">Log ${mealWindowType}</div>
                <button class="btn btn-sm btn-primary" style="width:auto;" onclick="document.getElementById('meal-search-modal').style.display='none'; app.openMealCreateModal('${dStr}')">+ Custom</button>
            </div>
            <div style="padding:16px; overflow-y:auto; flex:1; padding-bottom:80px;">
                <input type="text" class="edit-input" placeholder="Search saved meals or NZ raw foods..." oninput="app.filterFoodModal(this.value)">
                ${savedMeals.length > 0 ? `
                    <h3 style="margin:12px 0 8px 0; color:var(--accent-color);">Your Saved Meals</h3>
                    <div id="saved-meals-modal-list">
                        ${savedMeals.map((sm, idx) => `
                            <div class="card food-modal-item" data-name="${sm.name.toLowerCase()}" style="padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                                <div style="flex:1; cursor:pointer;" onclick="app.logSavedMeal('${dStr}', ${idx}, '${mealWindowType}')">
                                    <div style="font-weight:800; font-size:15px;">${sm.name}</div>
                                    <div style="font-size:11px; color:var(--text-secondary);">${Math.round(sm.cal)} kcal • P: ${Math.round(sm.pro)}g • C: ${Math.round(sm.car)}g • F: ${Math.round(sm.fat)}g</div>
                                </div>
                                <button class="btn btn-sm btn-primary" style="width:auto;" onclick="app.logSavedMeal('${dStr}', ${idx}, '${mealWindowType}')">+ Log</button>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                <h3 style="margin:16px 0 8px 0; color:var(--accent-color);">NZ Athlete Raw & Whole Foods (Per 100g)</h3>
                <div id="raw-foods-modal-list">
                    ${NZ_ATHLETE_FOODS.map(f => `
                        <div class="card food-modal-item" data-name="${(f.name + ' ' + f.cat).toLowerCase()}" style="padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
                            <div style="flex:1; cursor:pointer;" onclick="app.promptLogRawFood('${dStr}', '${f.id}', '${mealWindowType}')">
                                <div style="font-weight:bold; font-size:14px;">${f.name} <span style="font-size:10px; color:var(--text-secondary);">(${f.cat})</span></div>
                                <div style="font-size:11px; color:var(--text-secondary);">Per 100g: ${f.cal} kcal • P: ${f.pro}g • C: ${f.car}g • F: ${f.fat}g</div>
                            </div>
                            <button class="btn btn-sm" style="width:auto;" onclick="app.promptLogRawFood('${dStr}', '${f.id}', '${mealWindowType}')">+ Grams</button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },
    filterFoodModal(q) {
        const query = (q || '').toLowerCase().trim();
        document.querySelectorAll('#meal-search-modal .food-modal-item').forEach(el => {
            const match = !query || el.getAttribute('data-name').includes(query);
            el.style.display = match ? 'flex' : 'none';
        });
    },
    logSavedMeal(dStr, savedIdx, mealWindowType) {
        const sm = store.state.savedMeals[savedIdx];
        if (!sm) return;
        const entry = this.getOrCreateNutritionEntry(dStr);
        entry.loggedMeals.push({
            name: sm.name,
            type: mealWindowType || 'Meal',
            cal: sm.cal,
            pro: sm.pro,
            car: sm.car,
            fat: sm.fat,
            ingredients: sm.ingredients ? [...sm.ingredients] : []
        });
        this.recalcNutritionTotals(entry);
        document.getElementById('meal-search-modal').style.display = 'none';
        this.navigate('nutrition');
    },
    promptLogRawFood(dStr, foodId, mealWindowType) {
        const food = NZ_ATHLETE_FOODS.find(f => f.id === foodId);
        if (!food) return;
        const gramsInput = prompt(`How many grams of "${food.name}"? (Macros scale from 100g reference):`, "150");
        if (gramsInput === null) return;
        const grams = parseFloat(gramsInput);
        if (isNaN(grams) || grams <= 0) return;
        const mult = grams / 100;
        const entry = this.getOrCreateNutritionEntry(dStr);
        entry.loggedMeals.push({
            name: food.name,
            foodId: food.id,
            grams: Math.round(grams),
            type: mealWindowType || 'Meal',
            cal: Math.round(food.cal * mult),
            pro: Math.round(food.pro * mult * 10) / 10,
            car: Math.round(food.car * mult * 10) / 10,
            fat: Math.round(food.fat * mult * 10) / 10
        });
        this.recalcNutritionTotals(entry);
        document.getElementById('meal-search-modal').style.display = 'none';
        this.navigate('nutrition');
    },
    openMealCreateModal(dStr) {
        const name = prompt("Custom Meal / Food Name:");
        if (!name || !name.trim()) return;
        const cal = parseFloat(prompt("Calories (kcal):", "450")) || 0;
        const pro = parseFloat(prompt("Protein (g):", "35")) || 0;
        const car = parseFloat(prompt("Carbs (g):", "45")) || 0;
        const fat = parseFloat(prompt("Fat (g):", "12")) || 0;
        const saveForLater = confirm("Save this meal to your Saved Meals library for 1-tap logging later?");
        if (saveForLater) {
            store.state.savedMeals.push({ name: name.trim(), cal, pro, car, fat });
        }
        const entry = this.getOrCreateNutritionEntry(dStr);
        entry.loggedMeals.push({ name: name.trim(), type: this.activeMealWindow || 'Meal', cal, pro, car, fat });
        this.recalcNutritionTotals(entry);
        this.navigate('nutrition');
    },
    promptQuickMacros(dStr) {
        this.openMealCreateModal(dStr);
    },
    removeLoggedMeal(dStr, mealIdx) {
        const entry = this.getOrCreateNutritionEntry(dStr);
        entry.loggedMeals.splice(mealIdx, 1);
        this.recalcNutritionTotals(entry);
        this.navigate('nutrition');
    },
    addWater(dStr, ml) {
        const entry = this.getOrCreateNutritionEntry(dStr);
        entry.waterLog.push({ time: new Date().toISOString(), amount: ml });
        store.save();
        this.checkRankPromotion();
        this.navigate('nutrition');
    },
    copyPastNutritionDay(targetDateStr) {
        const pastWithCals = store.state.history.nutrition
            .filter(n => n.cal > 0 && utils.getLocalISODate(n.date) !== targetDateStr)
            .sort((a, b) => new Date(b.date) - new Date(a.date));
        if (pastWithCals.length === 0) {
            alert("No previous nutrition days found to copy.");
            return;
        }
        const last = pastWithCals[0];
        if (confirm(`Copy meals from ${utils.formatDate(last.date)} (${Math.round(last.cal)} kcal, ${Math.round(last.pro)}g Protein) to ${targetDateStr}?`)) {
            const targetEntry = this.getOrCreateNutritionEntry(targetDateStr);
            targetEntry.loggedMeals = JSON.parse(JSON.stringify(last.loggedMeals || []));
            targetEntry.cal = last.cal;
            targetEntry.pro = last.pro;
            targetEntry.car = last.car;
            targetEntry.fat = last.fat;
            store.save();
            this.navigate('nutrition');
        }
    },
    promptNutritionTargets() {
        const t = store.state.settings.nutritionTargets;
        const cal = parseInt(prompt("Daily Calorie Target (kcal):", t.cal)) || t.cal;
        const pro = parseInt(prompt("Daily Protein Target (g):", t.pro)) || t.pro;
        const car = parseInt(prompt("Daily Carbohydrate Target (g):", t.car)) || t.car;
        const fat = parseInt(prompt("Daily Fat Target (g):", t.fat)) || t.fat;
        const water = parseInt(prompt("Daily Water Target (ml):", t.water || 4000)) || 4000;
        store.state.settings.nutritionTargets = { cal, pro, car, fat, water };
        store.save();
        this.navigate('nutrition');
    },
    /* PIN GOALS & CHALLENGE */
    openPinGoalsModal() {
        const modal = document.getElementById('pin-goals-modal');
        if (!store.state.challenge) {
            store.state.challenge = { isActive: true, title: 'Daily Habits', startDate: utils.getLocalISODate(new Date()), endDate: '2026-12-31', goals: [] };
        }
        const goals = store.state.challenge.goals || [];
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('pin-goals-modal').style.display='none'">Done</button>
                <div style="font-weight:bold; font-size:16px;">Pin Daily Goals</div>
                <button class="btn btn-sm btn-primary" style="width:auto;" onclick="app.addPinnedGoal()">+ Add</button>
            </div>
            <div style="padding:16px; overflow-y:auto; flex:1;">
                <div style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">Pinned goals appear directly in Today's Action Plan on your Home Dashboard.</div>
                ${goals.length === 0 ? `<div class="card text-muted" style="text-align:center;">No custom daily goals created yet. Tap + Add above!</div>` : goals.map((g, idx) => `
                    <div class="card flex-between" style="padding:12px 14px; margin-bottom:8px;">
                        <div>
                            <div style="font-weight:bold; font-size:15px;">${utils.getGoalLabel(g)}</div>
                            <div style="font-size:11px; color:var(--text-secondary);">${g.showInActionPlan ? 'Pinned to Home' : 'Hidden on Home'}</div>
                        </div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <input type="checkbox" ${g.showInActionPlan ? 'checked' : ''} onchange="app.toggleGoalPin(${idx}, this.checked)" style="width:20px; height:20px;">
                            <button class="btn-icon" style="width:28px; height:28px; color:var(--pending);" onclick="app.deletePinnedGoal(${idx})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },
    addPinnedGoal() {
        const title = prompt("Enter Daily Goal / Habit (e.g. 'Take Creatine 5g', '10k Steps', 'Read 10 Pages'):");
        if (!title || !title.trim()) return;
        store.state.challenge.isActive = true;
        if (!store.state.challenge.startDate) store.state.challenge.startDate = utils.getLocalISODate(new Date());
        if (!store.state.challenge.endDate) store.state.challenge.endDate = '2026-12-31';
        store.state.challenge.goals.push({
            id: 'g_' + utils.generateId(),
            type: 'custom',
            title: title.trim(),
            showInActionPlan: true,
            createdAt: utils.getLocalISODate(new Date())
        });
        store.save();
        this.openPinGoalsModal();
        if (this.currentPage === 'home') this.navigate('home');
    },
    toggleGoalPin(idx, pinned) {
        if (store.state.challenge && store.state.challenge.goals[idx]) {
            store.state.challenge.goals[idx].showInActionPlan = pinned;
            store.save();
            if (this.currentPage === 'home') this.navigate('home');
        }
    },
    deletePinnedGoal(idx) {
        if (store.state.challenge && store.state.challenge.goals[idx]) {
            store.state.challenge.goals.splice(idx, 1);
            store.save();
            this.openPinGoalsModal();
            if (this.currentPage === 'home') this.navigate('home');
        }
    },
    toggleChallengeGoal(dStr, goalId, goalType) {
        if (['water', 'reading', 'custom'].includes(goalType)) {
            if (!store.state.history.challengeLogs) store.state.history.challengeLogs = {};
            if (!store.state.history.challengeLogs[dStr]) store.state.history.challengeLogs[dStr] = {};
            store.state.history.challengeLogs[dStr][goalId] = !store.state.history.challengeLogs[dStr][goalId];
            store.save();
            this.checkRankPromotion();
            this.navigate(this.currentPage);
        }
    },
    /* PROFILE, PHOTOS, BACKUP & SETTINGS */
    setManageSubTab(sub) {
        this.manageSubTab = sub;
        this.navigate('data');
    },
    promptProfileEdit() {
        const name = prompt("Display Name:", store.state.user.name);
        if (name !== null && name.trim()) store.state.user.name = name.trim();
        const cw = parseFloat(prompt(`Current Weight (${utils.unitLabel()}):`, store.state.user.currentWeight));
        if (!isNaN(cw) && cw > 0) store.state.user.currentWeight = cw;
        const tw = parseFloat(prompt(`Goal Weight (${utils.unitLabel()}):`, store.state.user.targetWeight));
        if (!isNaN(tw) && tw > 0) store.state.user.targetWeight = tw;
        store.save();
        this.navigate(this.currentPage);
    },
    promptCreateMasterExercise() {
        const name = prompt(`New Exercise Name (Max ${MAX_EX_TITLE_LEN} chars):`);
        if (!name || !name.trim()) return;
        const clean = name.trim().slice(0, MAX_EX_TITLE_LEN);
        const muscles = prompt("Muscle Group(s) (comma-separated, e.g. Chest, Triceps):", "Chest");
        const parsed = (muscles || 'Other').split(',').map(s => s.trim()).filter(Boolean);
        const sets = parseInt(prompt("Default Target Sets:", "3")) || 3;
        const reps = prompt("Default Target Reps:", "8-12") || '8-12';
        store.syncExerciseGlobally(clean, { name: clean, muscles: parsed.length ? parsed : ['Other'], targetSets: sets, targetReps: reps });
        this.navigate('data');
    },
    handleProgressPhotoUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxW = 720;
                const scale = Math.min(1, maxW / img.width);
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
                if (!store.state.history.progressPhotos) store.state.history.progressPhotos = [];
                store.state.history.progressPhotos.unshift({
                    id: utils.generateId(),
                    date: new Date().toISOString(),
                    weight: store.state.user.currentWeight,
                    dataUrl
                });
                store.save();
                this.navigate('data');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    },
    deleteProgressPhoto(idx) {
        if (confirm("Remove this progress photo?")) {
            store.state.history.progressPhotos.splice(idx, 1);
            store.save();
            this.navigate('data');
        }
    },
    exportJSON() {
        const dataStr = JSON.stringify(store.state, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `IronTrack_OS_Backup_${utils.getLocalISODate(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    },
    importJSONPrompt() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json,application/json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if (parsed && parsed.history) {
                        localStorage.setItem('irontrack_os_v3', JSON.stringify(parsed));
                        store.load();
                        this.applyTheme(store.state.settings.theme || 'olympus');
                        this.navigate('home');
                        alert("Backup restored successfully!");
                    }
                } catch (err) {
                    alert("Invalid JSON backup file.");
                }
            };
            reader.readAsText(file);
        };
        input.click();
    },
    openSettingsModal() {
        const modal = document.getElementById('settings-modal');
        const s = store.state.settings;
        const f = s.features;
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('settings-modal').style.display='none'">Done</button>
                <div style="font-weight:bold; font-size:16px;">OS Settings</div>
                <div style="width:60px;"></div>
            </div>
            <div style="padding:16px; overflow-y:auto; flex:1; padding-bottom:80px;">
                <div class="card">
                    <h3 style="margin-top:0;">Theme & Units</h3>
                    <div class="data-row flex-between">
                        <span>Visual Theme</span>
                        <select class="edit-input" style="width:auto; margin:0;" onchange="app.applyTheme(this.value); app.openSettingsModal(); app.navigate(app.currentPage);">
                            <option value="olympus" ${s.theme === 'olympus' ? 'selected' : ''}>Olympus Gold & Obsidian</option>
                            <option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Classic Dark Red</option>
                            <option value="light" ${s.theme === 'light' ? 'selected' : ''}>Daylight Clean</option>
                        </select>
                    </div>
                    <div class="data-row flex-between">
                        <span>Weight Units</span>
                        <select class="edit-input" style="width:auto; margin:0;" onchange="store.state.settings.units = this.value; store.save(); app.navigate(app.currentPage);">
                            <option value="kg" ${s.units === 'kg' ? 'selected' : ''}>Kilograms (kg)</option>
                            <option value="lbs" ${s.units === 'lbs' ? 'selected' : ''}>Pounds (lbs)</option>
                        </select>
                    </div>
                    <div class="data-row flex-between">
                        <span>Rest Timer (seconds)</span>
                        <input type="number" class="inline-edit" style="width:80px;" value="${s.restTimer || 120}" onchange="store.state.settings.restTimer = parseInt(this.value)||120; store.save();">
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">Dashboard Widgets</h3>
                    ${[
                        ['showQuote', 'Daily Stoic Quote'],
                        ['showRankBanner', 'Ranked Status Banner'],
                        ['showHeatmap', '28-Day Anatomy Recovery Map'],
                        ['showWeekStrip', 'Mon-Sun Completion Strip'],
                        ['showActivityGrid', '48-Day Workout Bento Grid']
                    ].map(([key, label]) => `
                        <div class="data-row flex-between">
                            <span>${label}</span>
                            <input type="checkbox" ${f[key] ? 'checked' : ''} onchange="store.state.settings.features['${key}'] = this.checked; store.save(); app.navigate(app.currentPage);" style="width:20px; height:20px;">
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    }
};
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
