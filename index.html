                            ${Object.keys(groupedEx).map(m => `<optgroup label="${m}">${groupedEx[m].map(ge => `<option value='${JSON.stringify(ge).replace(/'/g, "&#39;")}'>${ge.name}</option>`).join('')}</optgroup>`).join('')}
                        </select>
                    </div></div>`;
                }
                html += `</div>`;
            });
        }

        html += `<div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn" style="border:1px dashed var(--accent-color); color:var(--accent-color); background:transparent;" onclick="app.addWorkoutToDay(${dayIdx}, false)">+ Add Strength Session</button>
            <button class="btn" style="border:1px dashed var(--info); color:var(--info); background:transparent;" onclick="app.addWorkoutToDay(${dayIdx}, true)">+ Add Activity</button>
        </div>`;
        return html;
    },

    renderAnalytics() {
        const curRange = store.state.settings.chartRange || '90';
        const curVolFilter = store.state.settings.lastVolFilter || 'm_Chest';
        const curWeightGoal = store.state.settings.weightGoal || 'maintaining';
        const showCal = store.state.settings.showCaloriesOnBwChart;
        const overloadFilter = store.state.settings.overloadMuscleFilter || 'All';

        let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top: calc(16px + var(--safe-top)); margin-bottom: 16px;">
            <h1 style="margin:0;">${app.sym('analytics')} Analytics</h1>
            <select class="edit-input" style="width:auto; margin:0; padding:6px 12px; font-size:13px !important;" onchange="app.updateChartRange(this.value)">
                <option value="7" ${curRange === '7' ? 'selected' : ''}>Last 7 Days</option>
                <option value="30" ${curRange === '30' ? 'selected' : ''}>Last 30 Days</option>
                <option value="90" ${curRange === '90' ? 'selected' : ''}>Last 90 Days</option>
                <option value="365" ${curRange === '365' ? 'selected' : ''}>Last 1 Year</option>
                <option value="all" ${curRange === 'all' ? 'selected' : ''}>All Time</option>
            </select>
        </div>`;

        // 7-DAY PROGRESSIVE OVERLOAD TRACKER
        const overloadList = utils.getOverloadData(overloadFilter);
        const progressedCount = overloadList.filter(o => o.hasComparison && o.diff > 0).length;
        const comparedCount = overloadList.filter(o => o.hasComparison).length;
        const overloadPct = comparedCount > 0 ? Math.round((progressedCount / comparedCount) * 100) : 0;

        html += `<div class="card" style="border: 1px solid var(--accent-color);">
            <div class="flex-between" style="margin-bottom:8px;">
                <div>
                    <span class="text-accent" style="font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:1px;">Progressive Overload</span>
                    <h2 style="margin:0; font-size:18px;">Exercise Strength Deltas</h2>
                </div>
                <select class="edit-input" style="width:auto; margin:0; padding:4px 8px; font-size:12px !important;" onchange="app.updateOverloadFilter(this.value)">
                    <option value="All" ${overloadFilter==='All'?'selected':''}>All Muscles</option>
                    ${MUSCLE_GROUPS.map(m => `<option value="${m}" ${overloadFilter===m?'selected':''}>${m}</option>`).join('')}
                </select>
            </div>
            <div class="flex-between text-muted" style="font-size:12px; margin-bottom:6px;">
                <span>Overload Rate (${progressedCount}/${comparedCount} Exercises Up)</span>
                <span style="font-weight:bold; color:var(--success);">${overloadPct}%</span>
            </div>
            <div class="progress-bg" style="height:6px; margin-bottom:12px;"><div class="progress-fill" style="width:${overloadPct}%; background:var(--success);"></div></div>
            <div style="max-height: 220px; overflow-y: auto; padding-right:4px;">`;

        if (overloadList.length === 0) {
            html += `<p class="text-muted" style="font-size:12px; text-align:center;">No exercises found for this filter.</p>`;
        } else {
            overloadList.forEach(item => {
                let badge = `<span class="text-muted" style="font-size:11px;">Baseline</span>`;
                if (item.hasComparison) {
                    if (item.diff > 0) badge = `<span class="text-success" style="font-weight:bold; font-size:12px;"><i class="fas fa-arrow-up"></i> +${item.diff.toFixed(1)} kg</span>`;
                    else if (item.diff < 0) badge = `<span class="text-pending" style="font-weight:bold; font-size:12px;"><i class="fas fa-arrow-down"></i> ${item.diff.toFixed(1)} kg</span>`;
                    else badge = `<span class="text-warning" style="font-weight:bold; font-size:12px;"><i class="fas fa-minus"></i> Maintained</span>`;
                }
                html += `<div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;">
                    <div>
                        <div style="font-weight:bold;">${item.name} ${item.variation ? `<span class="text-accent" style="font-size:11px;">(${item.variation})</span>` : ''}</div>
                        <div class="text-muted" style="font-size:10px;">${item.muscles.join(', ')} • Best e1RM: ${item.currentE1RM > 0 ? Math.round(item.currentE1RM) + ' kg' : 'Unlogged'}</div>
                    </div>
                    <div>${badge}</div>
                </div>`;
            });
        }
        html += `</div></div>`;

        // PR ZONE (Graph removed as requested; keeping PR Zone Title, Recorded PRs, and Global Strength Standards Table)
        const benchStats = utils.getLiftWorldStats('Bench');
        const squatStats = utils.getLiftWorldStats('Squat');
        const deadStats = utils.getLiftWorldStats('Deadlift');

        html += `<div class="card" style="background: linear-gradient(145deg, var(--pr-bg1), var(--pr-bg2)); border: 1px solid var(--accent-color);">
            <div class="flex-between" style="margin-bottom: 12px;"><span class="text-accent" style="font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing: 1px;">${app.sym('pr')} PR ZONE</span></div>

            <div style="border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 12px; margin-top: 4px;">
                <div class="flex-between" style="margin-bottom: 8px;">
                    <span class="text-muted" style="font-size:11px; text-transform:uppercase; letter-spacing: 0.5px;">Recorded PR's</span>
                    <span class="text-muted" style="font-size:10px;"><i class="fas fa-pen"></i> Tap lift to update</span>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 16px;">
                    ${['Bench', 'Squat', 'Deadlift'].map((lift, idx) => {
                        const colors = ['#ff3b30', '#007aff', '#34c759'];
                        const pr = store.state.prs[lift] || { weight: 0, reps: 0 };
                        const st = [benchStats, squatStats, deadStats][idx];
                        return `<div style="background: rgba(255,255,255,0.03); padding: 10px 4px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer;" onclick="app.promptPR('${lift}')">
                            <div class="text-muted" style="font-size:11px; font-weight:bold; color:${colors[idx]};">${lift}</div>
                            <div style="font-size:18px; font-weight:900; margin-top:4px;">${pr.weight}<span style="font-size:12px; font-weight:normal;">kg</span> <span class="text-accent" style="font-size:13px;">x${pr.reps}</span></div>
                            <div style="font-size:10px; color:var(--text-secondary); margin-top:2px;">e1RM: <b>${st.e1rm}kg</b> (${st.bwRatio}x BW)</div>
                        </div>`;
                    }).join('')}
                </div>

                <!-- GLOBAL STRENGTH PERCENTILE TABLE -->
                <div style="background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px; border: 1px solid var(--border);">
                    <div class="flex-between" style="margin-bottom: 8px;">
                        <span style="font-size:11px; font-weight:800; text-transform:uppercase; color:var(--text-primary); letter-spacing:0.5px;"><i class="fas fa-globe text-info"></i> Global Lifter Percentile (BW: ${store.state.user.currentWeight}kg)</span>
                        <span class="text-muted" style="font-size:10px;">Relative Strength</span>
                    </div>
                    ${[benchStats, squatStats, deadStats].map(st => `
                        <div style="padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
                            <div class="flex-between" style="font-size:12px; margin-bottom:4px;">
                                <div>
                                    <b>${st.lift}</b>
                                    <span style="font-size:10px; padding:2px 6px; border-radius:6px; background:${st.color}22; color:${st.color}; border:1px solid ${st.color}66; font-weight:bold; margin-left:6px;">${st.tier}</span>
                                </div>
                                <div style="text-align:right;">
                                    <span style="font-weight:900; color:${st.color};">Top ${st.topPercent}%</span>
                                    <span class="text-muted" style="font-size:10px; margin-left:4px;">(Next: ${st.nextTierName} @ ${st.nextTargetKg}kg)</span>
                                </div>
                            </div>
                            <div class="progress-bg" style="height:5px; background:var(--surface-elevated);">
                                <div class="progress-fill" style="width:${st.barFill}%; background:${st.color};"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>`;

        // BODYWEIGHT & CALORIES CHART
        html += `<div class="card" style="background: linear-gradient(145deg, var(--bw-bg1), var(--bw-bg2)); border: 1px solid var(--warning);">
            <div class="flex-between" style="margin-bottom:8px;">
                <span class="text-warning" style="font-size:12px; font-weight:bold; text-transform:uppercase;">${app.sym('bw')} Bodyweight & Intake</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <button class="btn btn-sm" style="padding:4px 8px; font-size:10px; width:auto; border-color:${showCal ? 'var(--warning)' : 'var(--border)'}; color:${showCal ? 'var(--warning)' : 'var(--text-secondary)'};" onclick="app.toggleCaloriesOnBwChart()">🔥 Kcal Overlay</button>
                    <select class="edit-input" style="width:auto; margin:0; padding:4px 8px; font-size:11px !important;" onchange="app.updateWeightGoal(this.value)">
                        <option value="bulking" ${curWeightGoal==='bulking'?'selected':''}>Bulking</option>
                        <option value="cutting" ${curWeightGoal==='cutting'?'selected':''}>Cutting</option>
                        <option value="maintaining" ${curWeightGoal==='maintaining'?'selected':''}>Maintaining</option>
                    </select>
                </div>
            </div>
            <div id="bw-trend-banner" style="font-size:12px; margin-bottom:8px;"></div>
            <div style="height: 200px; width: 100%;"><canvas id="bwChart"></canvas></div>
        </div>`;

        // HYPERTROPHY VOLUME CHART
        html += `<div class="card" style="background: linear-gradient(145deg, var(--vol-bg1), var(--vol-bg2)); border: 1px solid var(--info);">
            <div class="flex-between" style="margin-bottom:8px;">
                <span class="text-info" style="font-size:12px; font-weight:bold; text-transform:uppercase;">${app.sym('vol')} Hypertrophy Volume</span>
                <select id="volFilter" class="edit-input" style="width:auto; margin:0; padding:4px 8px; font-size:12px !important;" onchange="app.updateVolumeChart()">
                    ${MUSCLE_GROUPS.map(m => `<option value="m_${m}" ${curVolFilter === 'm_'+m ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
            </div>
            <div id="vol-trend-banner" style="font-size:12px; margin-bottom:8px;"></div>
            <div style="height: 200px; width: 100%;"><canvas id="volChart"></canvas></div>
        </div>`;

        return html;
    },

    renderData() {
        const curTheme = store.state.settings.theme || 'olympus';
        let html = `<h1>${app.sym('data')} Data & Settings</h1>
        <div class="card">
            <span class="text-muted" style="font-size:12px; font-weight:bold; text-transform:uppercase; display:block; margin-bottom:8px;">Visual Theme</span>
            <select class="edit-input" style="margin:0;" onchange="app.changeTheme(this.value)">
                <option value="olympus" ${curTheme === 'olympus' ? 'selected' : ''}>🏛️ Olympus (Gold & Marble)</option>
                <option value="basic" ${curTheme === 'basic' ? 'selected' : ''}>🌑 Dark OS (Crimson & Onyx)</option>
                <option value="cyberpunk" ${curTheme === 'cyberpunk' ? 'selected' : ''}>🦾 Cyberpunk (Neon & Synth)</option>
                <option value="tactical" ${curTheme === 'tactical' ? 'selected' : ''}>🪖 Tactical (OD Green & Amber)</option>
            </select>
        </div>

        <div class="card">
            <span class="text-muted" style="font-size:12px; font-weight:bold; text-transform:uppercase; display:block; margin-bottom:8px;">Backup & Restore</span>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-primary" onclick="app.exportData()"><i class="fas fa-download"></i> Export JSON</button>
                <button class="btn" onclick="document.getElementById('import-file').click()"><i class="fas fa-upload"></i> Import JSON</button>
                <input type="file" id="import-file" style="display:none;" accept=".json" onchange="app.importData(event)">
            </div>
        </div>`;

        // RECENT WORKOUT LOGS
        const recentWorkouts = [...store.state.history.workouts].reverse().slice(0, 15);
        html += `<div class="card">
            <span class="text-muted" style="font-size:12px; font-weight:bold; text-transform:uppercase; display:block; margin-bottom:12px;">Recent Workout History</span>`;
        if (recentWorkouts.length === 0) {
            html += `<p class="text-muted" style="font-size:13px;">No workouts logged yet.</p>`;
        } else {
            recentWorkouts.forEach(w => {
                html += `<div class="flex-between" style="padding:10px 0; border-bottom:1px solid var(--border);">
                    <div>
                        <div style="font-weight:bold; font-size:14px;">${w.name}</div>
                        <div class="text-muted" style="font-size:11px;">${utils.formatDate(w.date)} • ${w.duration || 0} mins</div>
                    </div>
                    <button class="btn-icon" style="width:28px; height:28px; color:var(--pending); border:none; background:transparent;" onclick="app.deleteWorkoutById('${w.id}')"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }
        html += `</div>`;

        // WEEKLY BODYWEIGHT LOGS
        const bwWeeks = utils.getWeeklyData(store.state.history.bodyweight);
        const bwKeys = Object.keys(bwWeeks).sort((a,b) => b - a);
        html += `<div class="card"><span class="text-muted" style="font-size:12px; font-weight:bold; text-transform:uppercase; display:block; margin-bottom:12px;">Bodyweight Logs</span>`;
        if (bwKeys.length === 0) { html += `<p class="text-muted" style="font-size:13px;">No bodyweight entries.</p>`; }
        else {
            bwKeys.slice(0, 4).forEach(k => {
                const entries = bwWeeks[k].entries.sort((a,b) => new Date(b.date) - new Date(a.date));
                entries.forEach(e => {
                    html += `<div class="flex-between" style="padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
                        <span>${utils.formatDate(e.date)}</span>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <input type="number" step="0.1" class="inline-edit" style="width:70px;" value="${e.weight}" onchange="app.inlineUpdateBW('${e.date}', this.value)">
                            <button class="btn-icon" style="width:24px; height:24px; color:var(--pending); border:none;" onclick="app.deleteDataEntry('bodyweight', '${e.date}')"><i class="fas fa-times"></i></button>
                        </div>
                    </div>`;
                });
            });
        }
        html += `</div>`;
        return html;
    }
};

const app = {
    currentView: 'home',
    charts: {},
    init() {
        store.load();
        this.applyTheme(store.state.settings.theme || 'olympus');
        this.navigate('home');
        if (store.state.activeSession) { workoutEngine.renderModal(); }
    },
    sym(key) {
        const t = store.state.settings.theme || 'olympus';
        const map = THEME_MAP[t] || THEME_MAP['basic'];
        return map.symbols[key] || '';
    },
    applyTheme(themeName) {
        document.documentElement.setAttribute('data-theme', themeName);
        const map = THEME_MAP[themeName] || THEME_MAP['basic'];
        const nav = document.getElementById('nav-bar');
        const labels = ['Home', 'Workouts', 'Analytics', 'Nutrition', 'Data'];
        const targets = ['home', 'workouts', 'analytics', 'nutrition', 'data'];
        nav.innerHTML = targets.map((t, i) => `
            <div class="nav-item ${this.currentView === t ? 'active' : ''}" data-target="${t}" onclick="app.navigate('${t}')">
                <i class="fas ${map.nav[i]}"></i>
                <span>${labels[i]}</span>
            </div>
        `).join('');
    },
    changeTheme(val) {
        store.state.settings.theme = val;
        store.save();
        this.applyTheme(val);
        this.navigate(this.currentView);
    },
    navigate(view, param = null) {
        this.currentView = view;
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.getAttribute('data-target') === view);
        });
        const main = document.getElementById('main-content');
        if (view === 'home') main.innerHTML = views.renderHome();
        else if (view === 'ranked-breakdown') main.innerHTML = views.renderRankedBreakdown();
        else if (view === 'workouts') main.innerHTML = views.renderWorkouts();
        else if (view === 'edit-day') main.innerHTML = views.renderEditDay(param);
        else if (view === 'analytics') { main.innerHTML = views.renderAnalytics(); setTimeout(() => this.initCharts(), 50); }
        else if (view === 'nutrition') main.innerHTML = views.renderNutrition();
        else if (view === 'data') main.innerHTML = views.renderData();
        else if (view === 'challenge') main.innerHTML = views.renderChallengeDashboard();
        else if (view === 'challenge-edit') main.innerHTML = views.renderChallengeEditor();
        window.scrollTo(0, 0);
    },

    // CHALLENGE FUNCTIONS
    syncChalInputs() {
        const c = store.state.challenge;
        const t = document.getElementById('chal-title');
        const s = document.getElementById('chal-start');
        const e = document.getElementById('chal-end');
        if (t) c.title = t.value;
        if (s) c.startDate = s.value;
        if (e) c.endDate = e.value;
    },
    addChallengeGoal(type) {
        this.syncChalInputs();
        if (!store.state.challenge.goals) store.state.challenge.goals = [];
        const newGoal = { id: utils.generateId(), type: type, showInActionPlan: false };
        if (type === 'workout') newGoal.count = 1;
        if (type === 'nutrition') { newGoal.targetType = 'any'; newGoal.calories = 2500; }
        if (type === 'water') newGoal.target = '4 Liters';
        if (type === 'reading') newGoal.target = '10 Pages';
        if (type === 'custom') newGoal.title = 'New Daily Habit';
        store.state.challenge.goals.push(newGoal);
        document.getElementById('main-content').innerHTML = views.renderChallengeEditor();
    },
    toggleGoalActionPlan(idx) {
        this.syncChalInputs();
        const g = store.state.challenge.goals[idx];
        if (g) {
            g.showInActionPlan = !g.showInActionPlan;
            store.save();
            document.getElementById('main-content').innerHTML = views.renderChallengeEditor();
        }
    },
    removeChallengeGoal(idx) {
        this.syncChalInputs();
        store.state.challenge.goals.splice(idx, 1);
        document.getElementById('main-content').innerHTML = views.renderChallengeEditor();
    },
    updateChallengeGoal(idx, field, val) {
        this.syncChalInputs();
        store.state.challenge.goals[idx][field] = val;
        store.save();
    },
    saveChallenge() {
        this.syncChalInputs();
        const c = store.state.challenge;
        if (!c.title.trim()) return alert("Please enter a Challenge Title.");
        if (!c.startDate || !c.endDate) return alert("Please select Start and End dates.");
        if (c.goals.length === 0) return alert("Please add at least one daily goal.");
        c.isActive = true;
        store.save();
        this.navigate('challenge');
    },
    endChallenge() {
        if (confirm("Are you sure you want to end this challenge?")) {
            store.state.challenge.isActive = false;
            store.save();
            this.navigate('home');
        }
    },
    toggleManualChallengeGoal(dateStr, goalId) {
        if (!store.state.history.challengeLogs) store.state.history.challengeLogs = {};
        if (!store.state.history.challengeLogs[dateStr]) store.state.history.challengeLogs[dateStr] = {};
        store.state.history.challengeLogs[dateStr][goalId] = !store.state.history.challengeLogs[dateStr][goalId];
        store.save();
        if (this.currentView === 'challenge') document.getElementById('main-content').innerHTML = views.renderChallengeDashboard();
        else if (this.currentView === 'home') document.getElementById('main-content').innerHTML = views.renderHome();
    },

    // HOME QUICK LOGS
    toggleCardioToday(e) {
        if (e) e.stopPropagation();
        const todayStr = utils.getLocalISODate(new Date());
        const idx = store.state.history.cardio.findIndex(c => c && c.date && utils.getLocalISODate(c.date) === todayStr);
        if (idx >= 0) {
            store.state.history.cardio.splice(idx, 1);
        } else {
            store.state.history.cardio.push({ date: new Date().toISOString(), type: 'Walk' });
        }
        store.save();
        this.navigate(this.currentView);
    },
    quickLogWeight(e) {
        if (e) e.stopPropagation();
        const val = prompt("Enter today's bodyweight (kg):", store.state.user.currentWeight || 80);
        if (val !== null && val.trim() !== '') {
            store.addBodyweight(val);
            this.navigate(this.currentView);
        }
    },
    openStartWorkoutModal() {
        const modal = document.getElementById('start-workout-modal');
        const r = utils.getActiveRoutine();
        const prog = utils.getTodayProgram();
        let html = `
        <div class="page-header">
            <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('start-workout-modal').style.display='none'">Cancel</button>
            <h2 style="margin:0;">Select Session</h2>
            <div style="width:60px;"></div>
        </div>`;

        if (prog.workouts.length > 0) {
            html += `<div class="card" style="border-color:var(--accent-color);">
                <span class="text-accent" style="font-size:11px; font-weight:bold; text-transform:uppercase;">Scheduled for Today</span>`;
            prog.workouts.forEach((w, idx) => {
                html += `<button class="btn btn-primary" style="margin-top:8px;" onclick="document.getElementById('start-workout-modal').style.display='none'; app.startProgramWorkout(${prog.day}, ${idx})">Start ${w.name}</button>`;
            });
            html += `</div>`;
        }

        html += `<div class="card"><span class="text-muted" style="font-size:11px; font-weight:bold; text-transform:uppercase;">All Routine Sessions</span>`;
        r.days.forEach(d => {
            d.workouts.forEach((w, idx) => {
                html += `<button class="btn" style="margin-top:8px; justify-content:space-between;" onclick="document.getElementById('start-workout-modal').style.display='none'; app.startProgramWorkout(${d.day}, ${idx})">
                    <span>${w.name}</span><span class="text-muted" style="font-size:11px;">${utils.getDayName(d.day)}</span>
                </button>`;
            });
        });
        html += `</div>
        <button class="btn" style="margin-top:8px;" onclick="document.getElementById('start-workout-modal').style.display='none'; app.logRestDay()">${app.sym('rest')} Log Rest Day Instead</button>`;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },
    startProgramWorkout(dayIdx, workoutIdx) {
        const r = utils.getActiveRoutine();
        const d = r.days.find(x => x.day === dayIdx);
        if (d && d.workouts[workoutIdx]) {
            workoutEngine.start(d.workouts[workoutIdx]);
        }
    },
    logRestDay() {
        store.addWorkout({ id: utils.generateId(), date: new Date().toISOString(), name: 'Rest Day', isSkipped: true, exercises: [] });
        this.navigate('home');
    },

    // ROUTINE MANAGEMENT
    switchRoutine(id) {
        store.state.activeRoutineId = id;
        store.save();
        this.navigate('workouts');
    },
    createNewRoutine() {
        const name = prompt("Enter New Routine Name:");
        if (!name || !name.trim()) return;
        const newR = {
            id: utils.generateId(),
            name: name.trim(),
            days: [0,1,2,3,4,5,6].map(d => ({ day: d, workouts: [] }))
        };
        store.state.routines.push(newR);
        store.state.activeRoutineId = newR.id;
        store.save();
        this.navigate('workouts');
    },
    renameActiveRoutine() {
        const r = utils.getActiveRoutine();
        const name = prompt("Rename Routine:", r.name);
        if (name && name.trim()) {
            r.name = name.trim();
            store.save();
            this.navigate('workouts');
        }
    },
    deleteActiveRoutine() {
        if (store.state.routines.length <= 1) return;
        if (confirm("Delete this routine?")) {
            store.state.routines = store.state.routines.filter(r => r.id !== store.state.activeRoutineId);
            store.state.activeRoutineId = store.state.routines[0].id;
            store.save();
            this.navigate('workouts');
        }
    },
    syncEditorInputs(dayIdx) {
        const r = utils.getActiveRoutine();
        const d = r.days.find(x => x.day === dayIdx);
        if (!d) return;
        d.workouts.forEach((w, wIdx) => {
            if (w.isActivity) return;
            (w.exercises || []).forEach((ex, exIdx) => {
                const nEl = document.getElementById(`ed-name-${wIdx}-${exIdx}`);
                const sEl = document.getElementById(`ed-sets-${wIdx}-${exIdx}`);
                const rEl = document.getElementById(`ed-reps-${wIdx}-${exIdx}`);
                if (nEl) ex.name = nEl.value;
                if (sEl) ex.targetSets = parseInt(sEl.value) || 3;
                if (rEl) ex.targetReps = rEl.value || '8-12';
            });
        });
    },
    toggleEditorMuscle(dayIdx, wIdx, exIdx, m) {
        this.syncEditorInputs(dayIdx);
        const r = utils.getActiveRoutine();
        const ex = r.days.find(d => d.day === dayIdx).workouts[wIdx].exercises[exIdx];
        let cur = utils.getMuscles(ex);
        if (cur.includes(m)) {
            cur = cur.filter(x => x !== m);
            if (cur.length === 0) cur = ['Other'];
        } else {
            cur = cur.filter(x => x !== 'Other');
            cur.push(m);
        }
        ex.muscles = cur;
        document.getElementById('main-content').innerHTML = views.renderEditDay(dayIdx);
    },
    addWorkoutToDay(dayIdx, isActivity) {
        this.syncEditorInputs(dayIdx);
        const r = utils.getActiveRoutine();
        const d = r.days.find(x => x.day === dayIdx);
        d.workouts.push({
            id: utils.generateId(),
            name: isActivity ? 'Cardio / Sports' : 'New Workout',
            isActivity: !!isActivity,
            exercises: isActivity ? [] : [{ name: 'Barbell Bench Press', targetSets: 3, targetReps: '8-10', muscles: ['Chest'] }]
        });
        document.getElementById('main-content').innerHTML = views.renderEditDay(dayIdx);
    },
    removeWorkoutFromDay(dayIdx, wIdx) {
        this.syncEditorInputs(dayIdx);
        const r = utils.getActiveRoutine();
        r.days.find(x => x.day === dayIdx).workouts.splice(wIdx, 1);
        document.getElementById('main-content').innerHTML = views.renderEditDay(dayIdx);
    },
    addExToDay(dayIdx, wIdx) {
        this.syncEditorInputs(dayIdx);
        const r = utils.getActiveRoutine();
        r.days.find(x => x.day === dayIdx).workouts[wIdx].exercises.push({ name: '', targetSets: 3, targetReps: '8-12', muscles: ['Chest'] });
        document.getElementById('main-content').innerHTML = views.renderEditDay(dayIdx);
    },
    addSavedExToDay(dayIdx, wIdx, jsonStr) {
        this.syncEditorInputs(dayIdx);
        try {
            const exObj = JSON.parse(jsonStr);
            const r = utils.getActiveRoutine();
            r.days.find(x => x.day === dayIdx).workouts[wIdx].exercises.push(exObj);
            document.getElementById('main-content').innerHTML = views.renderEditDay(dayIdx);
        } catch(e) { console.error(e); }
    },
    removeExFromDay(dayIdx, wIdx, exIdx) {
        this.syncEditorInputs(dayIdx);
        const r = utils.getActiveRoutine();
        r.days.find(x => x.day === dayIdx).workouts[wIdx].exercises.splice(exIdx, 1);
        document.getElementById('main-content').innerHTML = views.renderEditDay(dayIdx);
    },
    saveDayEdits(dayIdx) {
        this.syncEditorInputs(dayIdx);
        store.save();
        this.navigate('workouts');
    },

    // NUTRITION ACTIONS
    getOrCreateTodayNut() {
        const todayStr = utils.getLocalISODate(new Date());
        let entry = store.state.history.nutrition.find(d => utils.getLocalISODate(d.date) === todayStr);
        if (!entry) {
            entry = { date: new Date().toISOString(), cal: 0, pro: 0, car: 0, fat: 0, water: 0, mealsLogged: [] };
            store.state.history.nutrition.push(entry);
        }
        if (!entry.mealsLogged) entry.mealsLogged = [];
        return entry;
    },
    recalcTodayNut(entry) {
        entry.cal = entry.mealsLogged.reduce((s, m) => s + (parseFloat(m.cal) || 0), 0);
        entry.pro = entry.mealsLogged.reduce((s, m) => s + (parseFloat(m.pro) || 0), 0);
        entry.car = entry.mealsLogged.reduce((s, m) => s + (parseFloat(m.car) || 0), 0);
        entry.fat = entry.mealsLogged.reduce((s, m) => s + (parseFloat(m.fat) || 0), 0);
    },
    addWater(ml) {
        const entry = this.getOrCreateTodayNut();
        entry.water = Math.max(0, (entry.water || 0) + ml);
        store.save();
        this.navigate('nutrition');
    },
    editNutritionTargets() {
        const t = store.state.settings.nutritionTargets;
        const cal = prompt("Daily Calorie Target (kcal):", t.cal);
        if (cal === null) return;
        const pro = prompt("Daily Protein Target (g):", t.pro);
        const car = prompt("Daily Carbs Target (g):", t.car);
        const fat = prompt("Daily Fat Target (g):", t.fat);
        store.state.settings.nutritionTargets = {
            cal: parseInt(cal) || 2500,
            pro: parseInt(pro) || 180,
            car: parseInt(car) || 250,
            fat: parseInt(fat) || 70
        };
        store.save();
        this.navigate('nutrition');
    },
    openMealSearchModal(query = '') {
        const modal = document.getElementById('meal-search-modal');
        modal.style.display = 'flex';
        const meals = (store.state.savedMeals || []).filter(m => m.name.toLowerCase().includes(query.toLowerCase()));
        let html = `
        <div class="page-header">
            <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('meal-search-modal').style.display='none'">Close</button>
            <h2 style="margin:0;">Add Food</h2>
            <button class="btn btn-sm btn-primary" style="width:auto;" onclick="app.openCreateMealModal()">+ New Meal</button>
        </div>
        <input type="text" class="edit-input" placeholder="Search saved meals..." value="${query}" oninput="app.openMealSearchModal(this.value)">
        <div class="card" style="margin-top:8px;">
            <span class="text-muted" style="font-size:11px; font-weight:bold; text-transform:uppercase; display:block; margin-bottom:8px;">Saved Meals Library</span>`;
        if (meals.length === 0) {
            html += `<p class="text-muted" style="font-size:13px;">No matching saved meals.</p>`;
        } else {
            meals.forEach(m => {
                html += `<div class="flex-between" style="padding:10px 0; border-bottom:1px solid var(--border);">
                    <div style="flex:1; cursor:pointer;" onclick="app.logSavedMeal('${m.id}')">
                        <div style="font-weight:bold; font-size:14px;">${m.name}</div>
                        <div class="text-muted" style="font-size:11px;">${m.cal} kcal • P:${m.pro}g • C:${m.car}g • F:${m.fat}g</div>
                    </div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <button class="btn btn-sm btn-primary" style="padding:6px 10px;" onclick="app.logSavedMeal('${m.id}')">+ Log</button>
                        <button class="btn-icon" style="width:28px; height:28px; color:var(--text-secondary);" onclick="app.openCreateMealModal('${m.id}')"><i class="fas fa-pen" style="font-size:11px;"></i></button>
                        <button class="btn-icon" style="width:28px; height:28px; color:var(--pending);" onclick="app.deleteSavedMeal('${m.id}')"><i class="fas fa-trash" style="font-size:11px;"></i></button>
                    </div>
                </div>`;
            });
        }
        html += `</div>`;
        modal.innerHTML = html;
    },
    logSavedMeal(mealId) {
        const meal = store.state.savedMeals.find(m => m.id === mealId);
        if (!meal) return;
        const qtyStr = prompt(`How many servings of "${meal.name}"?`, "1");
        if (qtyStr === null) return;
        const qty = parseFloat(qtyStr) || 1;
        const entry = this.getOrCreateTodayNut();
        entry.mealsLogged.push({
            id: utils.generateId(),
            name: meal.name,
            qty: qty,
            cal: meal.cal * qty,
            pro: meal.pro * qty,
            car: meal.car * qty,
            fat: meal.fat * qty
        });
        this.recalcTodayNut(entry);
        store.save();
        document.getElementById('meal-search-modal').style.display = 'none';
        this.navigate('nutrition');
    },
    removeLoggedMeal(idx) {
        const entry = this.getOrCreateTodayNut();
        entry.mealsLogged.splice(idx, 1);
        this.recalcTodayNut(entry);
        store.save();
        this.navigate('nutrition');
    },
    openCreateMealModal(editId = null) {
        const modal = document.getElementById('meal-create-modal');
        const existing = editId ? store.state.savedMeals.find(m => m.id === editId) : { name: '', cal: '', pro: '', car: '', fat: '' };
        modal.style.display = 'flex';
        modal.innerHTML = `
        <div class="page-header">
            <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('meal-create-modal').style.display='none'">Cancel</button>
            <h2 style="margin:0;">${editId ? 'Edit Meal' : 'Create Meal'}</h2>
            <button class="btn btn-sm btn-success" style="width:auto;" onclick="app.saveCreatedMeal('${editId || ''}')">Save</button>
        </div>
        <div class="card">
            <label class="text-muted" style="font-size:12px;">Meal / Food Name</label>
            <input type="text" id="mc-name" class="edit-input" value="${existing.name}" placeholder="e.g. Chicken & Rice Bowl">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:8px;">
                <div><label class="text-muted" style="font-size:12px;">Calories (kcal)</label><input type="number" id="mc-cal" class="edit-input" value="${existing.cal}"></div>
                <div><label class="text-muted" style="font-size:12px;">Protein (g)</label><input type="number" id="mc-pro" class="edit-input" value="${existing.pro}"></div>
                <div><label class="text-muted" style="font-size:12px;">Carbs (g)</label><input type="number" id="mc-car" class="edit-input" value="${existing.car}"></div>
                <div><label class="text-muted" style="font-size:12px;">Fats (g)</label><input type="number" id="mc-fat" class="edit-input" value="${existing.fat}"></div>
            </div>
        </div>`;
    },
    saveCreatedMeal(editId) {
        const name = document.getElementById('mc-name').value.trim();
        if (!name) return alert("Enter a meal name.");
        const mealObj = {
            id: editId || utils.generateId(),
            name: name,
            cal: parseFloat(document.getElementById('mc-cal').value) || 0,
            pro: parseFloat(document.getElementById('mc-pro').value) || 0,
            car: parseFloat(document.getElementById('mc-car').value) || 0,
            fat: parseFloat(document.getElementById('mc-fat').value) || 0
        };
        if (editId) {
            const idx = store.state.savedMeals.findIndex(m => m.id === editId);
            if (idx >= 0) store.state.savedMeals[idx] = mealObj;
        } else {
            store.state.savedMeals.push(mealObj);
        }
        store.save();
        document.getElementById('meal-create-modal').style.display = 'none';
        this.openMealSearchModal();
    },
    deleteSavedMeal(id) {
        if (!confirm("Delete this saved meal?")) return;
        store.state.savedMeals = store.state.savedMeals.filter(m => m.id !== id);
        store.save();
        this.openMealSearchModal();
    },

    // ANALYTICS & PR ACTIONS
    promptPR(lift) {
        const cur = store.state.prs[lift] || { weight: 0, reps: 1 };
        const w = prompt(`Enter new ${lift} PR Weight (kg):`, cur.weight);
        if (w === null) return;
        const r = prompt(`Enter reps completed at ${w}kg:`, cur.reps);
        if (r === null) return;
        const weight = parseFloat(w) || 0;
        const reps = parseInt(r) || 1;
        store.state.prs[lift] = { weight, reps };
        store.state.history.manualPRs.push({
            date: new Date().toISOString(),
            lift: lift,
            weight: weight,
            reps: reps,
            e1rm: utils.calcE1RM(weight, reps)
        });
        store.save();
        this.navigate('analytics');
    },
    updateChartRange(val) { store.state.settings.chartRange = val; store.save(); this.navigate('analytics'); },
    updateOverloadFilter(val) { store.state.settings.overloadMuscleFilter = val; store.save(); this.navigate('analytics'); },
    updateWeightGoal(val) { store.state.settings.weightGoal = val; store.save(); this.initCharts(); },
    toggleCaloriesOnBwChart() { store.state.settings.showCaloriesOnBwChart = !store.state.settings.showCaloriesOnBwChart; store.save(); this.navigate('analytics'); },
    filterByDateRange(dataArray) {
        const range = store.state.settings.chartRange || '90';
        if (range === 'all') return dataArray;
        const cutoff = Date.now() - (parseInt(range) * 86400000);
        return dataArray.filter(pt => pt.x >= cutoff);
    },
    initCharts() {
        Chart.defaults.color = '#8e8e93';
        Chart.defaults.font.family = '-apple-system, sans-serif';
        const commonXAxis = { type: 'time', time: { tooltipFormat: 'MMM d, yyyy' }, grid: { display: false } };

        // BODYWEIGHT & CALORIE DUAL CHART
        const bwCanvas = document.getElementById('bwChart');
        if (bwCanvas) {
            if (this.charts.bw) this.charts.bw.destroy();
            const rawBw = [...store.state.history.bodyweight]
                .filter(b => b && b.date && !isNaN(new Date(b.date).getTime()))
                .sort((a,b) => new Date(a.date) - new Date(b.date))
                .map(b => ({ x: new Date(b.date).getTime(), y: b.weight }));
            const filteredBw = this.filterByDateRange(rawBw);
            const smaBw = utils.calculateSMA(filteredBw, 7);

            const datasets = [
                { label: '7d Trend', data: smaBw, borderColor: '#ff9500', borderWidth: 3, pointRadius: 0, tension: 0.4, yAxisID: 'y' },
                { label: 'Scale Weight', data: filteredBw, borderColor: 'rgba(255,149,0,0.35)', backgroundColor: 'rgba(255,149,0,0.2)', borderWidth: 1, pointRadius: 3, yAxisID: 'y' }
            ];

            if (store.state.settings.showCaloriesOnBwChart) {
                const rawCal = [...store.state.history.nutrition]
                    .filter(n => n && n.date && n.cal > 0)
                    .sort((a,b) => new Date(a.date) - new Date(b.date))
                    .map(n => ({ x: new Date(n.date).getTime(), y: n.cal }));
                const filteredCal = this.filterByDateRange(rawCal);
                datasets.push({
                    label: 'Calories (kcal)',
                    data: filteredCal,
                    borderColor: '#00e5ff',
                    backgroundColor: 'rgba(0, 229, 255, 0.1)',
                    borderWidth: 2,
                    borderDash: [4, 4],
                    pointRadius: 2,
                    tension: 0.3,
                    yAxisID: 'y1'
                });
            }

            this.charts.bw = new Chart(bwCanvas.getContext('2d'), {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, labels: { boxWidth: 10, font: { size: 10 } } } },
                    scales: {
                        x: commonXAxis,
                        y: { position: 'left', grid: { color: '#2c2c2e' } },
                        y1: { position: 'right', display: !!store.state.settings.showCaloriesOnBwChart, grid: { display: false } }
                    }
                }
            });
        }
        this.updateVolumeChart();
    },
    updateVolumeChart() {
        const volCanvas = document.getElementById('volChart'); if (!volCanvas) return;
        const filterVal = document.getElementById('volFilter').value;
        store.state.settings.lastVolFilter = filterVal; store.save();
        if (this.charts.vol) this.charts.vol.destroy();
        const { muscles } = utils.getWorkoutVolumeHistory();
        const targetName = filterVal.substring(2);
        const rawPoints = muscles[targetName] || [];
        const points = this.filterByDateRange(rawPoints);
        const smaPoints = utils.calculateSMA(points, 3);
        const banner = document.getElementById('vol-trend-banner');
        const cInfo = utils.getCssVar('--info', '#007aff');
        if (smaPoints.length >= 2) {
            const first = smaPoints[0].y; const last = smaPoints[smaPoints.length - 1].y; const diff = Math.round(last - first); const pct = first > 0 ? ((diff / first) * 100).toFixed(1) : 0;
            if (diff >= 0) { banner.innerHTML = `<span class="text-success"><i class="fas fa-arrow-trend-up"></i> Volume Trend: +${diff} kg (+${pct}%)</span>`; }
            else { banner.innerHTML = `<span class="text-pending"><i class="fas fa-arrow-trend-down"></i> Volume Trend: ${diff} kg (${pct}%)</span>`; }
        } else { banner.innerHTML = `<span class="text-muted">Need at least 2 sessions in this date range for trend</span>`; }
        this.charts.vol = new Chart(volCanvas.getContext('2d'), { type: 'line', data: { datasets: [ { label: `Trend`, data: smaPoints, borderColor: cInfo, backgroundColor: 'transparent', borderWidth: 3, tension: 0.4, pointRadius: 0 }, { label: `Session Volume`, data: points, borderColor: 'rgba(142, 142, 147, 0.3)', backgroundColor: cInfo, borderWidth: 1, borderDash: [4, 4], pointRadius: 4, showLine: true } ] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { type: 'time', time: { tooltipFormat: 'MMM d, yyyy' }, grid: { display: false } }, y: { beginAtZero: true, grid: { color: '#2c2c2e' } } } } });
    },
    inlineUpdateBW(dateStr, val) { store.updateBodyweight(dateStr, val); },
    inlineUpdateNut(dateStr, field, val) { store.updateNutrition(dateStr, field, val); },
    deleteDataEntry(type, dateStr) { if(confirm(`Delete ${type} entry?`)) { store.deleteEntry(type, dateStr); document.getElementById('main-content').innerHTML = views.renderData(); } },
    deleteWorkoutById(id) { if(confirm("Delete this workout session?")) { store.state.history.workouts = store.state.history.workouts.filter(w => w.id !== id); store.save(); document.getElementById('main-content').innerHTML = views.renderData(); } },
    exportData() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.state)); const dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr); dlAnchorElem.setAttribute("download", `irontrack_backup_${utils.getLocalISODate(new Date())}.json`); dlAnchorElem.click(); },
    importData(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); if (imported && imported.user && imported.history) { store.state = store.migrate(imported); store.save(); workoutEngine.discard(true); alert("Data successfully restored!"); app.init(); } else { alert("Invalid backup file format."); } } catch (err) { alert("Error reading file."); } }; reader.readAsText(file); }
};
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
