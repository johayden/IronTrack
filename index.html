    renderMealSearchResultsList() {
        const container = document.getElementById('meal-search-results-container');
        if (!container) return;
        const q = (this.mealSearchQuery || '').trim().toLowerCase();
        const cat = this.mealSearchCat || 'All';

        const filtered = NZ_ATHLETE_FOODS.filter(f => {
            const matchCat = cat === 'All' || f.cat === cat;
            const matchQ = !q || f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q) || (f.notes && f.notes.toLowerCase().includes(q));
            return matchCat && matchQ;
        });

        container.innerHTML = filtered.map(f => `
            <div class="card" style="padding:12px; margin-bottom:8px;">
                <div class="flex-between" style="align-items:flex-start; gap:10px;">
                    <div style="flex:1; min-width:0;">
                        <div style="font-size:10px; font-weight:800; color:var(--accent-color); text-transform:uppercase;">${f.cat}</div>
                        <div style="font-weight:900; font-size:14.5px; color:var(--text-primary);">${f.name}</div>
                        <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">
                            Per 100g: <strong style="color:var(--text-primary);">${f.cal} kcal</strong> • <strong>${f.pro}g P</strong> • ${f.car}g C • ${f.fat}g F
                        </div>
                        <div class="text-muted" style="font-size:11px; margin-top:3px;">${f.notes}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;">
                        <div style="display:flex; align-items:center; gap:4px;">
                            <input type="number" id="gram-input-${f.id}" value="150" min="5" step="10" class="inline-edit" style="width:68px; height:34px;">
                            <span style="font-size:11px; font-weight:800; color:var(--text-secondary);">g</span>
                        </div>
                        <button class="btn btn-sm btn-primary" style="width:auto; padding:6px 12px;" onclick="app.logRawFoodDirect('${f.id}')">
                            + Add
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    },

    logRawFoodDirect(foodId) {
        const food = NZ_ATHLETE_FOODS.find(f => f.id === foodId);
        if (!food) return;
        const gramInput = document.getElementById('gram-input-' + foodId);
        const grams = Math.max(1, parseFloat(gramInput ? gramInput.value : 150) || 150);
        const ratio = grams / 100;

        const cal = Math.round(food.cal * ratio);
        const pro = Math.round(food.pro * ratio * 10) / 10;
        const car = Math.round(food.car * ratio * 10) / 10;
        const fat = Math.round(food.fat * ratio * 10) / 10;

        const curDate = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(curDate);

        entry.loggedMeals.push({
            id: utils.generateId(),
            mealType: this.activeMealWindow || 'Breakfast',
            name: `${food.name} (${grams}g)`,
            cal,
            pro,
            car,
            fat,
            ingredients: [
                { foodId: food.id, name: food.name, grams, cal, pro, car, fat }
            ]
        });

        this.recalculateNutritionTotals(entry);
        store.save();
        this.renderMealSearchModalContent();
        this.refresh();
    },

    logSavedMealToDay(savedMealId) {
        const sm = (store.state.savedMeals || []).find(m => m.id === savedMealId);
        if (!sm) return;
        const curDate = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(curDate);

        entry.loggedMeals.push({
            id: utils.generateId(),
            mealType: this.activeMealWindow || 'Breakfast',
            name: sm.name,
            cal: sm.cal,
            pro: sm.pro,
            car: sm.car,
            fat: sm.fat,
            ingredients: sm.ingredients ? JSON.parse(JSON.stringify(sm.ingredients)) : []
        });

        this.recalculateNutritionTotals(entry);
        store.save();
        document.getElementById('meal-search-modal').style.display = 'none';
        this.refresh();
    },

    submitQuickCustomFood() {
        const nameEl = document.getElementById('quick-food-name');
        const calEl = document.getElementById('quick-food-cal');
        const proEl = document.getElementById('quick-food-pro');
        const carEl = document.getElementById('quick-food-car');
        const fatEl = document.getElementById('quick-food-fat');

        const name = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : `${this.activeMealWindow} Entry`;
        const cal = parseFloat(calEl ? calEl.value : 0) || 0;
        const pro = parseFloat(proEl ? proEl.value : 0) || 0;
        const car = parseFloat(carEl ? carEl.value : 0) || 0;
        const fat = parseFloat(fatEl ? fatEl.value : 0) || 0;

        const finalCal = cal > 0 ? cal : Math.round(pro * 4 + car * 4 + fat * 9);
        if (finalCal <= 0 && pro <= 0 && car <= 0 && fat <= 0) {
            alert('Please enter calories or macro grams.');
            return;
        }

        const curDate = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(curDate);

        entry.loggedMeals.push({
            id: utils.generateId(),
            mealType: this.activeMealWindow || 'Snacks',
            name,
            cal: finalCal,
            pro,
            car,
            fat,
            ingredients: []
        });

        this.recalculateNutritionTotals(entry);
        store.save();
        document.getElementById('meal-search-modal').style.display = 'none';
        this.refresh();
    },

    removeLoggedMeal(idx) {
        const curDate = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(curDate);
        if (!entry.loggedMeals || !entry.loggedMeals[idx]) return;
        entry.loggedMeals.splice(idx, 1);
        this.recalculateNutritionTotals(entry);
        store.save();
        this.refresh();
    },

    openCreateMealModal() {
        this.builderIngredients = [];
        this.builderCat = 'All';
        this.builderSearchQuery = '';
        const modal = document.getElementById('meal-create-modal');
        modal.style.display = 'flex';
        this.renderCreateMealModal();
    },

    renderCreateMealModal() {
        const modal = document.getElementById('meal-create-modal');
        if (!modal) return;
        const totals = this.builderIngredients.reduce((acc, ing) => {
            acc.cal += ing.cal;
            acc.pro += ing.pro;
            acc.car += ing.car;
            acc.fat += ing.fat;
            return acc;
        }, { cal: 0, pro: 0, car: 0, fat: 0 });

        const q = (this.builderSearchQuery || '').trim().toLowerCase();
        const filtered = NZ_ATHLETE_FOODS.filter(f => {
            const matchCat = this.builderCat === 'All' || f.cat === this.builderCat;
            const matchQ = !q || f.name.toLowerCase().includes(q);
            return matchCat && matchQ;
        });

        modal.innerHTML = `
        <div class="workout-header-sticky">
            <h2 style="font-size:18px; font-weight:900;">Custom Meal Builder</h2>
            <button class="btn-icon" onclick="document.getElementById('meal-create-modal').style.display='none'"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding:16px; overflow-y:auto; flex:1; padding-bottom:100px;">
            <label class="text-muted" style="font-size:11px; font-weight:800;">MEAL TEMPLATE NAME</label>
            <input type="text" id="builder-meal-name" class="edit-input" placeholder="e.g., Post-Lift Steak & Kumara Plate">

            <div class="card" style="border-color:var(--accent-color);">
                <div class="flex-between" style="margin-bottom:8px;">
                    <span style="font-weight:900;">Live Plate Macros</span>
                    <span style="font-weight:900; color:var(--accent-color);">${Math.round(totals.cal)} kcal</span>
                </div>
                <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:10px;">
                    Protein: <strong style="color:var(--text-primary);">${totals.pro.toFixed(1)}g</strong> •
                    Carbs: <strong style="color:var(--text-primary);">${totals.car.toFixed(1)}g</strong> •
                    Fat: <strong style="color:var(--text-primary);">${totals.fat.toFixed(1)}g</strong>
                </div>
                ${this.builderIngredients.map((ing, idx) => `
                    <div class="flex-between" style="font-size:12.5px; padding:4px 0; border-top:1px solid var(--border);">
                        <span>${ing.name} (${ing.grams}g) — ${Math.round(ing.cal)} kcal, ${ing.pro.toFixed(1)}g P</span>
                        <button class="btn-icon" style="width:26px; height:26px; color:var(--pending);" onclick="app.builderIngredients.splice(${idx},1); app.renderCreateMealModal();"><i class="fas fa-times"></i></button>
                    </div>
                `).join('')}
                <button class="btn btn-primary" style="margin-top:12px;" onclick="app.saveCustomMealTemplate()">Save & Log Meal</button>
            </div>

            <h3 style="font-size:15px; font-weight:900; margin:12px 0 8px 0;">Add NZ Athlete Ingredients</h3>
            <input type="text" class="edit-input" placeholder="Filter ingredients..." value="${this.builderSearchQuery}" oninput="app.builderSearchQuery=this.value; app.renderCreateMealModal()">
            ${filtered.map(f => `
                <div class="card flex-between" style="padding:10px 12px; margin-bottom:8px;">
                    <div style="min-width:0; flex:1; padding-right:8px;">
                        <div style="font-weight:800; font-size:13.5px;">${f.name}</div>
                        <div class="text-muted" style="font-size:11.5px;">Per 100g: ${f.cal} kcal • ${f.pro}g P • ${f.car}g C • ${f.fat}g F</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <input type="number" id="bld-g-${f.id}" value="150" class="inline-edit" style="width:64px;">
                        <button class="btn btn-sm btn-primary" style="width:auto;" onclick="app.addIngredientToBuilder('${f.id}')">+ Add</button>
                    </div>
                </div>
            `).join('')}
        </div>`;
    },

    addIngredientToBuilder(foodId) {
        const f = NZ_ATHLETE_FOODS.find(x => x.id === foodId);
        if (!f) return;
        const gEl = document.getElementById('bld-g-' + foodId);
        const grams = Math.max(1, parseFloat(gEl ? gEl.value : 150) || 150);
        const r = grams / 100;
        this.builderIngredients.push({
            foodId: f.id,
            name: f.name,
            grams,
            cal: Math.round(f.cal * r),
            pro: Math.round(f.pro * r * 10) / 10,
            car: Math.round(f.car * r * 10) / 10,
            fat: Math.round(f.fat * r * 10) / 10
        });
        this.renderCreateMealModal();
    },

    saveCustomMealTemplate() {
        if (this.builderIngredients.length === 0) {
            alert('Add at least one ingredient to your meal.');
            return;
        }
        const nameInput = document.getElementById('builder-meal-name');
        const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'Custom Athlete Plate';
        const totals = this.builderIngredients.reduce((acc, ing) => {
            acc.cal += ing.cal; acc.pro += ing.pro; acc.car += ing.car; acc.fat += ing.fat;
            return acc;
        }, { cal: 0, pro: 0, car: 0, fat: 0 });

        const newMeal = {
            id: 'sm_' + utils.generateId(),
            name,
            cal: Math.round(totals.cal),
            pro: Math.round(totals.pro * 10) / 10,
            car: Math.round(totals.car * 10) / 10,
            fat: Math.round(totals.fat * 10) / 10,
            ingredients: JSON.parse(JSON.stringify(this.builderIngredients))
        };

        store.state.savedMeals.unshift(newMeal);
        const curDate = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(curDate);
        entry.loggedMeals.push(Object.assign({}, newMeal, { id: utils.generateId(), mealType: this.activeMealWindow || 'Lunch' }));
        this.recalculateNutritionTotals(entry);
        store.save();

        document.getElementById('meal-create-modal').style.display = 'none';
        this.refresh();
    },

    openQuickMacroModal() {
        const curDate = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(curDate);
        const cal = parseFloat(prompt('Override Total Daily Calories (kcal):', entry.cal || 2400));
        if (isNaN(cal)) return;
        const pro = parseFloat(prompt('Total Daily Protein (g):', entry.pro || 180)) || 0;
        const car = parseFloat(prompt('Total Daily Carbs (g):', entry.car || 250)) || 0;
        const fat = parseFloat(prompt('Total Daily Fat (g):', entry.fat || 70)) || 0;

        entry.loggedMeals = [{
            id: utils.generateId(),
            mealType: 'Daily Override',
            name: 'Manual Daily Macro Totals',
            cal, pro, car, fat,
            ingredients: []
        }];
        this.recalculateNutritionTotals(entry);
        store.save();
        this.refresh();
    },

    openNutritionTargetsModal() {
        const t = store.state.settings.nutritionTargets;
        const cal = parseInt(prompt('Daily Calorie Target (kcal):', t.cal)) || t.cal;
        const pro = parseInt(prompt('Daily Protein Target (g):', t.pro)) || t.pro;
        const car = parseInt(prompt('Daily Carbs Target (g):', t.car)) || t.car;
        const fat = parseInt(prompt('Daily Fat Target (g):', t.fat)) || t.fat;
        const water = parseInt(prompt('Daily Water Target (ml):', t.water || 4000)) || 4000;
        store.state.settings.nutritionTargets = { cal, pro, car, fat, water };
        store.save();
        this.refresh();
    },

    logWaterQuick(amountMl = 500, dateStr = null) {
        const targetDate = dateStr || this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(targetDate);
        entry.waterLog.push({ id: utils.generateId(), amount: amountMl, time: new Date().toISOString() });
        store.save();
        this.refresh();
    },

    promptBodyweight() {
        const val = parseFloat(prompt(`Enter Bodyweight (${utils.unitLabel()}):`, store.state.user.currentWeight));
        if (!isNaN(val) && val > 20) {
            store.addBodyweight(val);
            this.refresh();
        }
    },

    toggleCustomGoalDay(dateStr, goalId) {
        if (!store.state.challenge.logs) store.state.challenge.logs = {};
        if (!store.state.challenge.logs[dateStr]) store.state.challenge.logs[dateStr] = {};
        store.state.challenge.logs[dateStr][goalId] = !store.state.challenge.logs[dateStr][goalId];
        store.save();
        this.refresh();
    },

    setActiveRoutine(rId) {
        store.state.activeRoutineId = rId;
        store.save();
        this.refresh();
    },

    /* ---------------- ANALYTICS CHARTS ---------------- */
    updateChartRange(days) {
        store.state.settings.chartRange = days;
        store.save();
        this.refresh();
    },

    setVolFilter(f) {
        store.state.settings.lastVolFilter = f;
        store.save();
        this.refresh();
    },

    setOverloadExerciseFilter(f) {
        store.state.settings.overloadExerciseFilter = f;
        store.save();
        this.refresh();
    },

    renderAnalyticsCharts() {
        if (typeof Chart === 'undefined') return;
        ['volChart', 'overloadChart', 'bwChart'].forEach(id => {
            if (this.charts[id]) { this.charts[id].destroy(); delete this.charts[id]; }
        });

        const vHist = utils.getWorkoutVolumeHistory();
        const curVolFilter = store.state.settings.lastVolFilter || 'total';
        let volPts = vHist.total;
        if (curVolFilter.startsWith('muscle:')) {
            const m = curVolFilter.split(':')[1];
            volPts = vHist.byMuscle[m] || [];
        }
        const volCanvas = document.getElementById('volChart');
        if (volCanvas) {
            this.charts.volChart = new Chart(volCanvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: volPts.map(p => utils.formatDateShort(new Date(p.x))),
                    datasets: [{
                        label: 'Volume Load',
                        data: volPts.map(p => p.y),
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56,189,248,0.15)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        const bwCanvas = document.getElementById('bwChart');
        if (bwCanvas) {
            const bwSorted = [...store.state.history.bodyweight].sort((a, b) => new Date(a.date) - new Date(b.date));
            this.charts.bwChart = new Chart(bwCanvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: bwSorted.map(b => utils.formatDateShort(new Date(b.date))),
                    datasets: [{
                        label: 'Bodyweight',
                        data: bwSorted.map(b => b.weight),
                        borderColor: '#fb923c',
                        backgroundColor: 'rgba(251,146,60,0.15)',
                        fill: true,
                        tension: 0.25
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    },

                <div class="card flex-between">
                    <span style="font-weight:800;">${utils.getGoalLabel(g)}</span>
                    <button class="btn-icon" style="color:var(--pending);" onclick="store.state.challenge.goals.splice(${idx},1); store.save(); app.openChallengeModal();"><i class="fas fa-trash"></i></button>
                </div>
            `).join('')}
        </div>`;
    },

    addChallengeGoal() {
        const lbl = prompt('Enter daily habit / goal (e.g., 10k Steps, 5g Creatine, Mobility):');
        if (!lbl) return;
        store.state.challenge.goals.push({ id: 'g_' + utils.generateId(), type: 'custom', customLabel: lbl.trim(), showInActionPlan: true });
        store.save();
        this.openChallengeModal();
    },

    openCalendarModal() {
        const modal = document.getElementById('calendar-modal');
        modal.style.display = 'flex';
        const workouts = [...store.state.history.workouts].sort((a, b) => new Date(b.date) - new Date(a.date));
        modal.innerHTML = `
        <div class="workout-header-sticky">
            <h2 style="font-size:18px; font-weight:900;">Training & Fuel Logbook</h2>
            <button class="btn-icon" onclick="document.getElementById('calendar-modal').style.display='none'"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding:16px; overflow-y:auto; flex:1;">
            ${workouts.length === 0 ? `<p class="text-muted">No workouts logged yet.</p>` : workouts.map(w => `
                <div class="card flex-between">
                    <div>
                        <div style="font-size:11px; color:var(--accent-color); font-weight:800;">${utils.formatDate(w.date)}</div>
                        <div style="font-weight:900; font-size:15px;">${w.title}</div>
                        <div class="text-muted" style="font-size:12px;">${(w.exercises || []).length} Exercises</div>
                    </div>
                    <button class="btn-icon" style="color:var(--pending);" onclick="store.deleteWorkoutById('${w.id}'); app.openCalendarModal(); app.refresh();"><i class="fas fa-trash"></i></button>
                </div>
            `).join('')}
        </div>`;
    },

    openSettingsModal() {
        const modal = document.getElementById('settings-modal');
        modal.style.display = 'flex';
        modal.innerHTML = `
        <div class="workout-header-sticky">
            <h2 style="font-size:18px; font-weight:900;">System Settings</h2>
            <button class="btn-icon" onclick="document.getElementById('settings-modal').style.display='none'; app.refresh();"><i class="fas fa-check text-accent"></i></button>
        </div>
        <div style="padding:16px; overflow-y:auto; flex:1;">
            <div class="card">
                <label style="font-size:11px; font-weight:800; color:var(--text-secondary);">THEME</label>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px;">
                    <button class="btn btn-sm" onclick="app.applyTheme('olympus')">Olympus</button>
                    <button class="btn btn-sm" onclick="app.applyTheme('dark')">Cyber Dark</button>
                    <button class="btn btn-sm" onclick="app.applyTheme('light')">Light</button>
                </div>
            </div>
            <div class="card">
                <label style="font-size:11px; font-weight:800; color:var(--text-secondary);">WEIGHT UNITS</label>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
                    <button class="btn btn-sm" onclick="store.state.settings.units='kg'; store.save(); app.openSettingsModal();">Kilograms (kg)</button>
                    <button class="btn btn-sm" onclick="store.state.settings.units='lbs'; store.save(); app.openSettingsModal();">Pounds (lbs)</button>
                </div>
            </div>
        </div>`;
    },

    promptProfileEdit() {
        const name = prompt('Athlete Name:', store.state.user.name);
        if (name) store.state.user.name = name.trim();
        const tw = parseFloat(prompt(`Target Goal Weight (${utils.unitLabel()}):`, store.state.user.targetWeight));
        if (!isNaN(tw) && tw > 20) store.state.user.targetWeight = tw;
        store.save();
        this.refresh();
    },

    promptManualPR(liftName) {
        const w = parseFloat(prompt(`Enter Best Weight (${utils.unitLabel()}) for ${liftName}:`, '100'));
        if (isNaN(w) || w <= 0) return;
        const r = parseInt(prompt(`Enter Reps Completed at ${w}${utils.unitLabel()}:`, '1')) || 1;
        store.addManualPR(liftName, w, r);
        this.refresh();
    },

    exportJSONBackup() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.state, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `irontrack_backup_${utils.getLocalISODate(new Date())}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
    },

    importJSONBackup() {
        const raw = prompt('Paste your exported IronTrack JSON backup here:');
        if (!raw) return;
        try {
            const parsed = JSON.parse(raw);
            store.state = Object.assign({}, store.state, parsed);
            store.save();
            this.refresh();
            alert('Backup restored successfully!');
        } catch(e) {
            alert('Invalid JSON backup.');
        }
    },

    checkRankPromotion() {}
};

window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
