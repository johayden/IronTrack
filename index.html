        `;
        this.filterBuilderIngredients();
    },
    filterBuilderIngredients() {
        const q = (document.getElementById('mb-ing-query')?.value || '').toLowerCase().trim();
        const cat = document.getElementById('mb-ing-cat')?.value || 'All';
        const container = document.getElementById('mb-ing-results');
        if (!container) return;
        const filtered = NZ_ATHLETE_FOODS.filter(f => {
            const matchCat = cat === 'All' || f.cat === cat;
            const matchQ = !q || f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q) || f.micros.toLowerCase().includes(q);
            return matchCat && matchQ;
        });
        container.innerHTML = filtered.map(f => `
            <div style="padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <div style="flex:1;">
                    <div style="font-weight:bold; font-size:13.5px; color:var(--text-primary);">${f.name}</div>
                    <div style="font-size:11px; color:var(--accent-color);">100g: ${f.cal} kcal • P:${f.pro}g • C:${f.car}g • F:${f.fat}g</div>
                    <div class="text-muted" style="font-size:10px;">${f.micros}</div>
                </div>
                <div style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
                    <input type="number" id="mb-add-g-${f.id}" class="inline-edit" style="width:62px; padding:5px;" value="100" step="10">
                    <span class="text-muted" style="font-size:11px;">g</span>
                    <button class="btn btn-sm btn-primary" style="width:auto; padding:6px 10px;" onclick="app.addIngredientToMealBuilder('${f.id}')">+</button>
                </div>
            </div>
        `).join('');
    },
    addIngredientToMealBuilder(foodId) {
        const food = NZ_ATHLETE_FOODS.find(f => f.id === foodId);
        if (!food) return;
        const nameEl = document.getElementById('mb-meal-name');
        if (nameEl) this.mealBuilderDraftName = nameEl.value;
        const gEl = document.getElementById('mb-add-g-' + foodId);
        const grams = Math.max(1, parseFloat(gEl ? gEl.value : 100) || 100);
        const ratio = grams / 100;
        this.mealBuilderIngredients.push({
            foodId: food.id,
            name: food.name,
            grams: grams,
            cal: Math.round(food.cal * ratio),
            pro: Math.round(food.pro * ratio * 10) / 10,
            car: Math.round(food.car * ratio * 10) / 10,
            fat: Math.round(food.fat * ratio * 10) / 10
        });
        this.renderCreateMealModalContent();
    },
    updateMealBuilderIngredientGrams(idx, newGrams) {
        const ing = this.mealBuilderIngredients[idx];
        if (!ing) return;
        const food = NZ_ATHLETE_FOODS.find(f => f.id === ing.foodId);
        const grams = Math.max(1, parseFloat(newGrams) || 100);
        ing.grams = grams;
        if (food) {
            const ratio = grams / 100;
            ing.cal = Math.round(food.cal * ratio);
            ing.pro = Math.round(food.pro * ratio * 10) / 10;
            ing.car = Math.round(food.car * ratio * 10) / 10;
            ing.fat = Math.round(food.fat * ratio * 10) / 10;
        }
        this.renderCreateMealModalContent();
    },
    removeMealBuilderIngredient(idx) {
        this.mealBuilderIngredients.splice(idx, 1);
        this.renderCreateMealModalContent();
    },
    saveBuiltMeal(alsoLogToday = false) {
        const name = (document.getElementById('mb-meal-name')?.value || '').trim();
        if (!name) {
            alert("Please give your Saved Meal a name.");
            return;
        }
        const cal = parseFloat(document.getElementById('mb-tot-cal')?.value) || 0;
        const pro = parseFloat(document.getElementById('mb-tot-pro')?.value) || 0;
        const car = parseFloat(document.getElementById('mb-tot-car')?.value) || 0;
        const fat = parseFloat(document.getElementById('mb-tot-fat')?.value) || 0;
        let savedMealObj = null;
        if (this.editingSavedMealId) {
            const idx = store.state.savedMeals.findIndex(m => m.id === this.editingSavedMealId);
            if (idx > -1) {
                store.state.savedMeals[idx] = {
                    ...store.state.savedMeals[idx],
                    name, cal, pro, car, fat,
                    ingredients: JSON.parse(JSON.stringify(this.mealBuilderIngredients))
                };
                savedMealObj = store.state.savedMeals[idx];
            }
        }
        if (!savedMealObj) {
            savedMealObj = {
                id: 'meal_' + utils.generateId(),
                name, cal, pro, car, fat,
                ingredients: JSON.parse(JSON.stringify(this.mealBuilderIngredients))
            };
            store.state.savedMeals.push(savedMealObj);
        }
        store.save();
        document.getElementById('meal-create-modal').style.display = 'none';
        if (alsoLogToday) {
            const mType = this.currentMealType || 'Breakfast';
            const entry = this.getOrCreateNutritionEntry();
            entry.loggedMeals.push({
                id: utils.generateId(),
                savedMealId: savedMealObj.id,
                name: savedMealObj.name,
                type: mType,
                multiplier: 1,
                cal: savedMealObj.cal,
                pro: savedMealObj.pro,
                car: savedMealObj.car,
                fat: savedMealObj.fat,
                ingredients: JSON.parse(JSON.stringify(savedMealObj.ingredients || []))
            });
            this.recalcDailyNutritionTotals(entry);
            document.getElementById('meal-search-modal').style.display = 'none';
        } else if (document.getElementById('meal-search-modal').style.display === 'flex') {
            this.renderMealSearchModalContent();
        }
        this.navigate('nutrition');
    },
    deleteSavedMeal(id) {
        if (confirm("Delete this saved meal from your library?")) {
            store.state.savedMeals = (store.state.savedMeals || []).filter(m => m.id !== id);
            store.save();
            if (document.getElementById('meal-search-modal').style.display === 'flex') {
                this.openSavedMealsManagerModal();
            } else {
                this.navigate('nutrition');
            }
        }
    },
    saveNutritionTargets() {
        store.state.settings.nutritionTargets = {
            cal: parseInt(document.getElementById('tgt-cal').value) || 2500,
            pro: parseInt(document.getElementById('tgt-pro').value) || 160,
            car: parseInt(document.getElementById('tgt-car').value) || 250,
            fat: parseInt(document.getElementById('tgt-fat').value) || 70
        };
        store.save();
        document.getElementById('meal-search-modal').style.display = 'none';
        this.navigate('nutrition');
    },
    copyNutritionFromDate(sourceDateStr) {
        const src = store.state.history.nutrition.find(n => utils.getLocalISODate(n.date) === sourceDateStr);
        if (!src) return;
        const targetEntry = this.getOrCreateNutritionEntry();
        if (src.loggedMeals && src.loggedMeals.length > 0) {
            src.loggedMeals.forEach(m => {
                targetEntry.loggedMeals.push({ ...JSON.parse(JSON.stringify(m)), id: utils.generateId() });
            });
            this.recalcDailyNutritionTotals(targetEntry);
        } else {
            targetEntry.cal = (targetEntry.cal || 0) + (src.cal || 0);
            targetEntry.pro = (targetEntry.pro || 0) + (src.pro || 0);
            targetEntry.car = (targetEntry.car || 0) + (src.car || 0);
            targetEntry.fat = (targetEntry.fat || 0) + (src.fat || 0);
            store.save();
        }
        this.navigate('nutrition');
    },
    promptCopyFromPastDay() {
        const past = [...store.state.history.nutrition]
            .filter(n => n.cal > 0 && utils.getLocalISODate(n.date) !== (this.activeNutritionDate || utils.getLocalISODate(new Date())))
            .sort((a,b) => new Date(b.date) - new Date(a.date));
        if (past.length === 0) {
            alert("No previous nutrition days found to copy from.");
            return;
        }
        const latestStr = utils.getLocalISODate(past[0].date);
        const chosen = prompt(`Enter date (YYYY-MM-DD) to copy meals from (Latest logged day: ${latestStr}):`, latestStr);
        if (chosen) {
            this.copyNutritionFromDate(chosen.trim());
        }
    },
    /* ANALYTICS, PROGRESSIVE OVERLOAD GRAPH & PR ZONE MANAGEMENT */
    updateChartRange(val) {

        this.navigate('analytics');

    selectOverloadGraphTab(tabName) {

        store.save();
        this.navigate('analytics');

    selectOverloadExerciseFilter(exVal) {

        this.initCharts();

    openAddTrackedPRModal() {

        let html = `
            <div class="page-header">
                <button class="btn btn-sm btn-icon" onclick="document.getElementById('exercise-selection-modal').style.display='none'"><i class="fas fa-times"></i></button>
                <h2 style="margin:0; font-size:18px;">Track Exercise in PR Zone</h2>
                <div style="width:36px;"></div>
            </div>
            <div style="padding: 0 16px;">
                <p class="text-muted" style="font-size:12px; margin-bottom:12px;">Tap + to add any exercise to your PR Zone &amp; 4-Week Maxes tracker, or tap - to remove it.</p>
        `;

                    <div style="display:flex; align-items:center; gap:10px;">

                            <div style="font-weight:bold; font-size:14px;">${ex.name}</div>

                        </div>
                    </div>
                    <button class="btn-icon" style="width:30px; height:30px; background:${isTracked ? 'var(--pending-dim)' : 'var(--accent-dim)'}; color:${isTracked ? 'var(--pending)' : 'var(--accent-color)'}; border:1px solid ${isTracked ? 'var(--pending)' : 'var(--accent-color)'};">
                        <i class="fas fa-${isTracked ? 'minus' : 'plus'}"></i>
                    </button>
                </div>`;
            });
            html += `</div>`;

    toggleTrackedPRExercise(exName) {
        if (!store.state.trackedPRs) store.state.trackedPRs = ['Bench Press', 'Squat', 'Deadlift'];
        const idx = store.state.trackedPRs.indexOf(exName);
        if (idx > -1) {
            store.state.trackedPRs.splice(idx, 1);
        } else {
            store.state.trackedPRs.push(exName);
        }
        store.save();
        this.openAddTrackedPRModal();
        if (this.currentView === 'analytics') {
            document.getElementById('main-content').innerHTML = views.renderAnalytics();
            setTimeout(() => this.initCharts(), 50);
        }
    },
    removeTrackedPR(idx) {
        if (!store.state.trackedPRs) return;
        store.state.trackedPRs.splice(idx, 1);
        store.save();
        this.navigate('analytics');
    },
    setWeightGoal(goal) {
        store.state.settings.weightGoal = goal;
        store.save();
        this.navigate('analytics');
    },
    toggleCaloriesOnBwChart() {
        store.state.settings.showCaloriesOnBwChart = !store.state.settings.showCaloriesOnBwChart;
        store.save();
        this.navigate('analytics');
    },
    logWeight() {
        const el = document.getElementById('bw-input');
        const val = parseFloat(el ? el.value : 0);
        if (!isNaN(val) && val > 0) {
            const todayStr = utils.getLocalISODate(new Date());
            const existing = store.state.history.bodyweight.find(e => utils.getLocalISODate(e.date) === todayStr);
            if (existing) store.updateBodyweight(existing.date, val);
            else store.addBodyweight(val);
            this.navigate('analytics');
        }
    },
    saveManualPR(lift, safeId = null) {
        const idKey = safeId || lift;
        const w = parseFloat(document.getElementById(`pr-w-${idKey}`)?.value) || 0;
        const r = parseInt(document.getElementById(`pr-r-${idKey}`)?.value) || 0;
        if (w <= 0 || r <= 0) {
            alert("Please enter valid weight (kg) and reps.");
            return;
        }
        if (!store.state.prs) store.state.prs = {};
        store.state.prs[lift] = { weight: w, reps: r };
        const e1rm = r === 1 ? w : w * (1 + r / 30);
        store.state.history.manualPRs.push({
            date: new Date().toISOString(),
            lift,
            weight: w,
            reps: r,
            e1rm
        });
        store.save();
        this.navigate('analytics');
    },
    initCharts() {
        Object.values(this.charts).forEach(c => { if (c && c.destroy) c.destroy(); });
        this.charts = {};
        const range = store.state.settings.chartRange || '90';
        const cutoff = range === 'all' ? 0 : (new Date().getTime() - (parseInt(range) * 86400000));

        // 1. Progressive Overload / Total Volume Combined Chart
        const vCtx = document.getElementById('volChart');
        if (vCtx) {
            const volHist = utils.getWorkoutVolumeHistory();
            const f = store.state.settings.lastVolFilter || 'total';
            const exFilter = store.state.settings.overloadExerciseFilter || 'ALL_MUSCLE';
            let rawPts = [];
            let labelTitle = 'Session Volume (kg)';
            if (f === 'total') {
                rawPts = volHist.total || [];
                labelTitle = 'Total Training Volume (kg)';
            } else if (exFilter && exFilter !== 'ALL_MUSCLE') {
                rawPts = (volHist.exercises && volHist.exercises[exFilter]) ? volHist.exercises[exFilter] : [];
                labelTitle = `${exFilter} Volume (kg)`;
            } else {
                rawPts = volHist.muscles[f] || [];
                labelTitle = `${f} Volume (kg)`;
            }
            rawPts = rawPts.filter(p => !cutoff || p.x >= cutoff);
            const smaPts = utils.calculateSMA(rawPts, 3);
            this.charts.vol = new Chart(vCtx, {
                type: 'line',
                data: {
                    datasets: [
                        { label: labelTitle, data: rawPts, borderColor: '#0288d1', backgroundColor: 'rgba(2,136,209,0.18)', fill: true, tension: 0.25, pointRadius: 4 },
                        { label: '3-Session Trend', data: smaPts, borderColor: '#ffd700', borderDash: [5, 5], pointRadius: 0, tension: 0.35 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'day' }, ticks: { color: '#cba876' }, grid: { display: false } },
                        y: { beginAtZero: false, ticks: { color: '#cba876' }, grid: { color: 'rgba(255,215,0,0.12)' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // 2. Bodyweight + Optional Calories Dual-Axis Chart
        const bwCtx = document.getElementById('bwChart');
        if (bwCtx) {
            const bwPts = store.state.history.bodyweight
                .map(e => ({ x: new Date(e.date).setHours(0,0,0,0), y: parseFloat(e.weight) }))
                .filter(p => !cutoff || p.x >= cutoff)
                .sort((a,b) => a.x - b.x);
            const smaBw = utils.calculateSMA(bwPts, 7);
            const datasets = [
                { label: 'Bodyweight (kg)', data: bwPts, borderColor: '#ff9500', backgroundColor: 'rgba(255,149,0,0.2)', yAxisID: 'y', pointRadius: 3, tension: 0.2 },
                { label: '7d Avg', data: smaBw, borderColor: '#ffffff', borderDash: [4,4], yAxisID: 'y', pointRadius: 0, tension: 0.3 }
            ];
            const showCals = store.state.settings.showCaloriesOnBwChart;
            if (showCals) {
                const calPts = store.state.history.nutrition
                    .filter(n => n.cal > 0)
                    .map(n => ({ x: new Date(n.date).setHours(0,0,0,0), y: parseFloat(n.cal) }))
                    .filter(p => !cutoff || p.x >= cutoff)
                    .sort((a,b) => a.x - b.x);
                datasets.push({
                    label: 'Calories (kcal)',
                    data: calPts,
                    borderColor: '#34c759',
                    backgroundColor: 'rgba(52,199,89,0.12)',
                    yAxisID: 'y1',
                    pointRadius: 2,
                    tension: 0.25
                });
            }
            this.charts.bw = new Chart(bwCtx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'day' }, ticks: { color: '#8e8e93' }, grid: { display: false } },
                        y: { type: 'linear', position: 'left', ticks: { color: '#ff9500' }, grid: { color: 'rgba(255,255,255,0.08)' } },
                        ...(showCals ? { y1: { type: 'linear', position: 'right', ticks: { color: '#34c759' }, grid: { drawOnChartArea: false } } } : {})
                    },
                    plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } }
                }
            });
            const fbEl = document.getElementById('bw-Feedback');
            if (fbEl) {
                if (smaBw.length >= 2) {
                    const diff = (smaBw[smaBw.length - 1].y - smaBw[0].y).toFixed(1);
                    const sign = diff > 0 ? '+' : '';
                    fbEl.innerHTML = `Trend change over selected period: <strong style="color:var(--warning);">${sign}${diff} kg</strong> (Goal: <strong style="text-transform:capitalize;">${store.state.settings.weightGoal}</strong>)`;
                } else {
                    fbEl.innerHTML = `Log at least 2 bodyweight entries to view trend analysis.`;
                }
            }
        }

        // 3. Weekly Hypertrophy Chart
        const hCtx = document.getElementById('hypertrophyChart');
        if (hCtx) {
            const hyper = utils.getWeeklyHypertrophyStatus();
            const groups = utils.getHypertrophyGroups();
            const dataVals = groups.map(g => hyper.weekSets[g] || 0);
            const barColors = dataVals.map(v => v >= 10 ? '#34c759' : (v >= 5 ? '#ff9500' : '#ff453a'));
            this.charts.hypertrophy = new Chart(hCtx, {
                type: 'bar',
                data: {
                    labels: groups,
                    datasets: [{
                        label: 'Weekly Hard Sets',
                        data: dataVals,
                        backgroundColor: barColors,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, suggestedMax: 20, grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#8e8e93' } },
                        x: { grid: { display: false }, ticks: { color: '#ffffff', font: { weight: 'bold', size: 10 } } }
                    }
                }
            });
        }
    },
    exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.state, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `irontrack_backup_${utils.getLocalISODate(new Date())}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
    },
    importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                store.state = store.migrate(imported);
                store.save();
                alert("Backup imported successfully!");
                this.init();
            } catch (err) {
                alert("Invalid backup JSON file.");
            }
        };
        reader.readAsText(file);
    }
};
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
