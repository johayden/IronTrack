        const cleanName = newNameRaw.trim().slice(0, MAX_EX_TITLE_LEN);
        if (!cleanName) { alert("Please enter an exercise name."); return; }
        const targetSets = parseInt(document.getElementById('edit-ex-sets-input')?.value) || 3;
        const targetReps = (document.getElementById('edit-ex-reps-input')?.value || '8-12').trim();
        const checkedBoxes = Array.from(document.querySelectorAll('input[name="edit-ex-muscle"]:checked'));
        const muscles = checkedBoxes.length > 0 ? checkedBoxes.map(cb => cb.value) : ['Other'];

        store.syncExerciseGlobally(oldName, { name: cleanName, muscles, targetSets, targetReps });

        if (this.draftRoutine && this.draftRoutine.days) {

    changeChallengeCalMonth(delta) {
        if (!this.challengeCalMonth) {
            const now = new Date();
            this.challengeCalMonth = { year: now.getFullYear(), month: now.getMonth() };
        }
        let m = this.challengeCalMonth.month + delta;
        let y = this.challengeCalMonth.year;
        if (m < 0) { m = 11; y--; }
        if (m > 11) { m = 0; y++; }
        this.challengeCalMonth = { year: y, month: m };
        this.navigate('challenge');

    toggleChallengeDayGoal(dateStr, goalId) {
        const todayStr = utils.getLocalISODate(new Date());
        const g = store.state.challenge.goals.find(x => x.id === goalId);
        if (!g) return;

        if (dateStr === todayStr && ['workout', 'weight', 'nutrition', 'cardio'].includes(g.type)) {
            const isMet = utils.checkGoalSuccess(dateStr, g);
            if (!isMet) {
                if (g.type === 'workout') { this.showStartWorkoutModal(); return; }
                if (g.type === 'weight') { this.promptBodyweight(); return; }
                if (g.type === 'nutrition') { this.navigate('nutrition'); return; }
                if (g.type === 'cardio') { this.promptQuickCardio(); return; }
            }
        }
        this.toggleManualGoal(dateStr, goalId);
    },
    toggleManualGoal(dateStr, goalId) {
        if (!store.state.history.challengeLogs[dateStr]) store.state.history.challengeLogs[dateStr] = {};
        store.state.history.challengeLogs[dateStr][goalId] = !store.state.history.challengeLogs[dateStr][goalId];
        store.save(); this.navigate(this.currentView);
    },
    handleActionPlanGoalClick(dateStr, goalId) {
        const g = store.state.challenge.goals.find(x => x.id === goalId);
        if (!g) return;
        if (g.type === 'cardio') {
            const isDone = utils.checkGoalSuccess(dateStr, g);
            if (isDone) { this.toggleManualGoal(dateStr, goalId); }
            else { this.promptQuickCardio(); }
        } else if (g.type === 'workout') { this.handleWorkoutRowClick(); }
        else if (g.type === 'weight') { this.promptBodyweight(); }
        else if (g.type === 'nutrition') { this.navigate('nutrition'); }
        else { this.toggleManualGoal(dateStr, goalId); }
    },

    saveTrackedPR(exName, idx) {
        const w = parseFloat(document.getElementById(`pr-w-${idx}`)?.value) || 0;
        const r = parseInt(document.getElementById(`pr-r-${idx}`)?.value) || 0;
        if (w <= 0 || r <= 0) { alert("Please enter valid weight and reps."); return; }

        if (exName === 'Bench Press') store.state.prs.Bench = { weight: w, reps: r };
        if (exName === 'Squat') store.state.prs.Squat = { weight: w, reps: r };
        if (exName === 'Deadlift') store.state.prs.Deadlift = { weight: w, reps: r };

        if (!store.state.history.manualPRs) store.state.history.manualPRs = [];
        const e1rm = r === 1 ? w : w * (1 + r / 30);
        store.state.history.manualPRs.push({ date: new Date().toISOString(), lift: exName, weight: w, reps: r, e1rm });

        const muscles = utils.getMuscles({ name: exName });
        store.addWorkout({
            id: utils.generateId(),
            date: new Date().toISOString(),
            name: `PR Log: ${exName}`,
            isActivity: false,
            isSkipped: false,
            duration: 15,
            exercises: [{ name: exName, variation: '', muscles, sets: [{ weight: w, reps: r }] }]
        });
        store.save();
        this.navigate('prs');
    },
    logCardio() {
        const mins = parseInt(document.getElementById('cardio-mins').value); const notes = document.getElementById('cardio-notes').value || 'Cardio Session';
        if (!mins || isNaN(mins)) { alert("Please enter valid minutes."); return; }
        store.state.history.cardio.push({ id: utils.generateId(), date: new Date().toISOString(), duration: mins, notes: notes }); store.save(); this.navigate('workout');
    },

    getActiveNutEntry() {
        const todayStr = utils.getLocalISODate(new Date());
        const targetDateStr = this.selectedNutritionDate || todayStr;
        let nutEntry = store.state.history.nutrition.find(e => utils.getLocalISODate(e.date) === targetDateStr);
        if (!nutEntry) {
            const parts = targetDateStr.split('-');
            const iso = targetDateStr === todayStr ? new Date().toISOString() : new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0).toISOString();
            nutEntry = { date: iso, cal: 0, pro: 0, car: 0, fat: 0, loggedMeals: [], waterLog: [] };
            store.state.history.nutrition.push(nutEntry);
        }
        return nutEntry;
    },
    setNutritionDate(dateStr) {
        if (!dateStr) return;
        this.selectedNutritionDate = dateStr;
        this.navigate('nutrition');
    },
    shiftNutritionDate(daysDelta) {
        const currStr = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const parts = currStr.split('-');
        const d = new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0);
        d.setDate(d.getDate() + daysDelta);
        this.selectedNutritionDate = utils.getLocalISODate(d);
        this.navigate('nutrition');
    },
    copyNutritionFromDate() {
        const sel = document.getElementById('copy-day-select');
        if (!sel || !sel.value) { alert("Select a past date to copy from."); return; }
        const srcDateStr = sel.value;
        const srcEntry = store.state.history.nutrition.find(e => utils.getLocalISODate(e.date) === srcDateStr);
        if (!srcEntry) return;
        const destEntry = this.getActiveNutEntry();
        if (!destEntry.loggedMeals) destEntry.loggedMeals = [];

        if (srcEntry.loggedMeals && srcEntry.loggedMeals.length > 0) {
            srcEntry.loggedMeals.forEach(m => {
                destEntry.loggedMeals.push(JSON.parse(JSON.stringify(m)));
                destEntry.cal = (destEntry.cal || 0) + (m.cal || 0);
                destEntry.pro = (destEntry.pro || 0) + (m.pro || 0);
                destEntry.car = (destEntry.car || 0) + (m.car || 0);
                destEntry.fat = (destEntry.fat || 0) + (m.fat || 0);
            });
        } else {
            destEntry.cal = (destEntry.cal || 0) + (srcEntry.cal || 0);
            destEntry.pro = (destEntry.pro || 0) + (srcEntry.pro || 0);
            destEntry.car = (destEntry.car || 0) + (srcEntry.car || 0);
            destEntry.fat = (destEntry.fat || 0) + (srcEntry.fat || 0);
        }
        store.save();
        this.navigate('nutrition');
    },
    addWater(amount) {
        let nutEntry = this.getActiveNutEntry();
        if (!nutEntry.waterLog) nutEntry.waterLog = [];
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        nutEntry.waterLog.push({ amount: parseInt(amount), time: timeStr });
        store.save(); this.navigate('nutrition');
    },
    addCustomWater() { const val = parseInt(document.getElementById('custom-water').value); if (val && val > 0) this.addWater(val); },
    removeWater(idx) {
        let nutEntry = this.getActiveNutEntry();
        if (nutEntry && nutEntry.waterLog) { nutEntry.waterLog.splice(idx, 1); store.save(); this.navigate('nutrition'); }
    },
    toggleTargetEditor() { const el = document.getElementById('target-editor'); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; },
    saveTargets() {
        store.state.settings.nutritionTargets = {
            cal: parseInt(document.getElementById('t-cal').value) || 2500,
            pro: parseInt(document.getElementById('t-pro').value) || 160,
            car: parseInt(document.getElementById('t-car').value) || 250,
            fat: parseInt(document.getElementById('t-fat').value) || 70
        };
        store.save(); this.navigate('nutrition');
    },
    setManualMacro(field, val) {
        let nutEntry = this.getActiveNutEntry();
        if (nutEntry) { nutEntry[field] = parseFloat(val) || 0; store.save(); this.navigate('nutrition'); }
    },

    logSavedMealToCategory(savedIdx, category) {
        const sm = store.state.savedMeals[savedIdx];
        if (!sm) return;
        const nutEntry = this.getActiveNutEntry();
        if (!nutEntry.loggedMeals) nutEntry.loggedMeals = [];

        nutEntry.loggedMeals.push({
            type: category || 'Snack',
            savedMealId: sm.id || sm.name,
            name: sm.name,
            cal: sm.cal || 0,
            pro: sm.pro || 0,
            car: sm.car || 0,
            fat: sm.fat || 0,
            ingredients: sm.ingredients ? JSON.parse(JSON.stringify(sm.ingredients)) : []
        });

        nutEntry.cal = (nutEntry.cal || 0) + (sm.cal || 0);
        nutEntry.pro = (nutEntry.pro || 0) + (sm.pro || 0);
        nutEntry.car = (nutEntry.car || 0) + (sm.car || 0);

    removeLoggedMeal(idx) {
        let nutEntry = this.getActiveNutEntry();
        if (nutEntry && nutEntry.loggedMeals && nutEntry.loggedMeals[idx]) {
            const m = nutEntry.loggedMeals[idx];
            nutEntry.cal = Math.max(0, (nutEntry.cal || 0) - (m.cal || 0));
            nutEntry.pro = Math.max(0, (nutEntry.pro || 0) - (m.pro || 0));
            nutEntry.car = Math.max(0, (nutEntry.car || 0) - (m.car || 0));
            nutEntry.fat = Math.max(0, (nutEntry.fat || 0) - (m.fat || 0));
            nutEntry.loggedMeals.splice(idx, 1);
            store.save(); this.navigate('nutrition');

                id: existing.id || utils.generateId(),

            };
        } else {
            this.draftMealBuilder = {
                id: utils.generateId(),
                name: '',
                ingredients: []
            };

        this.ingCategoryFilter = 'All';

        this.renderMealCreatorModal();
        modal.style.display = 'flex';
    },
    renderMealCreatorModal() {
        const modal = document.getElementById('meal-create-modal');
        const draft = this.draftMealBuilder;
        const totals = draft.ingredients.reduce((acc, ing) => {
            acc.cal += ing.cal || 0;
            acc.pro += ing.pro || 0;
            acc.car += ing.car || 0;
            acc.fat += ing.fat || 0;
            return acc;
        }, { cal: 0, pro: 0, car: 0, fat: 0 });

        const categories = ['All', ...new Set(NZ_ATHLETE_FOODS.map(f => f.cat))];
        const q = (this.ingSearchQuery || '').toLowerCase().trim();
        const catF = this.ingCategoryFilter || 'All';

        const filteredFoods = NZ_ATHLETE_FOODS.filter(f => {
            const matchesCat = (catF === 'All') || (f.cat === catF);
            const matchesQ = !q || f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q) || (f.micros && f.micros.toLowerCase().includes(q));
            return matchesCat && matchesQ;
        });

        let addedIngHtml = '';
        if (draft.ingredients.length === 0) {

        } else {
            draft.ingredients.forEach((ing, idx) => {
                addedIngHtml += `
                <div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border); gap:8px;">
                    <div style="flex:1;">
                        <div style="font-weight:700; font-size:13px; color:var(--text-primary);">${ing.name}</div>
                        <div class="text-muted" style="font-size:11px;">${Math.round(ing.cal)} kcal • P:${ing.pro.toFixed(1)}g C:${ing.car.toFixed(1)}g F:${ing.fat.toFixed(1)}g</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">

                        <span class="text-muted" style="font-size:11px;">g</span>
                        <button class="btn-icon" style="width:26px; height:26px; color:var(--pending); background:transparent; border:none;" onclick="app.removeDraftIngredient(${idx})"><i class="fas fa-times"></i></button>
                    </div>
                </div>`;

        let foodLibraryHtml = '';
        filteredFoods.forEach(food => {
            foodLibraryHtml += `
            <div class="data-row flex-between" style="padding:9px 4px; gap:8px;">
                <div style="flex:1;">
                    <div style="font-weight:700; font-size:13.5px; color:var(--text-primary);">${food.name}</div>
                    <div style="font-size:11px; color:var(--text-secondary);">
                        Per 100g: <strong style="color:var(--text-primary);">${food.cal} kcal</strong> | P:${food.pro}g C:${food.car}g F:${food.fat}g
                    </div>
                    <div style="font-size:10px; color:var(--info); margin-top:1px;">${food.cat} • ${food.micros}</div>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                    <input type="number" id="gram-in-${food.id}" class="inline-edit" style="width:62px; padding:4px; font-size:12px !important;" value="100" inputmode="numeric">
                    <span class="text-muted" style="font-size:11px;">g</span>
                    <button class="btn btn-sm btn-primary" style="padding:6px 10px; font-size:12px;" onclick="app.addFoodToDraftMeal('${food.id}')">+</button>
                </div>
            </div>`;

        modal.innerHTML = `

            <div style="padding: 0 16px 32px 16px; overflow-y:auto; flex:1;">

                    <label class="text-muted" style="font-size:11px; font-weight:800; text-transform:uppercase;">Meal Title</label>
                    <input type="text" id="draft-meal-title" class="edit-input" placeholder="e.g. Post-Workout Chicken &amp; Rice Bowl" value="${draft.name}" oninput="app.draftMealBuilder.name = this.value" style="font-size:16px !important; font-weight:bold; margin-top:4px;">

                    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; background:var(--surface-elevated); padding:10px; border-radius:10px; text-align:center; border:1px solid var(--border); margin-top:8px;">
                        <div><div class="text-muted" style="font-size:10px;">CALORIES</div><div style="font-weight:900; font-size:15px; color:var(--accent-color);">${Math.round(totals.cal)}</div></div>

                    <div style="margin-top:12px;">

    setIngredientSearch(val) {
        this.ingSearchQuery = val;

        if (el) { el.focus(); el.setSelectionRange(val.length, val.length); }

    setIngredientCatFilter(val) {
        this.ingCategoryFilter = val;
        this.renderMealCreatorModal();
    },
    addFoodToDraftMeal(foodId) {
        const food = NZ_ATHLETE_FOODS.find(f => f.id === foodId);
        if (!food) return;
        const gramsInput = document.getElementById(`gram-in-${foodId}`);
        const grams = parseFloat(gramsInput?.value) || 100;
        const ratio = grams / 100;
        this.draftMealBuilder.ingredients.push({
            foodId: food.id,
            name: food.name,
            grams: grams,
            cal: Math.round(food.cal * ratio * 10) / 10,
            pro: Math.round(food.pro * ratio * 10) / 10,
            car: Math.round(food.car * ratio * 10) / 10,
            fat: Math.round(food.fat * ratio * 10) / 10
        });
        this.renderMealCreatorModal();
    },
    updateDraftIngredientGrams(idx, newGrams) {
        const ing = this.draftMealBuilder.ingredients[idx];
        if (!ing) return;
        const g = Math.max(1, parseFloat(newGrams) || 100);
        const refFood = NZ_ATHLETE_FOODS.find(f => f.id === ing.foodId || f.name === ing.name);
        if (refFood) {
            const ratio = g / 100;
            ing.grams = g;
            ing.cal = Math.round(refFood.cal * ratio * 10) / 10;
            ing.pro = Math.round(refFood.pro * ratio * 10) / 10;
            ing.car = Math.round(refFood.car * ratio * 10) / 10;
            ing.fat = Math.round(refFood.fat * ratio * 10) / 10;
        } else {
            const factor = g / (ing.grams || 100);
            ing.grams = g;
            ing.cal = Math.round(ing.cal * factor * 10) / 10;
            ing.pro = Math.round(ing.pro * factor * 10) / 10;
            ing.car = Math.round(ing.car * factor * 10) / 10;
            ing.fat = Math.round(ing.fat * factor * 10) / 10;
        }
        this.renderMealCreatorModal();
    },
    removeDraftIngredient(idx) {
        this.draftMealBuilder.ingredients.splice(idx, 1);
        this.renderMealCreatorModal();
    },
    saveDraftMealToLibrary(andLogImmediately = false) {
        const draft = this.draftMealBuilder;
        if (!draft.name || !draft.name.trim()) { alert("Please give your meal a title."); return; }
        if (draft.ingredients.length === 0) { alert("Please add at least one raw ingredient to your meal."); return; }

        const totals = draft.ingredients.reduce((acc, ing) => {
            acc.cal += ing.cal || 0;
            acc.pro += ing.pro || 0;
            acc.car += ing.car || 0;
            acc.fat += ing.fat || 0;
            return acc;
        }, { cal: 0, pro: 0, car: 0, fat: 0 });

        const mealObj = {
            id: draft.id || utils.generateId(),
            name: draft.name.trim(),
            cal: Math.round(totals.cal),
            pro: Math.round(totals.pro * 10) / 10,
            car: Math.round(totals.car * 10) / 10,
            fat: Math.round(totals.fat * 10) / 10,
            ingredients: draft.ingredients
        };

        let targetIdx = this.editingSavedMealIdx;
        if (targetIdx !== null && store.state.savedMeals[targetIdx]) {
            store.state.savedMeals[targetIdx] = mealObj;
        } else {
            store.state.savedMeals.push(mealObj);
            targetIdx = store.state.savedMeals.length - 1;
        }
        store.save();
        document.getElementById('meal-create-modal').style.display = 'none';

        if (andLogImmediately && this.mealCreatorReturnCat) {
            this.logSavedMealToCategory(targetIdx, this.mealCreatorReturnCat);
        } else {
            this.navigate('nutrition');
        }
    },
    deleteSavedMeal(idx) {
        if(confirm("Remove this meal from your Saved Meals library?")) {
            store.state.savedMeals.splice(idx, 1);
            store.save();
            this.navigate('nutrition');
        }
    },

    deleteHistory(type, isoDate) { if(confirm("Delete this log entry?")) { store.deleteEntry(type, isoDate); this.navigate('data'); } },
    editBw(isoDate, newVal) { if(newVal && !isNaN(newVal)) { store.updateBodyweight(isoDate, newVal); } },
    editNut(isoDate, field, newVal) { if(newVal && !isNaN(newVal)) { store.updateNutrition(isoDate, field, newVal); } },

    openEditWorkoutModal(wId) {
        const w = store.state.history.workouts.find(x => x.id === wId);
        if (!w) return;
        this.editingWorkout = JSON.parse(JSON.stringify(w));
        this.renderEditWorkoutModal();
    },
    renderEditWorkoutModal() {
        const modal = document.getElementById('exercise-selection-modal');
        const w = this.editingWorkout;
        let html = `<div class="page-header"><button class="btn btn-sm btn-icon" onclick="document.getElementById('exercise-selection-modal').style.display='none'"><i class="fas fa-times"></i></button><h1 style="margin:0; font-size: 20px;">Edit Past Workout</h1><div style="width:36px;"></div></div><div style="padding: 0 16px 32px 16px; overflow-y:auto;">`;
        html += `<div class="card"><label class="text-muted" style="font-size:12px;">Workout Name</label><input type="text" class="edit-input" value="${w.name}" onchange="app.editingWorkout.name=this.value" style="font-weight:bold; font-size:18px !important; margin-bottom:12px;"><label class="text-muted" style="font-size:12px;">Duration (mins)</label><input type="number" class="edit-input" value="${w.duration}" onchange="app.editingWorkout.duration=parseInt(this.value)||0" style="margin:0;"></div>`;

        (w.exercises || []).forEach((ex, exIdx) => {
            html += `<div class="card"><div class="flex-between" style="margin-bottom:8px;"><input type="text" class="edit-input" maxlength="${MAX_EX_TITLE_LEN}" value="${ex.name}" onchange="app.editingWorkout.exercises[${exIdx}].name=this.value" style="margin:0; width:70%; font-weight:bold;"><button class="btn-icon" style="color:var(--accent-color); width:32px; height:32px;" onclick="app.editingWorkout.exercises.splice(${exIdx},1); app.renderEditWorkoutModal()"><i class="fas fa-trash"></i></button></div>`;
            ex.sets.forEach((s, sIdx) => {
                html += `<div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;"><span class="text-muted" style="width:30px; font-size:12px;">S${sIdx+1}</span><input type="number" step="0.5" class="inline-edit" style="flex:1;" value="${s.weight}" onchange="app.editingWorkout.exercises[${exIdx}].sets[${sIdx}].weight=parseFloat(this.value)||0" placeholder="kg"><span class="text-muted" style="font-size:12px;">kg</span><input type="number" class="inline-edit" style="flex:1;" value="${s.reps}" onchange="app.editingWorkout.exercises[${exIdx}].sets[${sIdx}].reps=parseInt(this.value)||0" placeholder="reps"><span class="text-muted" style="font-size:12px;">reps</span><button class="btn-icon" style="width:28px; height:28px; color:var(--pending); border:none; background:transparent;" onclick="app.editingWorkout.exercises[${exIdx}].sets.splice(${sIdx},1); app.renderEditWorkoutModal()"><i class="fas fa-times"></i></button></div>`;
            });
            html += `<button class="btn btn-sm" style="margin-top:8px; background:var(--surface-elevated); width:100%;" onclick="app.editingWorkout.exercises[${exIdx}].sets.push({weight:0, reps:0}); app.renderEditWorkoutModal()">+ Add Set</button></div>`;
        });
        html += `<button class="btn btn-success" onclick="app.saveEditedWorkout()"><i class="fas fa-check"></i> Save Changes</button></div>`;
        modal.innerHTML = html; modal.style.display = 'flex';
    },
    saveEditedWorkout() {
        const idx = store.state.history.workouts.findIndex(x => x.id === this.editingWorkout.id);
        if (idx !== -1) { store.state.history.workouts[idx] = this.editingWorkout; store.save(); }
        document.getElementById('exercise-selection-modal').style.display = 'none';
        this.navigate('data');
    },
    exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.state)); const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", `irontrack_backup_${utils.getLocalISODate(new Date())}.json`); document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove();
    },
    importData(event) {
        const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
        reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); if (imported && imported.history) { store.state = store.migrate(imported); store.save(); alert("Backup restored!"); app.applyTheme(store.state.settings.theme || 'olympus', true); } else { alert("Invalid backup file."); } } catch (err) { alert("Error reading file."); } }; reader.readAsText(file);
    },

    updateVolumeChart() {
        const filterEl = document.getElementById('vol-chart-filter');
        const filter = filterEl ? filterEl.value : (store.state.settings.lastVolFilter || 'total');
        store.state.settings.lastVolFilter = filter;
        store.save();

        const volHistory = utils.getWorkoutVolumeHistory();
        const r = store.state.settings.chartRange || '90';
        const daysLimit = r === 'all' ? 0 : parseInt(r);
        const cutoff = daysLimit === 0 ? 0 : Date.now() - (daysLimit * 86400000);

        let rawData = [];
        let labelName = 'Total Volume';
        if (filter === 'total') {
            rawData = volHistory.total || [];
            labelName = 'Total Workout Volume';
        } else if (filter.startsWith('muscle:')) {
            const mName = filter.replace('muscle:', '');
            rawData = volHistory.muscles[mName] || [];
            labelName = `${mName} Volume`;
        } else if (filter.startsWith('ex:')) {
            const exName = filter.replace('ex:', '');
            rawData = volHistory.exercises[exName] || [];
            labelName = `${exName} Volume`;
        } else {
            rawData = volHistory.muscles[filter] || [];
            labelName = `${filter} Volume`;
        }

        const filteredData = rawData.filter(d => d.x >= cutoff);
        const smaData = utils.calculateSMA(filteredData, 3);
        const color = filter === 'total' ? utils.getCssVar('--info', '#007aff') : utils.getCssVar('--accent-color', '#ffd700');

        if (this.chartInstances.vol) this.chartInstances.vol.destroy();
        const ctxVol = document.getElementById('volChart');
        if (ctxVol) {
            this.chartInstances.vol = new Chart(ctxVol, {
                type: 'line',
                data: {
                    datasets: [
                        { label: labelName, data: filteredData, borderColor: color + '55', backgroundColor: color, pointRadius: 4, showLine: false },
                        { label: `3-Workout Trend`, data: smaData, borderColor: color, backgroundColor: color + '20', borderWidth: 3, pointRadius: 0, fill: true, tension: 0.4 }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { type: 'time', time: { unit: daysLimit <= 28 && daysLimit > 0 ? 'day' : 'week' }, grid: { color: '#2c2c2e' }, ticks: { color: '#8e8e93' } },
                        y: { grid: { color: '#2c2c2e' }, ticks: { color: '#8e8e93' } }
                    },
                    plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } }
                }
            });
        }
    },

    renderAnalyticsCharts() {
        Chart.defaults.color = '#8e8e93'; Chart.defaults.font.family = '-apple-system, sans-serif';
        const r = store.state.settings.chartRange || '90'; const daysLimit = r === 'all' ? 0 : parseInt(r);
        const cutoff = daysLimit === 0 ? 0 : Date.now() - (daysLimit * 86400000);
        const accentHex = utils.getCssVar('--accent-color', '#ffd700'); const successHex = utils.getCssVar('--success', '#34c759'); const warnHex = utils.getCssVar('--warning', '#ff9500'); const pendingHex = utils.getCssVar('--pending', '#ff453a');

        const ctxWeekly = document.getElementById('weeklySetsChart');
        if (ctxWeekly) {
            const hyper = utils.getWeeklyHypertrophyStatus();
            const mGroups = utils.getHypertrophyGroups();
            const dataVals = mGroups.map(g => hyper.weekSets[g] || 0);
            const bgColors = dataVals.map(v => v >= 10 && v <= 20 ? successHex : (v > 20 ? accentHex : warnHex));

            this.chartInstances.weekly = new Chart(ctxWeekly, {
                type: 'bar',
                data: { labels: mGroups, datasets: [{ label: 'Sets This Week', data: dataVals, backgroundColor: bgColors, borderRadius: 6 }] },
                options: { indexAxis: 'y', responsive: true, scales: { x: { beginAtZero: true, suggestedMax: 20, grid: { color: '#2c2c2e' } }, y: { grid: { display: false }, ticks: { color: '#fff', font: { weight: 'bold' } } } }, plugins: { legend: { display: false } } }
            });
        }

        const bwRaw = store.state.history.bodyweight.filter(e => new Date(e.date).getTime() >= cutoff).sort((a,b) => new Date(a.date) - new Date(b.date));
        const bwWeeks = utils.getWeeklyData(bwRaw); const bwKeys = Object.keys(bwWeeks).sort((a,b) => a - b);
        const nutRaw = store.state.history.nutrition.filter(e => e.cal > 0 && new Date(e.date).getTime() >= cutoff).sort((a,b) => new Date(a.date) - new Date(b.date));
        const nutWeeks = utils.getWeeklyData(nutRaw);

        const goal = store.state.settings.weightGoal || 'maintaining';
        const showCal = store.state.settings.showCaloriesOnBwChart;

        let bwScatter = []; let bwTrend = []; let calTrend = []; let pointColors = []; let summaryHtml = '<h3 style="margin-bottom:8px;">Weekly Breakdown</h3>';
        bwRaw.forEach(e => bwScatter.push({ x: new Date(e.date).getTime(), y: e.weight }));

        bwKeys.forEach((k, idx) => {
            const w = bwWeeks[k]; const avg = w.entries.reduce((sum, e) => sum + e.weight, 0) / w.entries.length;
            const weekTimestamp = parseInt(k) + 3 * 86400000;
            bwTrend.push({ x: weekTimestamp, y: parseFloat(avg.toFixed(1)) });

            if (nutWeeks[k] && nutWeeks[k].entries.length > 0) {
                const avgCal = nutWeeks[k].entries.reduce((sum, e) => sum + e.cal, 0) / nutWeeks[k].entries.length;
                calTrend.push({ x: weekTimestamp, y: Math.round(avgCal) });
            }

            let dotColor = accentHex; let diffStr = '-';
            if (idx > 0) {
                const prevAvg = bwTrend[idx - 1].y; const diff = avg - prevAvg;
                diffStr = (diff > 0 ? '+' : '') + diff.toFixed(1) + ' kg';
                if (goal === 'cutting') dotColor = diff < -0.1 ? successHex : (diff > 0.1 ? pendingHex : warnHex);
                else if (goal === 'bulking') dotColor = diff > 0.1 ? successHex : (diff < -0.1 ? pendingHex : warnHex);
                else dotColor = Math.abs(diff) <= 0.3 ? successHex : warnHex;
            }
            pointColors.push(dotColor);

            if (idx >= bwKeys.length - 4) {
                const calBadge = (nutWeeks[k] && nutWeeks[k].entries.length > 0) ? `<span style="color:var(--text-secondary); font-size:11px; margin-left:6px;">(${Math.round(nutWeeks[k].entries.reduce((s,e)=>s+e.cal,0)/nutWeeks[k].entries.length)} kcal/d)</span>` : '';
                summaryHtml += `<div class="flex-between" style="font-size:13px; padding:6px 0; border-bottom:1px solid var(--border);"><span class="text-muted">Week of ${utils.formatDateShort(parseInt(k))}</span><div><strong style="margin-right:8px;">${avg.toFixed(1)} kg</strong><span style="color:${dotColor}; font-weight:bold;">(${diffStr})</span>${calBadge}</div></div>`;
            }
        });

        const sumContainer = document.getElementById('bw-Weekly-summary');
        if (sumContainer) sumContainer.innerHTML = bwKeys.length ? summaryHtml : '<p class="text-muted" style="font-size:12px;">Log weight across multiple weeks to see weekly averages.</p>';

        const ctxBw = document.getElementById('bwChart');
        if (ctxBw) {
            let datasets = [
                { label: 'Weekly Avg (kg)', data: bwTrend, yAxisID: 'y', borderColor: accentHex, backgroundColor: pointColors, pointBackgroundColor: pointColors, pointBorderColor: '#fff', pointBorderWidth: 1.5, borderWidth: 3, pointRadius: 6, tension: 0.3, showLine: true },
                { label: 'Daily Logs (kg)', data: bwScatter, yAxisID: 'y', borderColor: 'rgba(255,255,255,0.25)', backgroundColor: 'rgba(255,255,255,0.35)', pointRadius: 3, showLine: false }
            ];
            let scales = {
                x: { type: 'time', time: { unit: daysLimit <= 28 && daysLimit > 0 ? 'day' : 'week' }, grid: { color: '#2c2c2e' } },
                y: { type: 'linear', position: 'left', grid: { color: '#2c2c2e' }, title: { display: true, text: 'Weight (kg)', color: '#8e8e93', font: { size: 10 } } }
            };

            if (showCal && calTrend.length > 0) {
                datasets.push({
                    label: 'Weekly Avg Calories',
                    data: calTrend,
                    yAxisID: 'y1',
                    borderColor: warnHex,
                    backgroundColor: warnHex + '22',
                    borderDash: [5, 5],
                    borderWidth: 2.5,
                    pointRadius: 4,
                    pointBackgroundColor: warnHex,
                    tension: 0.3,
                    showLine: true
                });
                scales.y1 = {
                    type: 'linear',
                    position: 'right',
                    grid: { drawOnChartArea: false },
                    title: { display: true, text: 'kcal / day', color: warnHex, font: { size: 10 } },
                    ticks: { color: warnHex }
                };
            }

            this.chartInstances.bw = new Chart(ctxBw, {
                type: 'line',
                data: { datasets },
                options: { responsive: true, scales, plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } } }
            });
        }

        this.updateVolumeChart();

        const ctxOverload = document.getElementById('overloadChart');
        if (ctxOverload) {
            const ovMuscle = store.state.settings.overloadMuscleFilter || 'All';
            const ovExFilter = store.state.settings.overloadExerciseFilter || 'ALL_MUSCLE';
            const allOv = utils.getOverloadData(ovMuscle);
            const filteredOv = (ovExFilter === 'ALL_MUSCLE' ? allOv : allOv.filter(i => i.name === ovExFilter)).filter(i => i.hasComparison || i.currentE1RM > 0).slice(0, 10);

            const labels = filteredOv.map(i => i.variation ? `${i.name} (${i.variation})` : i.name);
            const diffs = filteredOv.map(i => i.hasComparison ? parseFloat(i.diff.toFixed(1)) : 0);
            const barColors = filteredOv.map(i => !i.hasComparison ? '#555558' : (i.diff >= 0 ? successHex : pendingHex));

            this.chartInstances.overload = new Chart(ctxOverload, {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['No 4w Data'],
                    datasets: [{
                        label: '4-Week E1RM Overload Δ (kg)',
                        data: labels.length ? diffs : [0],
                        backgroundColor: labels.length ? barColors : ['#333'],
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    scales: {
                        x: { grid: { color: '#2c2c2e' }, title: { display: true, text: 'E1RM Change vs Previous Session (kg)', color: '#8e8e93', font: { size: 10 } } },
                        y: { grid: { display: false }, ticks: { color: '#fff', font: { size: 11, weight: 'bold' } } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    },

    renderDataCharts() {
        Chart.defaults.color = '#8e8e93'; Chart.defaults.font.family = '-apple-system, sans-serif';
        const r = store.state.settings.chartRange || '90'; const daysLimit = r === 'all' ? 0 : parseInt(r);
        const e1rmData = utils.getE1RMHistory(daysLimit);
        const ctxE1rm = document.getElementById('e1rmChart');
        if (ctxE1rm) {
            this.chartInstances.e1rm = new Chart(ctxE1rm, {
                type: 'line',
                data: { datasets: [
                    { label: 'Bench E1RM', data: e1rmData.bench.map(d => ({x: d.ts, y: d.e1rm})), borderColor: '#ff3b30', backgroundColor: '#ff3b30', tension: 0.3, borderWidth: 2.5, pointRadius: 4 },
                    { label: 'Squat E1RM', data: e1rmData.squat.map(d => ({x: d.ts, y: d.e1rm})), borderColor: '#007aff', backgroundColor: '#007aff', tension: 0.3, borderWidth: 2.5, pointRadius: 4 },
                    { label: 'Deadlift E1RM', data: e1rmData.deadlift.map(d => ({x: d.ts, y: d.e1rm})), borderColor: '#34c759', backgroundColor: '#34c759', tension: 0.3, borderWidth: 2.5, pointRadius: 4 }
                ]},
                options: { responsive: true, scales: { x: { type: 'time', time: { unit: daysLimit <= 28 && daysLimit > 0 ? 'day' : 'week' }, grid: { color: '#2c2c2e' } }, y: { grid: { color: '#2c2c2e' } } }, plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } } }
            });
        }
    },

    renderNutritionChart() {
        const ctxNut = document.getElementById('nutChart'); if (!ctxNut) return;
        const recent = store.state.history.nutrition.filter(n => n.cal > 0).slice(-7);
        const targets = store.state.settings.nutritionTargets || { cal: 2500 };
        this.chartInstances.nut = new Chart(ctxNut, {
            type: 'bar',
            data: {
                labels: recent.map(e => utils.formatDateShort(e.date)),
                datasets: [
                    { type: 'line', label: 'Calorie Target', data: recent.map(() => targets.cal), borderColor: '#ffffff', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                    { label: 'Protein (kcal)', data: recent.map(e => e.pro * 4), backgroundColor: '#34c759' },
                    { label: 'Carbs (kcal)', data: recent.map(e => e.car * 4), backgroundColor: '#007aff' },
                    { label: 'Fat (kcal)', data: recent.map(e => e.fat * 9), backgroundColor: '#ff9500' }
                ]
            },
            options: { responsive: true, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: '#2c2c2e' } } }, plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } } }
        });
    }
};

window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
