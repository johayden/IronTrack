<!DOCTYPE html>
<html lang="en" data-theme="olympus">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d12">
    <title>IronTrack OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html {
            --primary: #0d0d12;
            --bg-color: #0d0d12;
            --surface-color: #16161e;
            --surface-elevated: #20202a;
            --text-primary: #f4f0ea;
            --text-secondary: #a89f91;
            --border: rgba(255,255,255,0.1);
            --accent-color: #ffd60a;
            --text-accent: var(--accent-color);
            --success: #34c759;
            --warning: #ff9500;
            --pending: #ff3b30;
            --info: #0288d1;
            --accent-dim: rgba(255,214,10,0.14);
            --success-dim: rgba(52,199,89,0.15);
            --warning-dim: rgba(245,124,0,0.15);
            --pending-dim: rgba(255,59,48,0.15);
            --info-dim: rgba(2,136,209,0.15);
            --vol-bg1: rgba(10, 25, 40, 0.85);
            --vol-bg2: rgba(15, 28, 35, 0.85);
            --bw-bg1: rgba(40, 25, 10, 0.85);
            --bw-bg2: rgba(45, 28, 12, 0.85);
            --pr-bg1: rgba(25, 20, 40, 0.85);
            --pr-bg2: rgba(30, 22, 45, 0.85);
        }
        [data-theme="dark"] {
            --primary: #0a0a0f;
            --bg-color: #0a0a0f;
            --surface-color: #121218;
            --surface-elevated: #1b1b24;
            --text-primary: #e4e2dd;
            --text-secondary: #999287;
            --accent-color: #00e5ff;
            --accent-dim: rgba(0,229,255,0.14);
        }
        [data-theme="light"] {
            --primary: #f2f4f8;
            --bg-color: #f2f4f8;
            --surface-color: #ffffff;
            --surface-elevated: #e9edf4;
            --text-primary: #141619;
            --text-secondary: #5a6270;
            --border: rgba(0,0,0,0.1);
            --accent-color: #0066cc;
            --accent-dim: rgba(0,102,204,0.12);
        }
        body {
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.45;
            overflow: hidden;
        }
        #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }
        #main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 105px 16px; max-width: 680px; width: 100%; margin: 0 auto; }
        #nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 74px;
            background: var(--surface-color); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom, 8px); z-index: 900;
            backdrop-filter: blur(16px);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-secondary); text-decoration: none; font-size: 10px; font-weight: 800;
            gap: 4px; cursor: pointer; flex: 1; height: 100%; letter-spacing: 0.4px;
        }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--accent-color); }
        .page-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
        .card {
            background: var(--surface-color); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; margin-bottom: 14px;
        }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .truncate-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ex-title-2line { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; }
        .pill-nowrap { white-space: nowrap; flex-shrink: 0; }
        .text-accent { color: var(--accent-color); }
        .text-muted { color: var(--text-secondary); font-size: 13px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 12px 16px; border-radius: 12px; font-weight: 800; font-size: 14px;
            border: 1px solid var(--border); background: var(--surface-elevated); color: var(--text-primary);
            cursor: pointer; transition: transform 0.12s ease, opacity 0.15s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-sm { width: auto; padding: 8px 12px; font-size: 12.5px; border-radius: 10px; }
        .btn-primary { background: var(--accent-color); color: #000000; border-color: var(--accent-color); font-weight: 900; }
        .btn-success { background: var(--success); color: #000000; border-color: var(--success); font-weight: 900; }
        .btn-icon {
            width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface-elevated); color: var(--text-primary);
            display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .edit-input {
            width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface-elevated); color: var(--text-primary); font-size: 14px; margin: 6px 0 12px 0;
        }
        .inline-edit {
            width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface-color); color: var(--text-primary); font-size: 13px; text-align: center; font-weight: 800;
        }
        .progress-bg { width: 100%; height: 8px; background: var(--surface-elevated); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
        .progress-fill { height: 100%; background: var(--accent-color); border-radius: 99px; transition: width 0.35s ease; }
        .objective-row {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            background: var(--surface-elevated); border: 1px solid var(--border);
            border-radius: 14px; margin-bottom: 10px; cursor: pointer;
        }
        .objective-row.completed { border-color: var(--success); background: var(--success-dim); }
        .check-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-secondary);
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; flex-shrink: 0;
        }
        .objective-row.completed .check-circle { background: var(--success); border-color: var(--success); color: #000; }
        .streak-flame {
            display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px;
            border-radius: 20px; font-size: 12px; font-weight: 900; cursor: pointer;
            background: var(--warning-dim); color: var(--warning); border: 1px solid var(--warning);
        }
        .level-badge {
            display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px;
            border-radius: 20px; font-size: 12px; font-weight: 900; cursor: pointer;
            background: var(--accent-dim); color: var(--accent-color); border: 1px solid var(--accent-color);
        }
        .week-check-strip {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
            background: var(--surface-color); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px; margin-bottom: 14px; text-align: center;
        }
        .week-day-circle {
            width: 30px; height: 30px; border-radius: 50%; margin: 6px auto 0 auto;
            background: var(--surface-elevated); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent;
        }
        .week-day-circle.done { background: var(--success); border-color: var(--success); color: #000; }
        .week-day-circle.today-ring { box-shadow: 0 0 0 2px var(--accent-color); }
        .home-bento-row { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; margin-bottom: 14px; }
        .home-bento-right { display: flex; flex-direction: column; gap: 12px; }
        .activity-heat-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 8px; }
        .activity-heat-cell { aspect-ratio: 1; border-radius: 3px; background: var(--surface-elevated); border: 1px solid rgba(255,255,255,0.04); }
        .activity-heat-cell.active-1 { background: rgba(255, 149, 0, 0.48); }
        .activity-heat-cell.active-2 { background: #ff9500; }
        .heatmap-svg { width: 100%; height: 220px; margin: 8px 0; }
        .weekly-plan-list { display: flex; flex-direction: column; gap: 8px; }
        .weekly-plan-row {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            padding: 12px; background: var(--surface-color); border: 1px solid var(--border); border-radius: 14px;
        }
        .routine-folder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .routine-folder-card {
            background: var(--surface-color); border: 1px solid var(--border); border-radius: 14px;
            overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
        }
        .routine-folder-tabs { height: 6px; display: flex; }
        .routine-folder-tab-layer1 { flex: 1; }
        .routine-folder-body { padding: 12px; }
        .routine-folder-start {
            padding: 10px 12px; background: var(--surface-elevated); border-top: 1px solid var(--border);
            font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
        }
        .vol-pill-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .vol-pill-btn {
            padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.35); color: var(--text-secondary); font-size: 12px; font-weight: 800;
            white-space: nowrap; cursor: pointer;
        }
        .vol-pill-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }
        .nut-meal-carousel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        .nut-meal-tile {
            background: var(--surface-color); border: 1px solid var(--border); border-radius: 14px;
            overflow: hidden; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px;
            transition: border-color 0.15s ease, transform 0.1s ease;
        }
        .nut-meal-tile:active { transform: scale(0.98); border-color: var(--accent-color); }
        .nut-meal-tile-img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
        .nut-meal-tile-body { min-width: 0; flex: 1; }
        .nut-ring-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
        .nut-ring-card {
            background: var(--surface-color); border: 1px solid var(--border); border-radius: 16px;
            padding: 14px; display: flex; flex-direction: column; align-items: center;
        }
        .nut-insight-bullet {
            display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
            border-radius: 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.4;
        }
        .nut-insight-good { background: var(--success-dim); border: 1px solid var(--success); color: var(--text-primary); }
        .nut-insight-good i { color: var(--success); }
        .nut-insight-mid { background: var(--warning-dim); border: 1px solid var(--warning); color: var(--text-primary); }
        .nut-insight-mid i { color: var(--warning); }
        .nut-insight-bad { background: var(--pending-dim); border: 1px solid var(--pending); color: var(--text-primary); }
        .nut-insight-bad i { color: var(--pending); }
        .data-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
        .data-row:last-child { border-bottom: none; }
        .medal-scroll-row { display: flex; gap: 12px; overflow-x: auto; padding: 6px 2px 10px 2px; }
        .medal-item { min-width: 92px; text-align: center; cursor: pointer; }
        .medal-disc {
            width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 6px auto;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .medal-disc.unlocked { background: var(--accent-dim); border: 2px solid var(--accent-color); color: var(--accent-color); box-shadow: 0 0 12px var(--accent-dim); }
        .medal-disc.locked { background: var(--surface-elevated); border: 1px dashed var(--border); color: var(--text-secondary); opacity: 0.45; }
        .modal-fullscreen {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 1200;
            display: none; flex-direction: column; overflow: hidden;
        }
        .workout-header-sticky {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            padding: 14px 16px; background: var(--surface-color); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
        }
        .exercise-card { background: var(--surface-color); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
        .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .set-wrapper { margin-bottom: 8px; }
        .set-row { display: grid; grid-template-columns: 36px 1fr 1fr 1fr 42px; gap: 8px; align-items: center; }
        .set-number { font-weight: 900; text-align: center; color: var(--text-secondary); font-size: 13px; }
        .input-group input {
            width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface-elevated); color: var(--text-primary); text-align: center; font-weight: 800; font-size: 15px;
        }
        .btn-check {
            width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface-elevated); color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-check.completed { background: var(--success); border-color: var(--success); color: #000; }
        #rest-timer-overlay {
            position: fixed; bottom: 88px; left: 16px; right: 16px; z-index: 1500;
            background: var(--surface-elevated); border: 2px solid var(--accent-color);
            border-radius: 16px; padding: 12px 16px; display: none; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.65);
        }
        .r6-stage-card { background: var(--surface-color); border-radius: 18px; padding: 20px 16px; margin-bottom: 16px; }
        .r6-rank-trio { display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: center; text-align: center; gap: 8px; margin: 12px 0; }
        .r6-line-wrap { position: relative; height: 10px; background: var(--surface-elevated); border-radius: 99px; overflow: hidden; margin: 14px 0; }
        .r6-line-fill { height: 100%; border-radius: 99px; }
        .r6-req-pill { display: inline-block; padding: 6px 14px; border-radius: 20px; background: var(--surface-elevated); border: 1px solid var(--border); font-size: 11px; font-weight: 900; }
        .chal-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .chal-cal-hdr { text-align: center; font-size: 10px; font-weight: 800; color: var(--text-secondary); padding-bottom: 4px; }
        .chal-cal-day {
            min-height: 62px; background: var(--surface-elevated); border: 1px solid var(--border);
            border-radius: 8px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .chal-cal-day.cal-all-met { border-color: var(--success); background: var(--success-dim); }
        .chal-cal-day.cal-partial { border-color: var(--info); background: var(--info-dim); }
        .chal-cal-day.cal-missed { border-color: rgba(255,59,48,0.4); }
        .chal-cal-day.cal-active-sel { box-shadow: 0 0 0 2px var(--accent-color); }
        #rank-promo-toast {
            position: fixed; top: 18px; left: 16px; right: 16px; z-index: 2000;
            background: var(--surface-elevated); border: 2px solid var(--accent-color); border-radius: 16px;
            padding: 12px 16px; display: none; align-items: center; gap: 12px; cursor: pointer;
            box-shadow: 0 12px 32px rgba(0,0,0,0.75);
        }
        #rank-promo-toast.show { display: flex; }
    </style>
</head>
<body>
<div id="app-container">
    <main id="main-content"></main>
    <nav id="nav-bar"></nav>
</div>

<!-- ALL FULLSCREEN MODALS & FILE INPUTS -->
<div id="active-workout-view" class="modal-fullscreen"></div>
<div id="start-workout-modal" class="modal-fullscreen"></div>
<div id="exercise-selection-modal" class="modal-fullscreen"></div>
<div id="routine-editor-modal" class="modal-fullscreen"></div>
<div id="meal-search-modal" class="modal-fullscreen"></div>
<div id="meal-create-modal" class="modal-fullscreen"></div>
<div id="rank-modal" class="modal-fullscreen"></div>
<div id="rank-details-modal" class="modal-fullscreen"></div>
<div id="calendar-modal" class="modal-fullscreen"></div>
<div id="challenge-modal" class="modal-fullscreen"></div>
<div id="settings-modal" class="modal-fullscreen"></div>

<div id="rest-timer-overlay">
    <div style="display:flex; align-items:center; gap:10px;">
        <i class="fas fa-stopwatch text-accent" style="font-size:20px;"></i>
        <div>
            <div style="font-size:10px; font-weight:800; color:var(--text-secondary); text-transform:uppercase;">Rest Timer</div>
            <div id="rest-timer-display" style="font-size:20px; font-weight:900; color:var(--text-primary);">02:00</div>
        </div>
    </div>
    <div style="display:flex; gap:8px;">
        <button class="btn-icon" onclick="workoutEngine.toggleRestTimerMute()"><i id="rest-timer-mute-icon" class="fas fa-volume-high"></i></button>
        <button class="btn btn-sm" onclick="workoutEngine.restTargetTimestamp += 30000">+30s</button>
        <button class="btn btn-sm btn-primary" onclick="workoutEngine.stopRestTimer()">Skip</button>
    </div>
</div>

<div id="rank-promo-toast"></div>
<input type="file" id="progress-photo-input" accept="image/*" style="display:none;" onchange="app.handleProgressPhotoUpload(event)">
<input type="file" id="fit-file-input" accept=".fit" style="display:none;" onchange="app.handleWorkoutFileUpload(event, 'fit')">
<input type="file" id="csv-file-input" accept=".csv" style="display:none;" onchange="app.handleWorkoutFileUpload(event, 'csv')">

    getExerciseHistory(exName, variation = '') {
        const matches = [];
        const sorted = [...this.state.history.workouts]
            .filter(w => !w.isSkipped && !w.isActivity)
            .sort((a, b) => new Date(b.date) - new Date(a.date));
        sorted.forEach(w => {
            (w.exercises || []).forEach(ex => {
                if (ex.name.toLowerCase() === exName.toLowerCase() && (ex.variation || '') === (variation || '')) {
                    matches.push({ date: w.date, sets: ex.sets || [] });
                }
            });
        });
        return matches;
    },
    getPeakSet(exName, variation = '') {
        let best = null;
        let bestE1rm = 0;
        const fourWeeksAgo = Date.now() - (28 * 86400000);
        this.state.history.workouts.forEach(w => {
            if (w.isSkipped || w.isActivity || new Date(w.date).getTime() < fourWeeksAgo) return;
            (w.exercises || []).forEach(ex => {
                if (ex.name.toLowerCase() === exName.toLowerCase() && (ex.variation || '') === (variation || '')) {
                    (ex.sets || []).forEach(s => {
                        if (s.completed !== false && s.weight > 0 && s.reps > 0) {
                            const e = s.weight * (1 + s.reps / 30);
                            if (e > bestE1rm) { bestE1rm = e; best = s; }
                        }
                    });
                }
            });
        });
        return best;
    },
    getAllTimeBestSet(exName, variation = '') {
        let best = null;
        let bestE1rm = 0;
        this.state.history.workouts.forEach(w => {
            if (w.isSkipped || w.isActivity) return;
            (w.exercises || []).forEach(ex => {
                if (ex.name.toLowerCase() === exName.toLowerCase() && (ex.variation || '') === (variation || '')) {
                    (ex.sets || []).forEach(s => {
                        if (s.completed !== false && s.weight > 0 && s.reps > 0) {
                            const e = s.weight * (1 + s.reps / 30);
                            if (e > bestE1rm) { bestE1rm = e; best = s; }
                        }
                    });
                }
            });
        });
        return best;
    },
    addManualPR(liftName, weight, reps) {
        if (!this.state.manualPRs) this.state.manualPRs = {};
        this.state.manualPRs[liftName] = { weight, reps, date: new Date().toISOString() };
        this.save();
    },
    syncExerciseGlobally(oldName, newMeta) {
        const cleanNew = (newMeta.name || oldName).trim();
        const idx = (this.state.customExercises || []).findIndex(e => e.name.toLowerCase() === oldName.toLowerCase());
        if (idx > -1) {
            this.state.customExercises[idx] = Object.assign({}, this.state.customExercises[idx], newMeta, { name: cleanNew });
        } else {
            this.state.customExercises.push({
                name: cleanNew,
                muscles: newMeta.muscles || ['Other'],
                targetSets: newMeta.targetSets || 3,
                targetReps: newMeta.targetReps || '8-12'
            });
        }
        if (EXERCISE_DB[oldName]) {
            EXERCISE_DB[cleanNew] = Object.assign({}, EXERCISE_DB[oldName], newMeta);
        }
        this.state.routines.forEach(r => {
            r.days.forEach(d => {
                (d.workouts || []).forEach(w => {
                    (w.exercises || []).forEach(ex => {
                        if (ex.name.toLowerCase() === oldName.toLowerCase()) {
                            ex.name = cleanNew;
                            ex.muscles = newMeta.muscles;
                            ex.targetSets = newMeta.targetSets;
                            ex.targetReps = newMeta.targetReps;
                        }
                    });
                });
            });
        });
        this.state.history.workouts.forEach(w => {
            (w.exercises || []).forEach(ex => {
                if (ex.name.toLowerCase() === oldName.toLowerCase()) {
                    ex.name = cleanNew;
                    ex.muscles = newMeta.muscles;
                }
            });
        });
        if (this.state.activeSession && this.state.activeSession.exercises) {
            this.state.activeSession.exercises.forEach(ex => {
                if (ex.name.toLowerCase() === oldName.toLowerCase()) {
                    ex.name = cleanNew;
                    ex.muscles = newMeta.muscles;
                    ex.targetSets = newMeta.targetSets;
                    ex.targetReps = newMeta.targetReps;
                }
            });
        }
        this.save();
    }
};

const utils = {
    generateId: () => Math.random().toString(36).substring(2, 10) + Date.now().toString(36).slice(-4),
    unitLabel: () => (store.state.settings && store.state.settings.units) ? store.state.settings.units : 'kg',
    truncate: (str, maxLen = 28) => {
        if (!str) return '';
        return str.length > maxLen ? str.slice(0, maxLen - 1) + '…' : str;
    },
    getLocalISODate: (dInput) => {
        if (typeof dInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dInput.trim())) {
            return dInput.trim();
        }
        const d = dInput ? new Date(dInput) : new Date();
        if (isNaN(d.getTime())) {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },
    formatDate: (isoStr) => {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return String(isoStr || '');
        return d.toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    },
    formatDateShort: (dObj) => {
        const d = (dObj instanceof Date) ? dObj : new Date(dObj);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
    },
    getDayName: (dayIdx) => ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dayIdx] || 'Day',
    getDayShort: (dayIdx) => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dayIdx] || 'Day',
    getMonday: (dInput) => {
        const d = new Date(dInput);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const mon = new Date(d.setDate(diff));
        mon.setHours(0, 0, 0, 0);
        return mon.getTime();
    },
    getActiveRoutine: () => {
        return store.state.routines.find(r => r.id === store.state.activeRoutineId) || store.state.routines[0];
    },
    getTodayProgram: () => {
        const active = utils.getActiveRoutine();
        const todayIdx = new Date().getDay();
        return active.days.find(d => d.day === todayIdx) || { day: todayIdx, workouts: [] };
    },
    getAllMuscleGroups: () => ['Chest', 'Back', 'Shoulders', 'Quads', 'Hamstrings', 'Biceps', 'Triceps', 'Abs', 'Calves', 'Other'],
    getMasterExercise: (name) => {
        const custom = (store.state.customExercises || []).find(e => e.name.toLowerCase() === (name || '').toLowerCase());
        if (custom) return custom;
        if (EXERCISE_DB[name]) return Object.assign({ name }, EXERCISE_DB[name]);
        const key = Object.keys(EXERCISE_DB).find(k => k.toLowerCase() === (name || '').toLowerCase());
        if (key) return Object.assign({ name: key }, EXERCISE_DB[key]);
        return { name: name || 'Exercise', muscles: ['Other'], targetSets: 3, targetReps: '8-12' };
    },
    getMuscles: (exObj) => {
        if (exObj && Array.isArray(exObj.muscles) && exObj.muscles.length > 0) return exObj.muscles;
        const m = utils.getMasterExercise(exObj ? exObj.name : '');
        return m.muscles || ['Other'];
    },
    getPrimaryMuscle: (exObj) => {
        const m = utils.getMuscles(exObj);
        return m[0] || 'Other';
    },
    getExerciseImage: (exName, primaryMuscle = 'Other') => {
        const master = utils.getMasterExercise(exName);
        if (master && master.img) return master.img;
        const fallbackByMuscle = {
            Chest: 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=200&q=80',
            Back: 'https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=200&q=80',
            Shoulders: 'https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=200&q=80',
            Quads: 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=200&q=80',
            Hamstrings: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=200&q=80',
            Biceps: 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=200&q=80',
            Triceps: 'https://images.unsplash.com/photo-1530822847156-5df684ec5ee1?auto=format&fit=crop&w=200&q=80'
        };
        return fallbackByMuscle[primaryMuscle] || 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=200&q=80';
    },
    getGroupedExercises: () => {
        const map = {};
        const reg = (ex) => {
            const p = utils.getPrimaryMuscle(ex).toUpperCase();
            if (!map[p]) map[p] = [];
            if (!map[p].some(x => x.name.toLowerCase() === ex.name.toLowerCase())) {
                map[p].push(ex);
            }
        };
        Object.keys(EXERCISE_DB).forEach(k => reg(Object.assign({ name: k }, EXERCISE_DB[k])));
        (store.state.customExercises || []).forEach(ex => reg(ex));
        return map;
    },
    calcVolume: (sets) => {
        return (sets || []).reduce((acc, s) => {
            if (s.completed === false) return acc;
            return acc + ((parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0));
        }, 0);
    },
    calculateSMA: (dataPoints, windowSize = 3) => {
        if (!dataPoints || dataPoints.length === 0) return [];
        return dataPoints.map((pt, idx) => {
            const start = Math.max(0, idx - windowSize + 1);
            const slice = dataPoints.slice(start, idx + 1);
            const avg = slice.reduce((s, x) => s + x.y, 0) / slice.length;
            return { x: pt.x, y: Math.round(avg * 10) / 10 };
        });
    },
    getWorkoutVolumeHistory: () => {
        const total = [];
        const byMuscle = {};
        const byExercise = {};
        const sorted = [...store.state.history.workouts]
            .filter(w => !w.isSkipped && !w.isActivity)
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        sorted.forEach(w => {
            const ts = new Date(w.date).getTime();
            let sessionVol = 0;
            const sessionMuscleVol = {};
            (w.exercises || []).forEach(ex => {
                const v = utils.calcVolume(ex.sets || []);
                if (v > 0) {
                    sessionVol += v;
                    if (!byExercise[ex.name]) byExercise[ex.name] = [];
                    byExercise[ex.name].push({ x: ts, y: v });
                    utils.getMuscles(ex).forEach(m => {
                        sessionMuscleVol[m] = (sessionMuscleVol[m] || 0) + v;
                    });
                }
            });
            if (sessionVol > 0) total.push({ x: ts, y: sessionVol });
            Object.keys(sessionMuscleVol).forEach(m => {
                if (!byMuscle[m]) byMuscle[m] = [];
                byMuscle[m].push({ x: ts, y: sessionMuscleVol[m] });
            });
        });
        return { total, byMuscle, byExercise };
    },
    getExerciseOrderFatigueAnalysis: (exercisesList, currentIdx) => {
        const currentEx = exercisesList[currentIdx];
        const curMuscles = utils.getMuscles(currentEx);
        let overlapWeightedSets = 0;
        for (let i = 0; i < currentIdx; i++) {
            const prevEx = exercisesList[i];
            const prevMuscles = utils.getMuscles(prevEx);
            const shared = curMuscles.filter(m => prevMuscles.includes(m));
            if (shared.length > 0) {
                overlapWeightedSets += (prevEx.sets ? prevEx.sets.length : 3);
            }
        }
        let fatigueMultiplier = 1.0;
        let fatigueTier = 'Fresh';
        let fatigueColor = 'var(--success)';
        let fatigueBg = 'var(--success-dim)';
        let fatigueIcon = 'fa-bolt';
        if (overlapWeightedSets >= 6) {
            fatigueMultiplier = 0.92;
            fatigueTier = 'Pre-Fatigued (-8%)';
            fatigueColor = 'var(--warning)';
            fatigueBg = 'var(--warning-dim)';
            fatigueIcon = 'fa-battery-half';
        } else if (overlapWeightedSets >= 3) {
            fatigueMultiplier = 0.96;
            fatigueTier = 'Warmed / Synergist (-4%)';
            fatigueColor = 'var(--info)';
            fatigueBg = 'var(--info-dim)';
            fatigueIcon = 'fa-fire-flame-simple';
        }
        return {
            currentOrderPos: currentIdx + 1,
            overlapWeightedSets,
            fatigueMultiplier,
            fatigueTier,
            fatigueColor,
            fatigueBg,
            fatigueIcon
        };
    },
    calculateStreak: () => {
        let streak = 0;
        const today = new Date();
        for (let i = 0; i < 365; i++) {
            const d = new Date(today.getTime() - i * 86400000);
            const iso = utils.getLocalISODate(d);
            const hasW = store.state.history.workouts.some(w => utils.getLocalISODate(w.date) === iso);
            const hasN = store.state.history.nutrition.some(n => utils.getLocalISODate(n.date) === iso && (n.cal > 0 || (n.waterLog && n.waterLog.length > 0)));
            const hasB = store.state.history.bodyweight.some(b => utils.getLocalISODate(b.date) === iso);
            if (hasW || hasN || hasB) {
                streak++;
            } else if (i > 0) {
                break;
            }
        }
        return streak;
    },
    checkGoalSuccess: (dateStr, goalObj) => {
        if (!goalObj) return false;
        const logs = (store.state.challenge && store.state.challenge.logs && store.state.challenge.logs[dateStr]) || {};
        return !!logs[goalObj.id];
    },
    getGoalLabel: (goalObj) => {
        if (!goalObj) return 'Daily Goal';
        return goalObj.customLabel || goalObj.name || 'Pinned Goal';
    },
    getWeeklyHypertrophyStatus: () => {
        const monTs = utils.getMonday(new Date());
        const weekSets = {};
        HYPERTROPHY_GROUPS.forEach(m => weekSets[m] = 0);
        store.state.history.workouts.forEach(w => {
            if (w.isSkipped || w.isActivity || new Date(w.date).getTime() < monTs) return;
            (w.exercises || []).forEach(ex => {
                const doneCount = (ex.sets || []).filter(s => s.completed !== false).length;
                utils.getMuscles(ex).forEach(m => {
                    if (weekSets[m] !== undefined) weekSets[m] += doneCount;
                });
            });
        });
        let completedGroups = 0;
        let hypertrophyRP = 0;
        HYPERTROPHY_GROUPS.forEach(m => {
            const s = weekSets[m] || 0;
            if (s >= 10) {
                completedGroups++;
                hypertrophyRP += 80;
            } else if (s >= 5) {
                hypertrophyRP += 35;
            }
        });
        return {
            weekSets,
            completedGroups,
            totalGroups: HYPERTROPHY_GROUPS.length,
            hypertrophyRP
        };
    },
    getMonthlyRankMetrics: () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthName = now.toLocaleDateString('en-NZ', { month: 'long' });
        const daysElapsed = Math.max(1, now.getDate());
        let strengthSessions = 0;
        let activitySessions = 0;
        let nutDays = 0;
        let bwDays = 0;
        let waterLiters = 0;
        let consistentDays = 0;
        let rp = 0;
        const rpHistoryLog = [];
        let dailyDeltaToday = 0;
        for (let d = 1; d <= daysElapsed; d++) {
            const dObj = new Date(year, month, d);
            const iso = utils.getLocalISODate(dObj);
            const wDay = store.state.history.workouts.filter(w => utils.getLocalISODate(w.date) === iso && !w.isSkipped && !w.isActivity);
            const actDay = store.state.history.workouts.filter(w => utils.getLocalISODate(w.date) === iso && w.isActivity);
            const nDay = store.state.history.nutrition.find(n => utils.getLocalISODate(n.date) === iso);
            const bDay = store.state.history.bodyweight.find(b => utils.getLocalISODate(b.date) === iso);
            let dayRP = 0;
            const reasons = [];
            if (wDay.length > 0) {
                strengthSessions += wDay.length;
                dayRP += wDay.length * 85;
                reasons.push(`Workout (+${wDay.length * 85})`);
            }
            if (actDay.length > 0) {
                activitySessions += actDay.length;
                dayRP += actDay.length * 35;
                reasons.push(`Activity (+${actDay.length * 35})`);
            }
            if (nDay && nDay.cal > 0) {
                nutDays++;
                dayRP += 35;
                reasons.push('Nutrition (+35)');
            }
            if (nDay && nDay.waterLog) {
                const wl = Math.floor(nDay.waterLog.reduce((s, e) => s + e.amount, 0) / 1000);
                if (wl > 0) {
                    waterLiters += wl;
                    dayRP += wl * 8;
                }
            }
            if (bDay) {
                bwDays++;
                dayRP += 20;
                reasons.push('Bodyweight (+20)');
            }
            if (dayRP > 0) {
                consistentDays++;
                dayRP += 40;
                reasons.unshift('Daily Consistency (+40)');
            }
            rp += dayRP;
            if (d === daysElapsed) dailyDeltaToday = dayRP;
            rpHistoryLog.unshift({
                shortDate: utils.formatDateShort(dObj),
                delta: dayRP,
                reasons: reasons.length > 0 ? reasons.join(' • ') : 'No logs recorded'
            });
        }
        const hyper = utils.getWeeklyHypertrophyStatus();
        rp += Math.round(hyper.hypertrophyRP * 0.5);
        const consistencyPct = Math.round((consistentDays / daysElapsed) * 100);
        const targetStrengthElapsed = Math.max(1, Math.round((daysElapsed / 7) * 4));
        return {
            monthName,
            daysElapsed,
            consistentDays,
            consistencyPct,
            strengthSessions,
            activitySessions,
            targetStrengthElapsed,
            nutDays,
            bwDays,
            waterLiters,
            hyper,
            rp,
            dailyDeltaToday,
            rpHistoryLog
        };
    },
    getAccountLevelData: () => {
        const wCount = store.state.history.workouts.filter(w => !w.isSkipped && !w.isActivity).length;
        const aCount = store.state.history.workouts.filter(w => w.isActivity).length;
        const nCount = store.state.history.nutrition.filter(n => n.cal > 0).length;
        const bCount = store.state.history.bodyweight.length;
        const hyper = utils.getWeeklyHypertrophyStatus();
        const totalXP = 450 + (wCount * 150) + (aCount * 50) + (nCount * 50) + (bCount * 20) + (hyper.completedGroups * 50);
        const level = Math.max(1, Math.floor(totalXP / 500) + 1);
        const xpInLevel = totalXP % 500;
        const xpToNext = 500 - xpInLevel;
        const progressPct = Math.round((xpInLevel / 500) * 100);
        const titles = ['Initiate', 'Iron Novice', 'Vanguard', 'Spartan', 'Centurion', 'Olympian', 'Titan', 'Immortal'];
        const tierIdx = Math.min(7, Math.floor((level - 1) / 3));
        return {
            level,
            totalXP,
            xpToNext,
            progressPct,
            tierIdx,
            title: titles[tierIdx],
            color: RANK_COLORS[tierIdx]
        };
    },
    getLiftWorldStats: (liftName) => {
        const bw = Math.max(50, parseFloat(store.state.user.currentWeight) || 85);
        const peak = store.getPeakSet(liftName, '') || store.getAllTimeBestSet(liftName, '');
        const manual = store.state.manualPRs && store.state.manualPRs[liftName];
        let weight = 0, reps = 1;
        if (manual && manual.weight > 0) {
            weight = manual.weight;
            reps = manual.reps || 1;
        } else if (peak) {
            weight = peak.weight;
            reps = peak.reps;
        } else {
            const n = liftName.toLowerCase();
            if (n.includes('bench')) { weight = store.state.prs.Bench.weight; reps = store.state.prs.Bench.reps; }
            else if (n.includes('squat')) { weight = store.state.prs.Squat.weight; reps = store.state.prs.Squat.reps; }
            else if (n.includes('deadlift')) { weight = store.state.prs.Deadlift.weight; reps = store.state.prs.Deadlift.reps; }
        }
        const e1rm = reps === 1 ? Math.round(weight) : Math.round(weight * (1 + reps / 30));
        const bwRatio = (e1rm / bw).toFixed(2);
        const n = liftName.toLowerCase();
        let mults = [0.5, 0.8, 1.15, 1.5, 1.85];
        if (n.includes('squat')) mults = [0.7, 1.1, 1.5, 1.9, 2.3];
        else if (n.includes('deadlift')) mults = [0.9, 1.35, 1.8, 2.25, 2.7];
        const anchors = mults.map(m => Math.round(bw * m));
        let tier = 'Novice';
        let topPercent = 65;
        if (e1rm >= anchors[4]) { tier = 'Elite'; topPercent = 1; }
        else if (e1rm >= anchors[3]) { tier = 'Advanced'; topPercent = 8; }
        else if (e1rm >= anchors[2]) { tier = 'Intermediate'; topPercent = 25; }
        const barFill = Math.min(100, Math.max(5, Math.round((e1rm / anchors[4]) * 100)));
        return { lift: liftName, weight, reps, e1rm, bwRatio, tier, topPercent, anchors, barFill };
    },

            { id: 'm6', title: 'Olympian', desc: '25 Workouts', icon: 'fa-crown', unlocked: wCount >= 25 }

    },
        renderMacroRingCard: (title, val, target, unit, subLabel, colorHex, iconClass) => {
        const pct = target > 0 ? Math.min(100, Math.max(0, (val / target) * 100)) : 0;
        const r = 42;
        const c = 2 * Math.PI * r;
        const offset = c - (pct / 100) * c;
        return `

            <div class="flex-between" style="width:100%; margin-bottom:4px;">
                <span style="font-size:16px; font-weight:800; color:var(--text-primary);">${title}</span>

                    <circle cx="56" cy="56" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="10"></circle>
                    <circle cx="56" cy="56" r="${r}" fill="none" stroke="${colorHex}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" style="transition: stroke-dashoffset 0.5s ease;"></circle>
                </svg>
                <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">

                    <div style="font-size:11px; color:var(--text-secondary);">${subLabel}</div>
                </div>

        </div>`;
    },
    getNutritionScore: (nutEntry, targets) => {
        const cal = parseFloat(nutEntry.cal) || 0;
        const pro = parseFloat(nutEntry.pro) || 0;
        const car = parseFloat(nutEntry.car) || 0;
        const fat = parseFloat(nutEntry.fat) || 0;
        const tCal = Math.max(1, parseFloat(targets.cal) || 2400);
        const tPro = Math.max(1, parseFloat(targets.pro) || 180);
        const tCar = Math.max(1, parseFloat(targets.car) || 260);
        const tFat = Math.max(1, parseFloat(targets.fat) || 70);
        let totalWater = 0;
        if (nutEntry.waterLog) totalWater = nutEntry.waterLog.reduce((s, e) => s + e.amount, 0);
        if (cal === 0 && (!nutEntry.loggedMeals || nutEntry.loggedMeals.length === 0) && totalWater === 0) {
            return {
                totalScore: 0,
                grade: 'UNSCORED',
                color: 'var(--text-secondary)',
                factors: [
                    { name: 'Calorie Precision', score: 0, max: 25, desc: 'No calories logged yet' },
                    { name: 'Protein Anchor', score: 0, max: 30, desc: 'No protein logged yet' },
                    { name: 'Macro Split (C & F)', score: 0, max: 15, desc: 'No macros logged yet' },
                    { name: 'Whole-Food Quality', score: 0, max: 20, desc: 'Log foods to evaluate micronutrient & satiety profile' },
                    { name: 'Hydration & Timing', score: 0, max: 10, desc: 'Log water & meals across windows' }
                ],
                insights: [
                    { tone: 'mid', icon: 'fa-utensils', text: 'Tap Breakfast, Lunch, Dinner, or Snacks above to log your first meal or raw ingredient.' }
                ]
            };
        }
        const calDiffRatio = Math.abs(cal - tCal) / tCal;
        const calScore = cal > 0 ? Math.max(0, Math.round(25 * (1 - Math.min(1, calDiffRatio * 1.6)))) : 0;

        const proRatio = pro / tPro;
        let proScore = 0;
        if (proRatio >= 0.95 && proRatio <= 1.25) proScore = 30;
        else if (proRatio > 1.25) proScore = Math.max(20, Math.round(30 - (proRatio - 1.25) * 20));
        else proScore = Math.max(0, Math.round(30 * proRatio));

        const carDiff = Math.abs(car - tCar) / tCar;
        const fatDiff = Math.abs(fat - tFat) / tFat;
        const macroScore = cal > 0 ? Math.max(0, Math.round(15 * (1 - Math.min(1, (carDiff + fatDiff) / 2)))) : 0;

        const logged = nutEntry.loggedMeals || [];
        let goodWeight = 0, midWeight = 0, totalWeight = 0;
        const catSet = new Set();
        const foodNotes = [];
        logged.forEach(m => {
            (m.ingredients || []).forEach(ing => {
                const ref = NZ_ATHLETE_FOODS.find(f => f.id === ing.foodId || f.name.toLowerCase() === (ing.name || '').toLowerCase());
                const g = parseFloat(ing.grams) || 100;
                totalWeight += g;
                if (ref) {
                    catSet.add(ref.cat);
                    if (ref.tone === 'good') goodWeight += g;
                    else midWeight += g;
                    if (foodNotes.length < 4 && !foodNotes.some(fn => fn.name === ref.name)) {
                        foodNotes.push({ name: ref.name, notes: ref.notes, micros: ref.micros, tone: ref.tone });
                    }
                } else {
                    goodWeight += g * 0.8;
                }
            });
        });
        let qualityScore = 0;
        if (totalWeight > 0) {
            const ratio = (goodWeight + midWeight * 0.65) / totalWeight;
            const diversityBonus = Math.min(5, catSet.size * 1.25);
            qualityScore = Math.min(20, Math.round(ratio * 15 + diversityBonus));
        } else if (cal > 0) {
            qualityScore = 12;
        }

        const waterTarget = parseFloat(targets.water) || 4000;
        const waterPts = Math.min(5, Math.round((totalWater / waterTarget) * 5));
        const windowsUsed = new Set(logged.map(m => m.mealType || 'Meal')).size;
        const timingPts = Math.min(5, windowsUsed * 2);
        const hydrationScore = Math.min(10, waterPts + timingPts);

        const totalScore = Math.min(100, calScore + proScore + macroScore + qualityScore + hydrationScore);
        let grade = 'NEEDS WORK';
        let color = 'var(--pending)';
        if (totalScore >= 85) { grade = 'OPTIMAL ATHLETE FUEL'; color = 'var(--success)'; }
        else if (totalScore >= 70) { grade = 'SOLID ADHERENCE'; color = 'var(--accent-color)'; }
        else if (totalScore >= 50) { grade = 'BUILDING MOMENTUM'; color = 'var(--warning)'; }

        const insights = [];
        if (pro >= tPro * 0.95) {
            insights.push({ tone: 'good', icon: 'fa-check-circle', text: `Protein Anchor hit (${Math.round(pro)}g / ${tPro}g) — optimal muscle protein synthesis coverage.` });
        } else {
            const remPro = Math.max(0, Math.round(tPro - pro));
            insights.push({ tone: 'mid', icon: 'fa-drumstick-bite', text: `Add ~${remPro}g more protein (e.g., chicken breast, canned tuna, non-fat Greek yoghurt, or cottage cheese) to hit your ${tPro}g anchor.` });
        }
        if (cal > tCal * 1.12) {
            insights.push({ tone: 'bad', icon: 'fa-triangle-exclamation', text: `Energy intake is ${Math.round(cal - tCal)} kcal over target. Watch high-density fats (nuts, cheese, standard mince) on cutting days.` });
        } else if (cal > 0 && cal < tCal * 0.8) {
            insights.push({ tone: 'mid', icon: 'fa-bolt', text: `${Math.round(tCal - cal)} kcal remaining today. Fuel training performance with whole-food carbs like white rice, potatoes, kumara, oats, or kiwifruit.` });
        } else if (cal > 0) {
            insights.push({ tone: 'good', icon: 'fa-bullseye', text: `Calorie intake (${Math.round(cal)} kcal) is dialled in within your ${tCal} kcal target zone.` });
        }
        if (!catSet.has('Vegetables') && !catSet.has('Fruit')) {
            insights.push({ tone: 'mid', icon: 'fa-leaf', text: `Micronutrient & Fibre gap: Add broccoli, spinach, capsicum, or kiwifruit for Vitamin C, potassium, and gut support.` });
        }
        foodNotes.forEach(fn => {
            insights.push({ tone: fn.tone === 'good' ? 'good' : 'mid', icon: 'fa-Notes-medical', text: `<strong>${fn.name}:</strong> ${fn.notes} <em>(${fn.micros})</em>` });
        });

        return {
            totalScore,
            grade,
            color,
            factors: [
                { name: 'Calorie Precision', score: calScore, max: 25, desc: `${Math.round(cal)} / ${tCal} kcal` },
                { name: 'Protein Anchor', score: proScore, max: 30, desc: `${Math.round(pro)}g / ${tPro}g protein` },
                { name: 'Macro Split (C & F)', score: macroScore, max: 15, desc: `${Math.round(car)}g C • ${Math.round(fat)}g F` },
                { name: 'Whole-Food Quality', score: qualityScore, max: 20, desc: `${catSet.size} food groups logged` },
                { name: 'Hydration & Timing', score: hydrationScore, max: 10, desc: `${(totalWater/1000).toFixed(1)}L water • ${windowsUsed} meal windows` }
            ],
            insights
        };
    }
};

            `).join('')}` : ''}

            <div style="font-size:11px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; margin:14px 0 6px 0;">Quick Start Options</div>
            <button class="btn btn-primary" style="margin-bottom:10px;" onclick="document.getElementById('start-workout-modal').style.display='none'; workoutEngine.startEmptySession('Freestyle Hypertrophy')">
                <i class="fas fa-plus"></i> Start Empty Freestyle Workout
            </button>
            <button class="btn" onclick="document.getElementById('start-workout-modal').style.display='none'; workoutEngine.promptQuickActivity()">
                <i class="fas fa-person-running"></i> Log Sport / Cardio Activity
            </button>
        </div>`;
    },

    startAssignedWorkout(routineId, dayIdx, workoutId) {
        const r = store.state.routines.find(x => x.id === routineId) || utils.getActiveRoutine();
        const d = r.days.find(x => x.day === dayIdx);
        const w = d && d.workouts ? d.workouts.find(x => x.id === workoutId) : null;
        if (!w) return this.startEmptySession('Training Session');

        store.state.activeSession = {
            id: utils.generateId(),
            title: w.name,
            startTime: Date.now(),
            exercises: (w.exercises || []).map(ex => {
                const hist = store.getExerciseHistory(ex.name, '');
                const lastSets = hist.length > 0 ? hist[0].sets : [];
                const count = parseInt(ex.targetSets) || 3;
                const sets = [];
                for (let i = 0; i < count; i++) {
                    const prev = lastSets[i] || lastSets[lastSets.length - 1] || { weight: 60, reps: 10 };
                    sets.push({ weight: prev.weight, reps: prev.reps, rir: 2, completed: false });
                }
                return {
                    name: ex.name,
                    muscles: utils.getMuscles(ex),
                    targetSets: count,
                    targetReps: ex.targetReps || '8-12',
                    variation: '',
                    sets
                };
            })
        };
        store.save();
        this.resume();
    },

    startEmptySession(title = 'Freestyle Workout') {
        store.state.activeSession = {
            id: utils.generateId(),
            title,
            startTime: Date.now(),
            exercises: []
        };
        store.save();
        this.resume();
    },

    promptQuickActivity() {
        const name = prompt('Enter Activity / Sport (e.g., 5km Run, Boxing, Touch Rugby):', 'Zone 2 Cardio');
        if (!name) return;
        const mins = parseInt(prompt('Duration in minutes:', '45')) || 45;
        store.addWorkout({
            id: utils.generateId(),
            date: new Date().toISOString(),
            title: name,
            duration: mins * 60,
            isActivity: true,
            exercises: []
        });
        app.refresh();
    },

    resume() {
        if (!store.state.activeSession) return;
        const view = document.getElementById('active-workout-view');
        view.style.display = 'flex';
        this.renderActiveWorkout();
    },

    renderActiveWorkout() {
        const s = store.state.activeSession;
        const view = document.getElementById('active-workout-view');
        if (!s || !view) return;

        view.innerHTML = `
        <div class="workout-header-sticky">
            <div>
                <div style="font-size:10px; font-weight:900; color:var(--success); text-transform:uppercase;">Live Session</div>
                <div style="font-size:16px; font-weight:900;">${s.title}</div>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('active-workout-view').style.display='none'">Minimize</button>
                <button class="btn btn-sm btn-success" style="width:auto;" onclick="workoutEngine.finishSession()">Finish</button>
            </div>
        </div>
        <div style="padding:16px; overflow-y:auto; flex:1; padding-bottom:110px;">
            ${s.exercises.map((ex, exIdx) => {
                const fInfo = utils.getExerciseOrderFatigueAnalysis(s.exercises, exIdx);
                return `
                <div class="exercise-card">
                    <div class="exercise-header">
                        <div>
                            <div style="font-size:16px; font-weight:900;">${exIdx + 1}. ${ex.name}</div>
                            <span style="font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; background:${fInfo.fatigueBg}; color:${fInfo.fatigueColor};">
                                <i class="fas ${fInfo.fatigueIcon}"></i> ${fInfo.fatigueTier}
                            </span>
                        </div>
                        <button class="btn-icon" style="width:30px; height:30px; color:var(--pending);" onclick="workoutEngine.removeExercise(${exIdx})"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="set-row" style="margin-bottom:6px; font-size:10px; font-weight:800; color:var(--text-secondary); text-align:center;">
                        <div>SET</div><div>${utils.unitLabel().toUpperCase()}</div><div>REPS</div><div>RIR</div><div>✓</div>
                    </div>
                    ${(ex.sets || []).map((st, sIdx) => `
                        <div class="set-wrapper">
                            <div class="set-row">
                                <div class="set-number">${sIdx + 1}</div>
                                <div class="input-group"><input type="number" step="0.5" value="${st.weight}" onchange="workoutEngine.updateSet(${exIdx}, ${sIdx}, 'weight', this.value)"></div>
                                <div class="input-group"><input type="number" value="${st.reps}" onchange="workoutEngine.updateSet(${exIdx}, ${sIdx}, 'reps', this.value)"></div>
                                <div class="input-group"><input type="number" value="${st.rir ?? 2}" onchange="workoutEngine.updateSet(${exIdx}, ${sIdx}, 'rir', this.value)"></div>
                                <button class="btn-check ${st.completed ? 'completed' : ''}" onclick="workoutEngine.toggleSet(${exIdx}, ${sIdx})"><i class="fas fa-check"></i></button>
                            </div>
                        </div>
                    `).join('')}
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <button class="btn btn-sm" style="flex:1;" onclick="workoutEngine.addSet(${exIdx})">+ Add Set</button>
                        ${ex.sets.length > 1 ? `<button class="btn btn-sm" style="width:auto; color:var(--pending);" onclick="workoutEngine.removeLastSet(${exIdx})">- Set</button>` : ''}
                    </div>
                </div>`;
            }).join('')}

            <button class="btn" style="margin-bottom:12px;" onclick="workoutEngine.openAddExercisePicker()">+ Add Exercise</button>
            <button class="btn" style="color:var(--pending); border-color:rgba(255,59,48,0.3);" onclick="workoutEngine.cancelSession()">Discard Workout</button>
        </div>`;
    },

    updateSet(exIdx, sIdx, field, val) {
        const s = store.state.activeSession;
        if (!s || !s.exercises[exIdx] || !s.exercises[exIdx].sets[sIdx]) return;
        s.exercises[exIdx].sets[sIdx][field] = parseFloat(val) || 0;
        store.save();
    },

    toggleSet(exIdx, sIdx) {
        const s = store.state.activeSession;
        if (!s || !s.exercises[exIdx] || !s.exercises[exIdx].sets[sIdx]) return;
        const setObj = s.exercises[exIdx].sets[sIdx];
        setObj.completed = !setObj.completed;
        store.save();
        if (setObj.completed) {
            this.startRestTimer(store.state.settings.restTimer || 120);
        }
        this.renderActiveWorkout();
    },

    addSet(exIdx) {
        const ex = store.state.activeSession.exercises[exIdx];
        const last = ex.sets[ex.sets.length - 1] || { weight: 60, reps: 10, rir: 2 };
        ex.sets.push({ weight: last.weight, reps: last.reps, rir: last.rir, completed: false });
        store.save();
        this.renderActiveWorkout();
    },

    removeLastSet(exIdx) {
        const ex = store.state.activeSession.exercises[exIdx];
        if (ex.sets.length > 1) {
            ex.sets.pop();
            store.save();
            this.renderActiveWorkout();
        }
    },

    removeExercise(exIdx) {
        store.state.activeSession.exercises.splice(exIdx, 1);
        store.save();
        this.renderActiveWorkout();
    },

    openAddExercisePicker() {
        const modal = document.getElementById('exercise-selection-modal');
        const grouped = utils.getGroupedExercises();
        modal.style.display = 'flex';
        modal.innerHTML = `
        <div class="workout-header-sticky">
            <h2 style="font-size:18px; font-weight:900;">Select Exercise</h2>
            <button class="btn-icon" onclick="document.getElementById('exercise-selection-modal').style.display='none'"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding:16px; overflow-y:auto; flex:1;">
            <button class="btn btn-primary" style="margin-bottom:14px;" onclick="workoutEngine.promptCustomExerciseInSession()">+ Create Custom Exercise</button>
            ${Object.keys(grouped).map(mGroup => `
                <div style="font-size:11px; font-weight:900; color:var(--accent-color); text-transform:uppercase; margin:12px 0 6px 0;">${mGroup}</div>
                ${grouped[mGroup].map(ex => `
                    <div class="card flex-between" style="padding:12px; margin-bottom:8px; cursor:pointer;" onclick="workoutEngine.appendExerciseToSession('${ex.name.replace(/'/g, "\\'")}')">
                        <div>
                            <div style="font-weight:800; font-size:14px;">${ex.name}</div>
                            <div class="text-muted" style="font-size:11px;">${(ex.muscles || []).join(', ')}</div>
                        </div>
                        <i class="fas fa-plus text-accent"></i>
                    </div>
                `).join('')}
            `).join('')}
        </div>`;
    },

    promptCustomExerciseInSession() {
        const name = prompt('Enter Exercise Name:');
        if (!name) return;
        const muscle = prompt('Primary Muscle Group (Chest, Back, Shoulders, Quads, Hamstrings, Biceps, Triceps, Abs, Calves):', 'Chest') || 'Other';
        store.state.customExercises.push({ name: name.trim(), muscles: [muscle.trim()], targetSets: 3, targetReps: '8-12' });
        store.save();
        this.appendExerciseToSession(name.trim());
    },

    appendExerciseToSession(exName) {
        const meta = utils.getMasterExercise(exName);
        store.state.activeSession.exercises.push({
            name: meta.name,
            muscles: meta.muscles || ['Other'],
            targetSets: 3,
            targetReps: '8-12',
            sets: [
                { weight: 60, reps: 10, rir: 2, completed: false },
                { weight: 60, reps: 10, rir: 2, completed: false },
                { weight: 60, reps: 10, rir: 2, completed: false }
            ]
        });
        store.save();
        document.getElementById('exercise-selection-modal').style.display = 'none';
        this.renderActiveWorkout();
    },

    startRestTimer(seconds) {
        const overlay = document.getElementById('rest-timer-overlay');
        const disp = document.getElementById('rest-timer-display');
        overlay.style.display = 'flex';
        this.restTargetTimestamp = Date.now() + seconds * 1000;
        if (this.restInterval) clearInterval(this.restInterval);
        this.restInterval = setInterval(() => {
            const rem = Math.max(0, Math.ceil((this.restTargetTimestamp - Date.now()) / 1000));
            const m = String(Math.floor(rem / 60)).padStart(2, '0');
            const s = String(rem % 60).padStart(2, '0');
            if (disp) disp.textContent = `${m}:${s}`;
            if (rem <= 0) this.stopRestTimer();
        }, 250);
    },

    stopRestTimer() {
        if (this.restInterval) clearInterval(this.restInterval);
        const overlay = document.getElementById('rest-timer-overlay');
        if (overlay) overlay.style.display = 'none';
    },

    toggleRestTimerMute() {
        store.state.settings.restTimerMuted = !store.state.settings.restTimerMuted;
        store.save();
        const icon = document.getElementById('rest-timer-mute-icon');
        if (icon) icon.className = store.state.settings.restTimerMuted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
    },

    finishSession() {
        const s = store.state.activeSession;
        if (!s) return;
        const dur = Math.max(60, Math.round((Date.now() - (s.startTime || Date.now())) / 1000));
        store.addWorkout({
            id: s.id,
            date: new Date().toISOString(),
            title: s.title,
            duration: dur,
            exercises: s.exercises
        });
        store.state.activeSession = null;
        store.save();
        this.stopRestTimer();
        document.getElementById('active-workout-view').style.display = 'none';
        app.refresh();
    },

    cancelSession() {
        if (!confirm('Discard current workout session?')) return;
        store.state.activeSession = null;
        store.save();
        this.stopRestTimer();
        document.getElementById('active-workout-view').style.display = 'none';
        app.refresh();
    }
};

const routineEditor = {
    currentRoutineId: null,

    open(routineId) {
        this.currentRoutineId = routineId;
        const r = store.state.routines.find(x => x.id === routineId);
        if (!r) return;
        const modal = document.getElementById('routine-editor-modal');
        modal.style.display = 'flex';
        const orderedDays = [1, 2, 3, 4, 5, 6, 0];

        modal.innerHTML = `
        <div class="workout-header-sticky">
            <h2 style="font-size:18px; font-weight:900;">Edit Split: ${r.name}</h2>
            <button class="btn-icon" onclick="document.getElementById('routine-editor-modal').style.display='none'; app.refresh();"><i class="fas fa-check text-accent"></i></button>
        </div>
        <div style="padding:16px; overflow-y:auto; flex:1;">
            <label style="font-size:11px; font-weight:800; color:var(--text-secondary);">SPLIT NAME</label>
            <input type="text" class="edit-input" value="${r.name}" onchange="routineEditor.renameSplit(this.value)">
            ${orderedDays.map(dIdx => {
                const dObj = r.days.find(d => d.day === dIdx) || { day: dIdx, workouts: [] };
                const w = dObj.workouts && dObj.workouts[0];
                return `
                <div class="card">
                    <div class="flex-between" style="margin-bottom:8px;">
                        <strong style="color:var(--accent-color);">${utils.getDayName(dIdx)}</strong>
                        ${w ? `<button class="btn btn-sm" style="width:auto; color:var(--pending);" onclick="routineEditor.clearDay(${dIdx})">Set as Rest</button>`
                            : `<button class="btn btn-sm btn-primary" style="width:auto;" onclick="routineEditor.initDayWorkout(${dIdx})">+ Add Session</button>`}
                    </div>
                    ${w ? `
                        <input type="text" class="edit-input" value="${w.name}" onchange="routineEditor.renameDayWorkout(${dIdx}, this.value)">
                        ${(w.exercises || []).map((ex, exIdx) => `
                            <div class="flex-between" style="padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
                                <span>${exIdx + 1}. <strong>${ex.name}</strong> (${ex.targetSets}×${ex.targetReps})</span>
                                <button class="btn-icon" style="width:26px; height:26px; color:var(--pending);" onclick="routineEditor.removeDayExercise(${dIdx}, ${exIdx})"><i class="fas fa-times"></i></button>
                            </div>
                        `).join('')}
                        <button class="btn btn-sm" style="margin-top:8px;" onclick="routineEditor.promptAddDayExercise(${dIdx})">+ Add Exercise to ${utils.getDayShort(dIdx)}</button>
                    ` : `<div class="text-muted" style="font-size:12px;">Rest / Recovery Day</div>`}
                </div>`;
            }).join('')}
        </div>`;
    },

    createNew() {
        const name = prompt('Enter New Split Name:', 'Upper / Lower 4-Day Split');
        if (!name) return;
        const newR = {
            id: 'r_' + utils.generateId(),
            name: name.trim(),
            days: [0, 1, 2, 3, 4, 5, 6].map(d => ({ day: d, workouts: [] }))
        };
        store.state.routines.push(newR);
        store.state.activeRoutineId = newR.id;
        store.save();
        this.open(newR.id);
    },

    renameSplit(newName) {
        const r = store.state.routines.find(x => x.id === this.currentRoutineId);
        if (r && newName.trim()) {
            r.name = newName.trim();
            store.save();
        }
    },

    initDayWorkout(dayIdx) {
        const r = store.state.routines.find(x => x.id === this.currentRoutineId);
        if (!r) return;
        let dObj = r.days.find(d => d.day === dayIdx);
        if (!dObj) { dObj = { day: dayIdx, workouts: [] }; r.days.push(dObj); }
        dObj.workouts = [{ id: 'w_' + utils.generateId(), name: `${utils.getDayName(dayIdx)} Hypertrophy`, exercises: [] }];
        store.save();
        this.open(this.currentRoutineId);
    },

    clearDay(dayIdx) {
        const r = store.state.routines.find(x => x.id === this.currentRoutineId);
        if (!r) return;
        const dObj = r.days.find(d => d.day === dayIdx);
        if (dObj) dObj.workouts = [];
        store.save();
        this.open(this.currentRoutineId);
    },

    renameDayWorkout(dayIdx, val) {
        const r = store.state.routines.find(x => x.id === this.currentRoutineId);
        const dObj = r && r.days.find(d => d.day === dayIdx);
        if (dObj && dObj.workouts[0]) {
            dObj.workouts[0].name = val.trim() || 'Workout';
            store.save();
        }
    },

    removeDayExercise(dayIdx, exIdx) {
        const r = store.state.routines.find(x => x.id === this.currentRoutineId);
        const dObj = r && r.days.find(d => d.day === dayIdx);
        if (dObj && dObj.workouts[0]) {
            dObj.workouts[0].exercises.splice(exIdx, 1);
            store.save();
            this.open(this.currentRoutineId);
        }
    },

    promptAddDayExercise(dayIdx) {
        const name = prompt('Exercise Name (e.g., Bench Press, Squat, Lat Pulldown):', 'Bench Press');
        if (!name) return;
        const sets = parseInt(prompt('Target Sets:', '3')) || 3;
        const reps = prompt('Target Reps:', '8-12') || '8-12';
        const meta = utils.getMasterExercise(name.trim());
        const r = store.state.routines.find(x => x.id === this.currentRoutineId);
        const dObj = r && r.days.find(d => d.day === dayIdx);
        if (dObj && dObj.workouts[0]) {
            dObj.workouts[0].exercises.push({
                name: meta.name,
                muscles: meta.muscles || ['Other'],
                targetSets: sets,
                targetReps: reps
            });
            store.save();
            this.open(this.currentRoutineId);
        }
    }
};

const app = {
    currentTab: 'home',
    selectedNutritionDate: null,
    activeMealWindow: 'Breakfast',
    mealSearchTab: 'ingredients',
    mealSearchCat: 'All',
    mealSearchQuery: '',
    builderIngredients: [],
    builderCat: 'All',
    builderSearchQuery: '',
    charts: {},

    init() {
        store.load();
        this.selectedNutritionDate = utils.getLocalISODate(new Date());
        this.applyTheme(store.state.settings.theme || 'olympus');
        this.renderNav();
        this.navigateTo('home');
    },

    applyTheme(themeName) {
        document.documentElement.setAttribute('data-theme', themeName);
        store.state.settings.theme = themeName;
        store.save();
    },

    renderNav() {
        const nav = document.getElementById('nav-bar');
        const icons = (THEME_MAP[store.state.settings.theme] || THEME_MAP.olympus).nav;
        const tabs = [
            { id: 'home', label: 'Home', icon: icons[0] },
            { id: 'workouts', label: 'Workouts', icon: icons[1] },
            { id: 'analytics', label: 'Analytics', icon: icons[2] },
            { id: 'nutrition', label: 'Nutrition', icon: icons[3] },
            { id: 'profile', label: 'Profile', icon: icons[4] }
        ];
        nav.innerHTML = tabs.map(t => `
            <a class="nav-item ${this.currentTab === t.id ? 'active' : ''}" onclick="app.navigateTo('${t.id}')">
                <i class="fas ${t.icon}"></i>
                <span>${t.label}</span>
            </a>
        `).join('');
    },

    navigateTo(tabId) {
        this.currentTab = tabId;
        this.renderNav();
        this.refresh();
    },

    refresh() {
        const main = document.getElementById('main-content');
        if (!main || !views[this.currentTab]) return;
        main.innerHTML = views[this.currentTab]();
        if (this.currentTab === 'analytics') {
            setTimeout(() => this.renderAnalyticsCharts(), 40);
        }
    },

    /* ---------------- NUTRITION LIVE PIPELINE ---------------- */
    getOrCreateNutritionEntry(dateStr) {
        const targetIso = utils.getLocalISODate(dateStr || this.selectedNutritionDate || new Date());
        let entry = store.state.history.nutrition.find(n => utils.getLocalISODate(n.date) === targetIso);
        if (!entry) {
            entry = { date: targetIso, cal: 0, pro: 0, car: 0, fat: 0, loggedMeals: [], waterLog: [] };
            store.state.history.nutrition.push(entry);
        }
        if (!Array.isArray(entry.loggedMeals)) entry.loggedMeals = [];
        if (!Array.isArray(entry.waterLog)) entry.waterLog = [];
        return entry;
    },

    recalculateNutritionTotals(entry) {
        const meals = entry.loggedMeals || [];
        entry.cal = Math.round(meals.reduce((s, m) => s + (parseFloat(m.cal) || 0), 0));
        entry.pro = Math.round(meals.reduce((s, m) => s + (parseFloat(m.pro) || 0), 0) * 10) / 10;
        entry.car = Math.round(meals.reduce((s, m) => s + (parseFloat(m.car) || 0), 0) * 10) / 10;
        entry.fat = Math.round(meals.reduce((s, m) => s + (parseFloat(m.fat) || 0), 0) * 10) / 10;
    },

    shiftNutritionDate(deltaDays) {
        const cur = new Date((this.selectedNutritionDate || utils.getLocalISODate(new Date())) + 'T00:00:00');
        cur.setDate(cur.getDate() + deltaDays);
        this.selectedNutritionDate = utils.getLocalISODate(cur);
        this.refresh();
    },

    resetNutritionDateToToday() {
        this.selectedNutritionDate = utils.getLocalISODate(new Date());
        this.refresh();
    },

    openMealSearchModal(mealType = 'Breakfast') {
        this.activeMealWindow = mealType || 'Breakfast';
        this.mealSearchQuery = '';
        const modal = document.getElementById('meal-search-modal');
        modal.style.display = 'flex';
        this.renderMealSearchModalContent();
    },

    setMealSearchTab(tab) {
        this.mealSearchTab = tab;
        this.renderMealSearchModalContent();
    },

    setMealSearchCategory(cat) {
        this.mealSearchCat = cat;
        this.renderMealSearchModalContent();
    },

    renderMealSearchModalContent() {
        const modal = document.getElementById('meal-search-modal');
        if (!modal) return;
        const wType = this.activeMealWindow;
        const curDate = this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const entry = this.getOrCreateNutritionEntry(curDate);
        const windowMeals = (entry.loggedMeals || []).filter(m => (m.mealType || '').toLowerCase() === wType.toLowerCase());

        modal.innerHTML = `
        <div class="workout-header-sticky">
            <div>
                <div style="font-size:10px; font-weight:900; color:var(--accent-color); text-transform:uppercase;">Logging Into Window</div>
                <h2 style="font-size:18px; font-weight:900;">${wType}</h2>
            </div>
            <button class="btn-icon" onclick="document.getElementById('meal-search-modal').style.display='none'; app.refresh();"><i class="fas fa-check text-accent"></i></button>
        </div>
        <div style="padding:14px 16px; overflow-y:auto; flex:1; padding-bottom:90px;">
            ${windowMeals.length > 0 ? `
            <div class="card" style="padding:12px; margin-bottom:12px; border-color:var(--accent-color);">
                <div style="font-size:11px; font-weight:900; color:var(--accent-color); text-transform:uppercase; margin-bottom:6px;">Already Logged in ${wType}</div>
                ${windowMeals.map(wm => `
                    <div class="flex-between" style="font-size:12.5px; padding:4px 0; border-bottom:1px solid var(--border);">
                        <span class="truncate-text" style="font-weight:700; padding-right:8px;">${wm.name}</span>
                        <span style="white-space:nowrap; color:var(--text-secondary);">${Math.round(wm.cal)} kcal • ${Math.round(wm.pro)}g P</span>
                    </div>
                `).join('')}
            </div>` : ''}

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:12px;">

                <div style="margin-bottom:10px;">

                        <i class="fas fa-plus"></i> Create New Saved Meal Template
                    </button>
                </div>
                ${(store.state.savedMeals || []).map(sm => `
                    <div class="card flex-between" style="padding:12px; margin-bottom:10px;">
                        <div style="min-width:0; flex:1; padding-right:10px;">
                            <div style="font-weight:900; font-size:14.5px;">${sm.name}</div>
                            <div class="text-muted" style="font-size:12px; margin-top:2px;">
                                <strong style="color:var(--accent-color);">${Math.round(sm.cal)} kcal</strong> • ${Math.round(sm.pro)}g P • ${Math.round(sm.car)}g C • ${Math.round(sm.fat)}g F
                            </div>
                        </div>
                        <button class="btn btn-sm btn-primary" style="width:auto;" onclick="app.logSavedMealToDay('${sm.id}')">+ Log</button>
                    </div>
                `).join('')}
            ` : ''}

            ${this.mealSearchTab === 'custom' ? `
                <div class="card">
                    <h3 style="font-size:15px; font-weight:900; margin-bottom:8px;">Quick Custom Food Entry (${wType})</h3>
                    <label class="text-muted" style="font-size:11px; font-weight:800;">FOOD / MEAL NAME</label>
                    <input type="text" id="quick-food-name" class="edit-input" placeholder="e.g., Post-Workout Whey Shake & Banana">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                        <div>
                            <label class="text-muted" style="font-size:11px; font-weight:800;">CALORIES (KCAL)</label>
                            <input type="number" id="quick-food-cal" class="edit-input" placeholder="320">
                        </div>
                        <div>
                            <label class="text-muted" style="font-size:11px; font-weight:800;">PROTEIN (G)</label>
                            <input type="number" id="quick-food-pro" class="edit-input" placeholder="35">
                        </div>
                        <div>
                            <label class="text-muted" style="font-size:11px; font-weight:800;">CARBS (G)</label>
                            <input type="number" id="quick-food-car" class="edit-input" placeholder="30">
                        </div>
                        <div>
                            <label class="text-muted" style="font-size:11px; font-weight:800;">FAT (G)</label>
                            <input type="number" id="quick-food-fat" class="edit-input" placeholder="4">
                        </div>
                    </div>
                    <button class="btn btn-primary" style="margin-top:8px;" onclick="app.submitQuickCustomFood()">
                        <i class="fas fa-check"></i> Add to ${wType}

        if (this.mealSearchTab === 'ingredients') {
            this.renderMealSearchResultsList();
