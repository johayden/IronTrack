        return html;
    }
};

const app = {
    currentPage: 'home',
    selectedNutritionDate: null,
    chartInstances: {},
    draftRoutine: null,

    init() {
        store.load();
        this.applyTheme(store.state.settings.theme || 'olympus');
        this.selectedNutritionDate = utils.getLocalISODate(new Date());
        this.renderNav();
        this.navigate('home');
    },

    applyTheme(themeName) {
        if (!['olympus', 'dark', 'light'].includes(themeName)) themeName = 'olympus';
        store.state.settings.theme = themeName;
        document.documentElement.setAttribute('data-theme', themeName);
        store.save();
        this.renderNav();
    },

    renderNav() {
        const theme = store.state.settings.theme || 'olympus';
        const icons = (THEME_MAP[theme] || THEME_MAP.olympus).nav;
        const pages = [
            { id: 'home', label: 'Home', icon: icons[0] },
            { id: 'workouts', label: 'Workouts', icon: icons[1] },
            { id: 'analytics', label: 'Analytics', icon: icons[2] },
            { id: 'nutrition', label: 'Nutrition', icon: icons[3] },
            { id: 'profile', label: 'Profile', icon: icons[4] }
        ];
        const navBar = document.getElementById('nav-bar');
        if (!navBar) return;
        navBar.innerHTML = pages.map(p => `
            <a class="nav-item ${this.currentPage === p.id ? 'active' : ''}" onclick="app.navigate('${p.id}')">
                <i class="fas ${p.icon}"></i>
                <span>${p.label}</span>
            </a>
        `).join('');
    },

    navigate(page) {
        this.currentPage = page;
        this.renderNav();
        const main = document.getElementById('main-content');
        if (!main) return;
        if (page === 'home') main.innerHTML = views.renderHome();
        else if (page === 'workouts') main.innerHTML = views.renderWorkouts();
        else if (page === 'analytics') {
            main.innerHTML = views.renderAnalytics();
            setTimeout(() => this.initCharts(), 40);
        } else if (page === 'nutrition') main.innerHTML = views.renderNutrition();
        else if (page === 'profile') main.innerHTML = views.renderProfile();
        main.scrollTop = 0;
    },

    startTodayWorkout(idx = 0) {
        const prog = utils.getTodayProgram();
        if (prog && prog.workouts && prog.workouts[idx]) {
            workoutEngine.initNewOrResume(prog.workouts[idx]);
        } else {
            this.openStartWorkoutModal();
        }
    },

    startRoutineWorkout(routineId, dayIdx, wIdx = 0) {
        const r = store.state.routines.find(x => x.id === routineId) || utils.getActiveRoutine();
        const d = r.days.find(x => x.day === dayIdx);
        if (d && d.workouts && d.workouts[wIdx]) {
            workoutEngine.initNewOrResume(d.workouts[wIdx]);
        }
    },

    openStartWorkoutModal() {
        const modal = document.getElementById('start-workout-modal');
        const active = utils.getActiveRoutine();
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('start-workout-modal').style.display='none'">Close</button>
                <div style="font-weight:bold; font-size:16px;">Select Workout Session</div>
                <div style="width:60px;"></div>
            </div>
            <div style="padding:16px;">
                <button class="btn btn-primary" style="margin-bottom:16px;" onclick="app.startBlankWorkout()"><i class="fas fa-plus"></i> Start Empty Freestyle Workout</button>
                <h3 style="margin-bottom:10px;">From Active Split (${active.name})</h3>
        `;
        active.days.forEach(d => {
            (d.workouts || []).forEach((w, wIdx) => {
                html += `
                <div class="card flex-between" style="padding:14px; cursor:pointer;" onclick="app.startRoutineWorkout('${active.id}', ${d.day}, ${wIdx})">
                    <div>
                        <div style="font-size:11px; color:var(--accent-color); font-weight:bold; text-transform:uppercase;">${utils.getDayName(d.day)}</div>
                        <div style="font-weight:800; font-size:16px;">${w.name}</div>
                        <div style="font-size:12px; color:var(--text-secondary);">${(w.exercises || []).length} exercises</div>
                    </div>
                    <i class="fas fa-play text-accent"></i>
                </div>`;
            });
        });
        html += `</div>`;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },

    startBlankWorkout() {
        const name = prompt("Session Name:", "Freestyle Session") || "Freestyle Session";
        workoutEngine.startNewSession({ id: utils.generateId(), name: name.trim(), exercises: [] });
    },

    markRestDayToday() {
        const todayStr = utils.getLocalISODate(new Date());
        if (!store.state.history.workouts.some(w => utils.getLocalISODate(w.date) === todayStr && w.isSkipped)) {
            store.addWorkout({ id: utils.generateId(), date: new Date().toISOString(), name: 'Rest Day', isSkipped: true, isActivity: false, exercises: [] });
        }
        this.navigate(this.currentPage);
    },

    logQuickActivity() {
        const actName = prompt("Enter sport, cardio, or recovery activity (e.g. Touch Rugby, 5km Run, Sauna & Mobility):");
        if (!actName || !actName.trim()) return;
        store.addWorkout({
            id: utils.generateId(),
            date: new Date().toISOString(),
            name: actName.trim(),
            isSkipped: false,
            isActivity: true,
            exercises: []
        });
        store.state.history.cardio.push({ date: new Date().toISOString(), type: actName.trim(), duration: 30 });
        store.save();
        this.navigate(this.currentPage);
    },

    promptQuickBodyweight() {
        const unit = utils.unitLabel();
        const val = prompt(`Enter morning bodyweight (${unit}):`, store.state.user.currentWeight || 90);
        if (val === null) return;
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        const todayStr = utils.getLocalISODate(new Date());
        const existing = store.state.history.bodyweight.find(e => utils.getLocalISODate(e.date) === todayStr);
        if (existing) {
            existing.weight = num;
            store.state.user.currentWeight = num;
            store.save();
        } else {
            store.addBodyweight(num);
        }
        this.navigate(this.currentPage);
    },

    toggleChallengeGoal(dStr, goalId, goalType) {
        if (goalType === 'cardio') {
            this.logQuickActivity();
            return;
        }
        if (!store.state.history.challengeLogs[dStr]) store.state.history.challengeLogs[dStr] = {};
        store.state.history.challengeLogs[dStr][goalId] = !store.state.history.challengeLogs[dStr][goalId];
        store.save();
        this.navigate(this.currentPage);
    },

    switchActiveRoutine(rId) {
        store.state.activeRoutineId = rId;
        store.save();
        this.navigate('workouts');
    },

    createNewRoutine() {
        const name = prompt("New Split Name (e.g. Winter Bulk PPL, 4-Day Upper/Lower):");
        if (!name || !name.trim()) return;
        const newR = {
            id: 'r_' + utils.generateId(),
            name: name.trim(),
            days: [0, 1, 2, 3, 4, 5, 6].map(d => ({ day: d, workouts: [] }))
        };
        store.state.routines.push(newR);
        store.state.activeRoutineId = newR.id;
        store.save();
        this.openRoutineEditor(newR.id);
    },

    openRoutineEditor(routineId) {
        const r = store.state.routines.find(x => x.id === routineId) || utils.getActiveRoutine();
        this.draftRoutine = JSON.parse(JSON.stringify(r));
        this.renderRoutineEditorModal();
    },

    renderRoutineEditorModal() {
        const modal = document.getElementById('start-workout-modal');
        const r = this.draftRoutine;
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('start-workout-modal').style.display='none'">Cancel</button>
                <div style="font-weight:bold; font-size:16px;">Edit Split: ${r.name}</div>
                <button class="btn btn-sm btn-success" style="width:auto;" onclick="app.saveDraftRoutine()">Save</button>
            </div>
            <div style="padding:16px;">
                <label style="font-size:12px; color:var(--text-secondary); font-weight:bold;">SPLIT NAME</label>
                <input type="text" class="edit-input" value="${r.name}" oninput="app.draftRoutine.name = this.value">
        `;
        r.days.forEach((d, dIdx) => {
            html += `
            <div class="card" style="padding:12px;">
                <div class="flex-between" style="margin-bottom:8px;">
                    <h3 style="margin:0; color:var(--accent-color);">${utils.getDayName(d.day)}</h3>
                    <button class="btn btn-sm" onclick="app.addDraftDayWorkout(${dIdx})">+ Add Session</button>
                </div>
                ${(d.workouts || []).length === 0 ? `<div class="text-muted" style="font-size:12px;">Rest Day</div>` : ''}
                ${(d.workouts || []).map((w, wIdx) => `
                    <div style="background:var(--surface-elevated); padding:10px; border-radius:10px; margin-bottom:8px; border:1px solid var(--border);">
                        <div class="flex-between" style="gap:8px; margin-bottom:8px;">
                            <input type="text" class="edit-input" style="margin:0; font-weight:bold;" value="${w.name}" oninput="app.draftRoutine.days[${dIdx}].workouts[${wIdx}].name = this.value">
                            <button class="btn-icon" style="color:var(--pending); flex-shrink:0;" onclick="app.removeDraftDayWorkout(${dIdx}, ${wIdx})"><i class="fas fa-trash"></i></button>
                        </div>
                        ${(w.exercises || []).map((ex, exIdx) => `
                            <div style="display:grid; grid-template-columns: 1fr 58px 74px 30px; gap:6px; align-items:center; margin-bottom:6px;">
                                <div style="font-size:13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ex.name}</div>
                                <input type="number" class="inline-edit" value="${ex.targetSets || 3}" onchange="app.draftRoutine.days[${dIdx}].workouts[${wIdx}].exercises[${exIdx}].targetSets = parseInt(this.value)||3" title="Sets">
                                <input type="text" class="inline-edit" value="${ex.targetReps || '8-12'}" onchange="app.draftRoutine.days[${dIdx}].workouts[${wIdx}].exercises[${exIdx}].targetReps = this.value" title="Reps">
                                <button class="btn-icon" style="width:28px; height:28px; color:var(--pending);" onclick="app.draftRoutine.days[${dIdx}].workouts[${wIdx}].exercises.splice(${exIdx},1); app.renderRoutineEditorModal();"><i class="fas fa-xmark"></i></button>
                            </div>
                        `).join('')}
                        <button class="btn btn-sm" style="margin-top:6px; width:100%;" onclick="app.promptAddExerciseToDraft(${dIdx}, ${wIdx})">+ Add Exercise</button>
                    </div>
                `).join('')}
            </div>`;
        });
        html += `</div>`;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },

    addDraftDayWorkout(dIdx) {
        const name = prompt("Workout Title (e.g. Push A, Legs, Pull):", "Workout");
        if (!name) return;
        this.draftRoutine.days[dIdx].workouts.push({ id: 'w_' + utils.generateId(), name: name.trim(), exercises: [] });
        this.renderRoutineEditorModal();
    },

    removeDraftDayWorkout(dIdx, wIdx) {
        this.draftRoutine.days[dIdx].workouts.splice(wIdx, 1);
        this.renderRoutineEditorModal();
    },

    promptAddExerciseToDraft(dIdx, wIdx) {
        const exName = prompt("Enter Exercise Name (e.g. Bench Press, Squat, Lat Pulldown, Incline DB Press):");
        if (!exName || !exName.trim()) return;
        const clean = exName.trim().slice(0, MAX_EX_TITLE_LEN);
        const master = utils.getMasterExercise(clean);
        this.draftRoutine.days[dIdx].workouts[wIdx].exercises.push({
            name: clean,
            muscles: utils.getMuscles(master),
            targetSets: master.targetSets || 3,
            targetReps: master.targetReps || '8-12'
        });
        this.renderRoutineEditorModal();
    },

    saveDraftRoutine() {
        if (!this.draftRoutine) return;
        const idx = store.state.routines.findIndex(r => r.id === this.draftRoutine.id);
        if (idx > -1) store.state.routines[idx] = this.draftRoutine;
        else store.state.routines.push(this.draftRoutine);
        store.save();
        document.getElementById('start-workout-modal').style.display = 'none';
        this.navigate(this.currentPage);
    },

    deleteWorkoutEntry(wId) {
        if (!confirm("Delete this logged workout session?")) return;
        store.state.history.workouts = store.state.history.workouts.filter(w => w.id !== wId);
        store.save();
        this.navigate(this.currentPage);
    },

    setChartRange(val) {
        store.state.settings.chartRange = val;
        store.save();
        this.navigate('analytics');
    },

    setVolFilter(val) {
        store.state.settings.lastVolFilter = val;
        store.save();
        this.navigate('analytics');
    },

    setOverloadMuscleFilter(val) {
        store.state.settings.overloadMuscleFilter = val;
        store.save();
        this.navigate('analytics');
    },

    promptManualPR() {
        const lift = prompt("Lift Name (e.g. Bench Press, Squat, Deadlift):", "Bench Press");
        if (!lift) return;
        const weight = parseFloat(prompt(`Weight lifted (${utils.unitLabel()}):`, "100"));
        if (isNaN(weight) || weight <= 0) return;
        const reps = parseInt(prompt("Reps completed:", "1")) || 1;
        const e1rm = reps === 1 ? weight : Math.round(weight * (1 + reps / 30) * 10) / 10;
        store.state.history.manualPRs.push({
            date: new Date().toISOString(),
            lift: lift.trim(),
            weight,
            reps,
            e1rm
        });
        if (!store.state.trackedPRs.includes(lift.trim())) {
            store.state.trackedPRs.push(lift.trim());
        }
        store.save();
        this.navigate('analytics');
    },

    initCharts() {
        Object.values(this.chartInstances).forEach(c => { if (c && c.destroy) c.destroy(); });
        this.chartInstances = {};
        const range = store.state.settings.chartRange;
        const daysLimit = range === 'ALL' ? null : (parseInt(range) || 90);
        const cutoffTs = daysLimit ? (Date.now() - daysLimit * 86400000) : 0;
        const textSecondary = utils.getCssVar('--text-secondary', '#8e8e99');
        const borderCol = utils.getCssVar('--border', '#2c2c38');

        // 1. E1RM Chart
        const e1rmCanvas = document.getElementById('e1rmChart');
        if (e1rmCanvas && window.Chart) {
            const hist = utils.getE1RMHistory(daysLimit);
            this.chartInstances.e1rm = new Chart(e1rmCanvas.getContext('2d'), {
                type: 'line',
                data: {
                    datasets: [
                        { label: 'Bench', data: hist.bench.map(p => ({ x: p.ts, y: Math.round(p.e1rm) })), borderColor: '#0a84ff', tension: 0.25 },
                        { label: 'Squat', data: hist.squat.map(p => ({ x: p.ts, y: Math.round(p.e1rm) })), borderColor: '#ffd700', tension: 0.25 },
                        { label: 'Deadlift', data: hist.deadlift.map(p => ({ x: p.ts, y: Math.round(p.e1rm) })), borderColor: '#32d74b', tension: 0.25 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'day' }, ticks: { color: textSecondary }, grid: { color: borderCol } },
                        y: { ticks: { color: textSecondary }, grid: { color: borderCol } }
                    },
                    plugins: { legend: { labels: { color: textSecondary } } }
                }
            });
        }

        // 2. Bodyweight Chart
        const bwCanvas = document.getElementById('bwChart');
        if (bwCanvas && window.Chart) {
            const bwPts = [...store.state.history.bodyweight]
                .filter(b => !cutoffTs || new Date(b.date).getTime() >= cutoffTs)
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .map(b => ({ x: new Date(b.date).setHours(0,0,0,0), y: b.weight }));
            const smaPts = utils.calculateSMA(bwPts, 7);
            this.chartInstances.bw = new Chart(bwCanvas.getContext('2d'), {
                type: 'line',
                data: {
                    datasets: [
                        { label: 'Daily BW', data: bwPts, borderColor: 'rgba(255,159,10,0.45)', pointRadius: 2, tension: 0.1 },
                        { label: '7d Average', data: smaPts, borderColor: '#ff3b30', borderWidth: 2.5, pointRadius: 0, tension: 0.3 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'day' }, ticks: { color: textSecondary }, grid: { color: borderCol } },
                        y: { ticks: { color: textSecondary }, grid: { color: borderCol } }
                    },
                    plugins: { legend: { labels: { color: textSecondary } } }
                }
            });
        }

        // 3. Volume Chart
        const volCanvas = document.getElementById('volChart');
        if (volCanvas && window.Chart) {
            const vHist = utils.getWorkoutVolumeHistory();
            const filter = store.state.settings.lastVolFilter || 'total';
            const rawSeries = filter === 'total' ? vHist.total : (vHist.muscles[filter] || []);
            const filteredSeries = rawSeries.filter(p => !cutoffTs || p.x >= cutoffTs);
            this.chartInstances.vol = new Chart(volCanvas.getContext('2d'), {
                type: 'bar',
                data: {
                    datasets: [{
                        label: `${filter.toUpperCase()} Volume`,
                        data: filteredSeries,
                        backgroundColor: 'rgba(255, 215, 0, 0.55)',
                        borderColor: '#ffd700',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'day' }, ticks: { color: textSecondary }, grid: { color: borderCol } },
                        y: { ticks: { color: textSecondary }, grid: { color: borderCol } }
                    },
                    plugins: { legend: { labels: { color: textSecondary } } }
                }
            });
        }
    },

    changeNutritionDate(val) {
        if (!val) return;
        this.selectedNutritionDate = val;
        this.navigate('nutrition');
    },

    getOrCreateNutritionDay(dStr) {
        let entry = store.state.history.nutrition.find(n => utils.getLocalISODate(n.date) === dStr);
        if (!entry) {
            entry = { date: dStr + 'T12:00:00.000Z', cal: 0, pro: 0, car: 0, fat: 0, loggedMeals: [], waterLog: [] };
            store.state.history.nutrition.push(entry);
        }
        if (!entry.loggedMeals) entry.loggedMeals = [];
        if (!entry.waterLog) entry.waterLog = [];
        return entry;
    },

    recalcNutritionTotals(entry) {
        if (entry.loggedMeals && entry.loggedMeals.length > 0) {
            entry.cal = Math.round(entry.loggedMeals.reduce((s, m) => s + (parseFloat(m.cal) || 0), 0));
            entry.pro = Math.round(entry.loggedMeals.reduce((s, m) => s + (parseFloat(m.pro) || 0), 0));
            entry.car = Math.round(entry.loggedMeals.reduce((s, m) => s + (parseFloat(m.car) || 0), 0));
            entry.fat = Math.round(entry.loggedMeals.reduce((s, m) => s + (parseFloat(m.fat) || 0), 0));
        }
    },

    addWater(dStr, ml) {
        const entry = this.getOrCreateNutritionDay(dStr);
        entry.waterLog.push({ time: new Date().toISOString(), amount: parseInt(ml) || 250 });
        store.save();
        this.navigate('nutrition');
    },

    promptNutritionTargets() {
        const t = store.state.settings.nutritionTargets;
        const cal = parseInt(prompt("Daily Calorie Target (kcal):", t.cal)) || t.cal;
        const pro = parseInt(prompt("Daily Protein Target (g):", t.pro)) || t.pro;
        const car = parseInt(prompt("Daily Carbohydrate Target (g):", t.car)) || t.car;
        const fat = parseInt(prompt("Daily Fat Target (g):", t.fat)) || t.fat;
        store.state.settings.nutritionTargets = { cal, pro, car, fat };
        store.save();
        this.navigate('nutrition');
    },

    promptQuickMacros(dStr) {
        const entry = this.getOrCreateNutritionDay(dStr);
        const cal = parseFloat(prompt("Total Daily Calories (kcal):", entry.cal)) || 0;
        const pro = parseFloat(prompt("Total Daily Protein (g):", entry.pro)) || 0;
        const car = parseFloat(prompt("Total Daily Carbs (g):", entry.car)) || 0;
        const fat = parseFloat(prompt("Total Daily Fat (g):", entry.fat)) || 0;
        entry.cal = cal; entry.pro = pro; entry.car = car; entry.fat = fat;
        store.save();
        this.navigate('nutrition');
    },

    openMealSearchModal(dStr) {
        const modal = document.getElementById('meal-search-modal');
        const savedMeals = store.state.savedMeals || [];
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('meal-search-modal').style.display='none'">Close</button>
                <div style="font-weight:bold; font-size:16px;">NZ Athlete Food Reference</div>
                <button class="btn btn-sm btn-primary" style="width:auto;" onclick="app.openMealCreateModal('${dStr}')">+ Custom</button>
            </div>
            <div style="padding:16px;">
                <div class="input-group" style="margin-bottom:14px;">
                    <input type="text" placeholder="Search 100+ NZ raw foods & saved meals..." oninput="app.filterFoodModal(this.value)" style="font-size:15px; text-align:left; padding:0 12px;">
                </div>
                <div id="food-modal-results">
        `;

        if (savedMeals.length > 0) {
            html += `<h3 style="color:var(--accent-color); margin-bottom:8px;">Saved Custom Meals</h3>`;
            savedMeals.forEach(sm => {
                html += `
                <div class="card food-search-item" data-search="${sm.name.toLowerCase()}" style="padding:12px; margin-bottom:8px; cursor:pointer;" onclick="app.logSavedMealToDate('${dStr}', '${sm.id}')">
                    <div class="flex-between">
                        <div>
                            <div style="font-weight:bold; font-size:15px;">${sm.name}</div>
                            <div style="font-size:11px; color:var(--text-secondary);">${Math.round(sm.cal)} kcal • P: ${Math.round(sm.pro)}g • C: ${Math.round(sm.car)}g • F: ${Math.round(sm.fat)}g</div>
                        </div>
                        <span class="btn btn-sm btn-primary" style="width:auto;">+ Log</span>
                    </div>
                </div>`;
            });
        }

        html += `<h3 style="color:var(--accent-color); margin:14px 0 8px 0;">NZ Athlete Whole Foods (per 100g)</h3>`;
        NZ_ATHLETE_FOODS.forEach(f => {
            html += `
            <div class="card food-search-item" data-search="${(f.name + ' ' + f.cat).toLowerCase()}" style="padding:12px; margin-bottom:8px; cursor:pointer;" onclick="app.promptLogRawFood('${dStr}', '${f.id}')">
                <div class="flex-between">
                    <div style="flex:1; padding-right:8px;">
                        <div style="font-weight:bold; font-size:14.5px;">${f.name} <span style="font-size:10px; color:var(--text-secondary); font-weight:normal;">(${f.cat})</span></div>
                        <div style="font-size:11px; color:var(--accent-color); font-weight:bold; margin-top:2px;">100g: ${f.cal} kcal | P: ${f.pro}g | C: ${f.car}g | F: ${f.fat}g</div>
                        <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">${f.micros} — ${f.notes}</div>
                    </div>
                    <i class="fas fa-plus-circle text-accent" style="font-size:20px;"></i>
                </div>
            </div>`;
        });
        html += `</div></div>`;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },

    filterFoodModal(q) {
        const query = (q || '').toLowerCase().trim();
        document.querySelectorAll('#food-modal-results .food-search-item').forEach(el => {
            const match = !query || el.getAttribute('data-search').includes(query);
            el.style.display = match ? 'block' : 'none';
        });
    },

    promptLogRawFood(dStr, foodId) {
        const food = NZ_ATHLETE_FOODS.find(f => f.id === foodId);
        if (!food) return;
        const grams = parseFloat(prompt(`How many grams of ${food.name}? (Base: ${food.cal} kcal, ${food.pro}g P per 100g)`, "150"));
        if (isNaN(grams) || grams <= 0) return;
        const mult = grams / 100;
        const entry = this.getOrCreateNutritionDay(dStr);
        entry.loggedMeals.push({
            id: utils.generateId(),
            foodId: food.id,
            name: food.name,
            grams: Math.round(grams),
            type: 'Meal',
            cal: Math.round(food.cal * mult),
            pro: Math.round(food.pro * mult * 10) / 10,
            car: Math.round(food.car * mult * 10) / 10,
            fat: Math.round(food.fat * mult * 10) / 10
        });
        this.recalcNutritionTotals(entry);
        store.save();
        document.getElementById('meal-search-modal').style.display = 'none';
        this.navigate('nutrition');
    },

    logSavedMealToDate(dStr, savedMealId) {
        const sm = (store.state.savedMeals || []).find(m => m.id === savedMealId);
        if (!sm) return;
        const entry = this.getOrCreateNutritionDay(dStr);
        entry.loggedMeals.push({
            id: utils.generateId(),
            savedMealId: sm.id,
            name: sm.name,
            type: 'Meal',
            cal: sm.cal,
            pro: sm.pro,
            car: sm.car,
            fat: sm.fat,
            ingredients: sm.ingredients || []
        });
        this.recalcNutritionTotals(entry);
        store.save();
        document.getElementById('meal-search-modal').style.display = 'none';
        this.navigate('nutrition');
    },

    openMealCreateModal(dStr) {
        document.getElementById('meal-search-modal').style.display = 'none';
        const name = prompt("Meal / Food Name:");
        if (!name || !name.trim()) return;
        const cal = parseFloat(prompt("Calories (kcal):", "450")) || 0;
        const pro = parseFloat(prompt("Protein (g):", "40")) || 0;
        const car = parseFloat(prompt("Carbohydrates (g):", "45")) || 0;
        const fat = parseFloat(prompt("Fat (g):", "12")) || 0;
        const newMeal = { id: 'sm_' + utils.generateId(), name: name.trim(), cal, pro, car, fat, ingredients: [] };
        store.state.savedMeals.push(newMeal);
        const entry = this.getOrCreateNutritionDay(dStr);
        entry.loggedMeals.push({ ...newMeal, savedMealId: newMeal.id, type: 'Meal' });
        this.recalcNutritionTotals(entry);
        store.save();
        this.navigate('nutrition');
    },

    removeLoggedMeal(dStr, idx) {
        const entry = this.getOrCreateNutritionDay(dStr);
        if (entry.loggedMeals && entry.loggedMeals[idx]) {
            entry.loggedMeals.splice(idx, 1);
            this.recalcNutritionTotals(entry);
            store.save();
            this.navigate('nutrition');
        }
    },

    openRankModal() {
        const modal = document.getElementById('settings-modal');
        const rank = utils.getWeeklyRankData();
        const breakdown = utils.getWeeklyRPBreakdown();
        let html = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('settings-modal').style.display='none'">Close</button>
                <div style="font-weight:bold; font-size:16px;">${rank.monthName} Ranked Standings</div>
                <div style="width:60px;"></div>
            </div>
            <div style="padding:16px;">
                <div class="r6-stage-card" style="text-align:center;">
                    <div class="r6-rank-trio">
                        <div>${rank.prevRank ? utils.renderRankCrestSVG(rank.prevRank.color, rank.prevRank.division, 0.65, false) : ''}</div>
                        <div>${utils.renderRankCrestSVG(rank.color, rank.division, 1.05, true)}</div>
                        <div>${rank.nextRank ? utils.renderRankCrestSVG(rank.nextRank.color, rank.nextRank.division, 0.65, false) : ''}</div>
                    </div>
                    <h2 style="margin:0; font-size:24px; color:${rank.color};">${rank.fullName}</h2>
                    <div style="font-size:14px; font-weight:800; margin-top:4px;">${rank.totalRP} Total RP • ${rank.consistencyPct}% Monthly Consistency</div>
                    <div class="r6-line-wrap">
                        <div class="r6-line-fill" style="width:${rank.progress}%; background:${rank.color};"></div>
                        <div class="r6-line-spark" style="left:${rank.progress}%;"></div>
                    </div>
                    <div class="r6-req-pill"><span>${rank.isMax ? 'CHAMPION TIER UNLOCKED' : `${rank.rpNeededForNext} RP TO PROMOTION`}</span></div>
                </div>
                <h3 style="margin-bottom:10px;">RP Contribution Breakdown</h3>
                ${breakdown.map(b => `
                    <div class="card rp-contrib-card" style="border-left: 4px solid ${b.color};">
                        <div class="flex-between">
                            <div>
                                <div style="font-weight:800; font-size:15px;"><i class="fas ${b.icon}" style="color:${b.color};"></i> ${b.title}</div>
                                <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">${b.subtitle}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:900; font-size:15px; color:${b.color};">+${b.rpEarned} RP</div>
                                <div style="font-size:11px; color:var(--text-secondary);">${b.current}/${b.total} ${b.unit}</div>
                            </div>
                        </div>
                        <div class="progress-bg" style="height:6px; margin-top:8px;">
                            <div class="progress-fill" style="width:${b.pct}%; background:${b.color};"></div>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        modal.innerHTML = html;
        modal.style.display = 'flex';
    },

    openSettingsModal() {
        const modal = document.getElementById('settings-modal');
        const s = store.state.settings;
        const f = s.features || {};
        modal.innerHTML = `
            <div class="workout-header-sticky">
                <button class="btn btn-sm" style="width:auto;" onclick="document.getElementById('settings-modal').style.display='none'">Done</button>
                <div style="font-weight:bold; font-size:16px;">IronTrack OS Settings</div>
                <div style="width:60px;"></div>
            </div>
            <div style="padding:16px;">
                <div class="card">
                    <h3 style="margin-top:0;">Theme & Visual Mode</h3>
                    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
                        <button class="btn btn-sm ${s.theme === 'olympus' ? 'btn-primary' : ''}" onclick="app.applyTheme('olympus'); app.openSettingsModal();">Olympus</button>
                        <button class="btn btn-sm ${s.theme === 'dark' ? 'btn-primary' : ''}" onclick="app.applyTheme('dark'); app.openSettingsModal();">Dark</button>
                        <button class="btn btn-sm ${s.theme === 'light' ? 'btn-primary' : ''}" onclick="app.applyTheme('light'); app.openSettingsModal();">Light</button>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">Workout & Timer</h3>
                    <div class="flex-between" style="margin-bottom:10px;">
                        <span>Auto Rest Timer (seconds)</span>
                        <input type="number" class="inline-edit" style="width:80px;" value="${s.restTimer || 120}" onchange="store.state.settings.restTimer = parseInt(this.value)||0; store.save();">
                    </div>
                    <div class="flex-between" style="margin-bottom:10px;">
                        <span>Weight Units</span>
                        <select class="edit-input" style="width:100px; margin:0;" onchange="store.state.settings.units = this.value; store.save(); app.navigate(app.currentPage);">
                            <option value="kg" ${s.units === 'kg' ? 'selected' : ''}>kg</option>
                            <option value="lbs" ${s.units === 'lbs' ? 'selected' : ''}>lbs</option>
                        </select>
                    </div>
                    <div class="flex-between">
                        <span>Phase Goal</span>
                        <select class="edit-input" style="width:130px; margin:0;" onchange="store.state.settings.weightGoal = this.value; store.save();">
                            <option value="cutting" ${s.weightGoal === 'cutting' ? 'selected' : ''}>Cutting</option>
                            <option value="maintaining" ${s.weightGoal === 'maintaining' ? 'selected' : ''}>Maintaining</option>
                            <option value="bulking" ${s.weightGoal === 'bulking' ? 'selected' : ''}>Bulking</option>
                        </select>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">Home Dashboard Modules</h3>
                    ${[
                        ['showQuote', 'Stoic Daily Quote'],
                        ['showRankBanner', 'Monthly Ranked Banner'],
                        ['showWeekStrip', '7-Day Consistency Strip'],
                        ['showHeatmap', '28-Day Muscle Heatmap'],
                        ['showActivityGrid', '12-Week Consistency Grid']
                    ].map(([key, label]) => `
                        <div class="flex-between data-row">
                            <span>${label}</span>
                            <input type="checkbox" ${f[key] ? 'checked' : ''} onchange="store.state.settings.features['${key}'] = this.checked; store.save(); app.navigate(app.currentPage);">
                        </div>
                    `).join('')}
                </div>
            </div>`;
        modal.style.display = 'flex';
    },

    promptProfileEdit() {
        const name = prompt("Athlete Name:", store.state.user.name);
        if (name !== null && name.trim()) store.state.user.name = name.trim();
        const targetW = parseFloat(prompt(`Target Bodyweight (${utils.unitLabel()}):`, store.state.user.targetWeight));
        if (!isNaN(targetW) && targetW > 0) store.state.user.targetWeight = targetW;
        store.save();
        this.navigate('profile');
    },

    startDefaultChallenge() {
        const title = prompt("Challenge Name:", "75 Iron Discipline") || "75 Iron Discipline";
        const days = parseInt(prompt("Duration in Days:", "75")) || 75;
        const start = new Date();
        const end = new Date(start.getTime() + (days - 1) * 86400000);
        const startStr = utils.getLocalISODate(start);
        store.state.challenge = {
            isActive: true,
            title: title.trim(),
            startDate: startStr,
            endDate: utils.getLocalISODate(end),
            goals: [
                { id: 'g_w', type: 'workout', count: 1, createdAt: startStr, showInActionPlan: false },
                { id: 'g_n', type: 'nutrition', createdAt: startStr, showInActionPlan: false },
                { id: 'g_bw', type: 'weight', createdAt: startStr, showInActionPlan: false },
                { id: 'g_c', type: 'cardio', createdAt: startStr, showInActionPlan: true },
                { id: 'g_h2o', type: 'water', target: '3.5L Water', createdAt: startStr, showInActionPlan: true }
            ]
        };
        store.save();
        this.navigate('profile');
    },

    endChallenge() {
        if (!confirm("End current active challenge?")) return;
        store.state.challenge.isActive = false;
        store.save();
        this.navigate('profile');
    },

    handleProgressPhotoUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            store.state.history.progressPhotos.unshift({
                id: utils.generateId(),
                date: new Date().toISOString(),
                weight: store.state.user.currentWeight || 0,
                dataUrl: e.target.result
            });
            store.save();
            this.navigate('profile');
        };
        reader.readAsDataURL(file);
    },

    deleteProgressPhoto(idx) {
        if (!confirm("Delete this progress photo?")) return;
        store.state.history.progressPhotos.splice(idx, 1);
        store.save();
        this.navigate('profile');
    },

    exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.state));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `irontrack_backup_${utils.getLocalISODate(new Date())}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
    },

    importJSONPrompt() {
        const raw = prompt("Paste exported IronTrack JSON backup string below:");
        if (!raw || !raw.trim()) return;
        try {
            const parsed = JSON.parse(raw);
            store.state = store.migrate(parsed);
            store.save();
            this.applyTheme(store.state.settings.theme || 'olympus');
            this.navigate('home');
            alert("Backup restored successfully!");
        } catch (err) {
            alert("Invalid JSON backup file.");
        }
    }
};

window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
