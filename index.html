        `;
        modal.innerHTML = html;
        modal.style.display = 'flex';
        this.renderDraftMeal();
    },
    addNZRawIngredientToDraft() {
        const sel = document.getElementById('nz-raw-ing-select');
        const grams = parseFloat(document.getElementById('nz-raw-ing-grams').value) || 0;
        if (!sel.value || grams <= 0) {
            alert("Select a whole-food ingredient and enter a valid weight in grams.");
            return;
        }
        const food = NZ_ATHLETE_FOODS.find(f => f.id === sel.value);
        if (!food) return;
        const ratio = grams / 100;
        this.draftMealIngredients.push({
            foodId: food.id,
            grams: Math.round(grams),
            name: `${food.name} (${Math.round(grams)}g)`,
            cal: Math.round(food.cal * ratio * 10) / 10,
            pro: Math.round(food.pro * ratio * 10) / 10,
            car: Math.round(food.car * ratio * 10) / 10,
            fat: Math.round(food.fat * ratio * 10) / 10
        });
        sel.value = '';
        this.renderDraftMeal();
    },
    addIngredientToDraft() {
        const name = document.getElementById('ing-name').value.trim() || 'Ingredient';
        const cal = parseFloat(document.getElementById('ing-cal').value) || 0;
        const pro = parseFloat(document.getElementById('ing-pro').value) || 0;
        const car = parseFloat(document.getElementById('ing-car').value) || 0;
        const fat = parseFloat(document.getElementById('ing-fat').value) || 0;
        if(cal === 0 && pro === 0 && car === 0 && fat === 0) return;
        this.draftMealIngredients.push({ name, cal, pro, car, fat });
        document.getElementById('ing-name').value = '';
        document.getElementById('ing-cal').value = '';
        document.getElementById('ing-pro').value = '';
        document.getElementById('ing-car').value = '';
        document.getElementById('ing-fat').value = '';
        this.renderDraftMeal();
    },
    updateDraftIngredientGrams(idx, newGrams) {
        const ing = this.draftMealIngredients[idx];
        const g = parseFloat(newGrams);
        if (!ing || !ing.foodId || isNaN(g) || g <= 0) return;
        const food = NZ_ATHLETE_FOODS.find(f => f.id === ing.foodId);
        if (!food) return;
        const ratio = g / 100;
        ing.grams = Math.round(g);
        ing.name = `${food.name} (${Math.round(g)}g)`;
        ing.cal = Math.round(food.cal * ratio * 10) / 10;
        ing.pro = Math.round(food.pro * ratio * 10) / 10;
        ing.car = Math.round(food.car * ratio * 10) / 10;
        ing.fat = Math.round(food.fat * ratio * 10) / 10;
        this.renderDraftMeal();
    },
    updateDraftIngredientField(idx, field, val) {
        const ing = this.draftMealIngredients[idx];
        if (!ing) return;
        if (field === 'name') ing.name = val;
        else ing[field] = parseFloat(val) || 0;
        this.renderDraftMeal();
    },
    removeDraftIngredient(idx) {
        this.draftMealIngredients.splice(idx, 1);
        this.renderDraftMeal();
    },
    renderDraftMeal() {
        let tCal = 0, tPro = 0, tCar = 0, tFat = 0;
        let listHtml = '';
        this.draftMealIngredients.forEach((ing, i) => {
            tCal += ing.cal; tPro += ing.pro; tCar += ing.car; tFat += ing.fat;
            if (ing.foodId) {
                listHtml += `<div class="data-row" style="padding:10px 0;">
                    <div class="flex-between" style="gap:8px; margin-bottom:4px;">
                        <span style="font-weight:bold; font-size:13.5px; color:var(--text-primary); flex:1;">${ing.name}</span>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <input type="number" inputmode="decimal" class="inline-edit" style="width:68px; padding:4px;" value="${ing.grams || 100}" onchange="app.updateDraftIngredientGrams(${i}, this.value)">
                            <span class="text-muted" style="font-size:11px;">g</span>
                            <button class="btn-icon" style="color:var(--pending); background:transparent; border:none; width:28px; height:28px;" onclick="app.removeDraftIngredient(${i})"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <div class="text-muted" style="font-size:11.5px;">${Math.round(ing.cal)} kcal • ${Math.round(ing.pro)}g P • ${Math.round(ing.car)}g C • ${Math.round(ing.fat)}g F</div>
                </div>`;
            } else {
                listHtml += `<div class="data-row" style="padding:10px 0;">
                    <div class="flex-between" style="gap:8px; margin-bottom:6px;">
                        <input type="text" class="edit-input" style="margin:0; padding:5px 8px; font-weight:bold; font-size:13px !important; flex:1;" value="${(ing.name || '').replace(/"/g, '&quot;')}" onchange="app.updateDraftIngredientField(${i}, 'name', this.value)">
                        <button class="btn-icon" style="color:var(--pending); background:transparent; border:none; width:28px; height:28px;" onclick="app.removeDraftIngredient(${i})"><i class="fas fa-times"></i></button>
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:6px;">
                        <div><span class="text-muted" style="font-size:9.5px; display:block;">Kcal</span><input type="number" class="inline-edit" value="${Math.round(ing.cal)}" onchange="app.updateDraftIngredientField(${i}, 'cal', this.value)"></div>
                        <div><span class="text-muted" style="font-size:9.5px; display:block;">Pro</span><input type="number" class="inline-edit" value="${Math.round(ing.pro)}" onchange="app.updateDraftIngredientField(${i}, 'pro', this.value)"></div>
                        <div><span class="text-muted" style="font-size:9.5px; display:block;">Car</span><input type="number" class="inline-edit" value="${Math.round(ing.car)}" onchange="app.updateDraftIngredientField(${i}, 'car', this.value)"></div>
                        <div><span class="text-muted" style="font-size:9.5px; display:block;">Fat</span><input type="number" class="inline-edit" value="${Math.round(ing.fat)}" onchange="app.updateDraftIngredientField(${i}, 'fat', this.value)"></div>
                    </div>
                </div>`;
            }
        });
        document.getElementById('draft-ingredients-list').innerHTML = listHtml || '<p class="text-muted" style="font-size:12px;">No ingredients added yet.</p>';
        document.getElementById('draft-meal-totals').innerHTML = `
            <div style="font-size:18px; font-weight:bold; color:var(--accent-color);">${Math.round(tCal)} kcal</div>
            <div class="text-muted" style="font-size:12px;">${Math.round(tPro)}g Pro • ${Math.round(tCar)}g Carbs • ${Math.round(tFat)}g Fat</div>
        `;
    },
    saveCustomMeal() {
        const name = document.getElementById('create-meal-name').value.trim();
        if(!name) { alert("Please give your meal a name."); return; }
        if(this.draftMealIngredients.length === 0) { alert("Please add at least one ingredient."); return; }
        let tCal = 0, tPro = 0, tCar = 0, tFat = 0;
        this.draftMealIngredients.forEach(ing => { tCal += ing.cal; tPro += ing.pro; tCar += ing.car; tFat += ing.fat; });
        if (this.editingSavedMealId) {
            const idx = store.state.savedMeals.findIndex(m => m.id === this.editingSavedMealId);
            if (idx > -1) {
                store.state.savedMeals[idx] = {
                    ...store.state.savedMeals[idx],
                    name,
                    cal: tCal,
                    pro: tPro,
                    car: tCar,
                    fat: tFat,
                    ingredients: [...this.draftMealIngredients]
                };
            }
            this.editingSavedMealId = null;
        } else {
            store.state.savedMeals.push({
                id: utils.generateId(),
                name,
                cal: tCal, pro: tPro, car: tCar, fat: tFat,
                ingredients: [...this.draftMealIngredients]
            });
        }
        store.save();
        document.getElementById('meal-create-modal').style.display = 'none';
        this.filterMeals();
    },
    selectMealToLog(mealId) {
        const meal = store.state.savedMeals.find(m => m.id === mealId);
        if(!meal) return;
        const multInput = prompt(`Log "${meal.name}" to ${this.activeMealType}.\nEnter portion multiplier (e.g. 1.0 = full serving, 0.5 = half, 2.0 = double):`, "1.0");
        if(multInput === null) return;
        const mult = parseFloat(multInput);
        if(isNaN(mult) || mult <= 0) return;
        const todayStr = utils.getLocalISODate(new Date());
        let todayNut = store.state.history.nutrition.find(e => utils.getLocalISODate(e.date) === todayStr);
        if (!todayNut) {
            todayNut = { date: new Date().toISOString(), cal: 0, pro: 0, car: 0, fat: 0, loggedMeals: [], waterLog: [] };
            store.state.history.nutrition.push(todayNut);
        }
        const addCal = meal.cal * mult;
        const addPro = meal.pro * mult;
        const addCar = meal.car * mult;
        const addFat = meal.fat * mult;
        todayNut.cal += addCal; todayNut.pro += addPro; todayNut.car += addCar; todayNut.fat += addFat;
        if(!todayNut.loggedMeals) todayNut.loggedMeals = [];
        todayNut.loggedMeals.push({
            id: utils.generateId(),
            savedMealId: meal.id,
            name: `${meal.name} (${mult}x)`,
            type: this.activeMealType,
            cal: addCal, pro: addPro, car: addCar, fat: addFat,
            ingredients: meal.ingredients ? JSON.parse(JSON.stringify(meal.ingredients)) : []
        });
        store.save();
        document.getElementById('meal-search-modal').style.display = 'none';
        this.navigate('nutrition', true);
    },
    removeLoggedMeal(loggedId) {
        if(!confirm("Remove this logged item from today?")) return;
        const todayStr = utils.getLocalISODate(new Date());
        let todayNut = store.state.history.nutrition.find(e => utils.getLocalISODate(e.date) === todayStr);
        if(!todayNut || !todayNut.loggedMeals) return;
        const meal = todayNut.loggedMeals.find(m => m.id === loggedId);
        if(meal) {
            todayNut.cal = Math.max(0, todayNut.cal - meal.cal);
            todayNut.pro = Math.max(0, todayNut.pro - meal.pro);
            todayNut.car = Math.max(0, todayNut.car - meal.car);
            todayNut.fat = Math.max(0, todayNut.fat - meal.fat);
            todayNut.loggedMeals = todayNut.loggedMeals.filter(m => m.id !== loggedId);
            store.save();
            this.navigate('nutrition', true);
        }
    },
    switchRoutine(id) { store.state.activeRoutineId = id; store.save(); this.navigate('workouts-Program', true); },
    createNewRoutine() { const name = prompt("Enter a name for your new Workout Split:"); if (!name) return; const newId = 'routine_' + utils.generateId(); const blankDays = [0,1,2,3,4,5,6].map(d => ({ day: d, workouts: [] })); store.state.routines.push({ id: newId, name: name, days: blankDays }); store.state.activeRoutineId = newId; store.save(); this.startRoutineEdits(1); },
    deleteRoutine() { if (store.state.routines.length <= 1) { alert("You cannot delete your only workout split."); return; } if (confirm("Are you sure you want to delete this entire workout split?")) { store.state.routines = store.state.routines.filter(r => r.id !== store.state.activeRoutineId); store.state.activeRoutineId = store.state.routines[0].id; store.save(); this.editingRoutineMode = false; this.draftRoutine = null; this.navigate('workouts-Program'); } },
    startRoutineEdits(initialDay = 1) {
        this.editingRoutineMode = true;
        this.editingDayIndex = initialDay !== undefined ? initialDay : 1;
        this.draftRoutine = JSON.parse(JSON.stringify(utils.getActiveRoutine()));
        this.navigate('workouts-Program', true);
    },
    selectEditDay(dayNum) {
        this.editingDayIndex = dayNum;
        this.navigate('workouts-Program', true);
    },
    cancelRoutineEdits() { this.editingRoutineMode = false; this.draftRoutine = null; this.navigate('workouts-Program', true); },
    saveRoutineEdits() {
        const idx = store.state.routines.findIndex(r => r.id === store.state.activeRoutineId);
        if(idx > -1) {
            store.state.routines[idx] = this.draftRoutine;
            this.draftRoutine.days.forEach(d => d.workouts.forEach(w => w.exercises.forEach(ex => {
                store.syncExerciseGlobally(ex.name, {
                    name: ex.name,
                    muscles: utils.getMuscles(ex),
                    targetSets: ex.targetSets,
                    targetReps: ex.targetReps
                });
            })));
            store.save();
        }
        this.editingRoutineMode = false;
        this.draftRoutine = null;
        this.navigate('workouts-Program', true);
    },
    updateDraftName(val) { this.draftRoutine.name = val; },
    draftAddWorkout(dayIndex) { const d = this.draftRoutine.days.find(x => x.day === dayIndex); d.workouts.push({ id: 'w_' + utils.generateId(), name: 'New Workout', exercises: [] }); this.navigate('workouts-Program', true); },
    draftDeleteWorkout(dayIndex, wIdx) { if(confirm("Remove this workout from this day?")) { this.draftRoutine.days.find(x => x.day === dayIndex).workouts.splice(wIdx, 1); this.navigate('workouts-Program', true); } },
    draftUpdateWorkoutName(dayIndex, wIdx, val) { this.draftRoutine.days.find(x => x.day === dayIndex).workouts[wIdx].name = val; },
    draftUpdateEx(dayIndex, wIdx, exIdx, field, val) {
        const ex = this.draftRoutine.days.find(x => x.day === dayIndex).workouts[wIdx].exercises[exIdx];
        const oldName = ex.name;
        if (field === 'targetSets') ex[field] = parseInt(val) || 1;
        else if (field === 'name') ex[field] = String(val || '').trim().slice(0, MAX_EX_TITLE_LEN);
        else ex[field] = val;
        store.syncExerciseGlobally(oldName, {
            name: ex.name,
            muscles: utils.getMuscles(ex),
            targetSets: ex.targetSets,
            targetReps: ex.targetReps
        });
    },
    draftMoveEx(dayIndex, wIdx, exIdx, dir) { const list = this.draftRoutine.days.find(x => x.day === dayIndex).workouts[wIdx].exercises; if(exIdx + dir < 0 || exIdx + dir >= list.length) return; const temp = list[exIdx]; list[exIdx] = list[exIdx + dir]; list[exIdx + dir] = temp; this.navigate('workouts-Program', true); },
    draftRemoveEx(dayIndex, wIdx, exIdx) { this.draftRoutine.days.find(x => x.day === dayIndex).workouts[wIdx].exercises.splice(exIdx, 1); this.navigate('workouts-Program', true); },
    draftAddEx(dayIndex, wIdx) { this.openRoutineExercisePicker(dayIndex, wIdx); },
    logWeight() {
        const val = document.getElementById('bw-input').value; const dateVal = document.getElementById('bw-date-input').value;
        if(val) {
            let targetDateStr = utils.getLocalISODate(new Date()); let isoStr = new Date().toISOString();
            if(dateVal) { targetDateStr = dateVal; const parts = dateVal.split('-'); isoStr = new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0).toISOString(); }
            const existing = store.state.history.bodyweight.find(e => utils.getLocalISODate(e.date) === targetDateStr);
            if(existing) { existing.weight = parseFloat(val); if(targetDateStr === utils.getLocalISODate(new Date())) store.state.user.currentWeight = parseFloat(val); store.save(); } else { store.addBodyweight(val, isoStr); }
            this.navigate('bodyweight', true);
        }
    },
    loadNutritionForDate(dateVal) {
        if(!dateVal) return; const entry = store.state.history.nutrition.find(e => utils.getLocalISODate(e.date) === dateVal);
        document.getElementById('nut-cal').value = entry ? Math.round(entry.cal) : ''; document.getElementById('nut-pro').value = entry ? Math.round(entry.pro) : ''; document.getElementById('nut-car').value = entry ? Math.round(entry.car) : ''; document.getElementById('nut-fat').value = entry ? Math.round(entry.fat) : '';
    },
    logNutrition() {
        const cal = document.getElementById('nut-cal').value; const pro = document.getElementById('nut-pro').value; const car = document.getElementById('nut-car').value; const fat = document.getElementById('nut-fat').value; const dateVal = document.getElementById('nut-date-input').value;
        if(cal || pro || car || fat) {
            let targetDateStr = utils.getLocalISODate(new Date()); let isoStr = new Date().toISOString();
            if(dateVal) { targetDateStr = dateVal; const parts = dateVal.split('-'); isoStr = new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0).toISOString(); }
            const existing = store.state.history.nutrition.find(e => utils.getLocalISODate(e.date) === targetDateStr);
            if(existing) { existing.cal = parseFloat(cal)||0; existing.pro = parseFloat(pro)||0; existing.car = parseFloat(car)||0; existing.fat = parseFloat(fat)||0; }
            else { store.state.history.nutrition.push({ date: isoStr, cal: parseFloat(cal)||0, pro: parseFloat(pro)||0, car: parseFloat(car)||0, fat: parseFloat(fat)||0, loggedMeals: [], waterLog: [] }); }
            store.save(); this.navigate('nutrition', true);
        }
    },
    editBw(isoDate, newWeight) { if(newWeight) { store.updateBodyweight(isoDate, newWeight); } },
    editNut(isoDate, field, val) { store.updateNutrition(isoDate, field, val); },
    deleteLog(type, isoDate) { if(confirm("Delete this entry permanently?")) { store.deleteEntry(type, isoDate); this.navigate('data', true); } },
    exportData() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.state)); const dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr); dlAnchorElem.setAttribute("download", `irontrack_backup_${utils.getLocalISODate(new Date())}.json`); document.body.appendChild(dlAnchorElem); dlAnchorElem.click(); dlAnchorElem.remove(); },
    importData(event) { const file = event.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); if(imported && imported.history) { store.state = store.migrate(imported); store.save(); alert("Data successfully restored!"); app.applyTheme(store.state.settings.theme || 'olympus'); app.navigate('home'); } else { alert("Invalid backup file format."); } } catch(err) { alert("Error reading file."); } }; reader.readAsText(file); },
    getChartOptions() {
        const range = store.state.settings.chartRange || '90';
        let minDate = undefined;
        if (range !== 'all') { const d = new Date(); d.setDate(d.getDate() - parseInt(range)); minDate = d.setHours(0,0,0,0); }
        const textSec = utils.getCssVar('--text-secondary', '#8e8e93');
        const borderCol = utils.getCssVar('--border', '#2c2c2e');
        return {
            responsive: true, maintainAspectRatio: false,
            scales: {
                x: { type: 'time', min: minDate, time: { unit: range === '7' ? 'day' : 'week', tooltipFormat: 'dd MMM yyyy' }, grid: { color: borderCol }, ticks: { color: textSec, maxTicksLimit: 6 } },
                y: { grid: { color: borderCol }, ticks: { color: textSec } }
            },
            plugins: { legend: { labels: { color: textSec, boxWidth: 12, font: { size: 10 } } } }
        };
    },
    initBodyweightChart() {
        const ctx = document.getElementById('bwChart'); if(!ctx) return;
        const sorted = [...store.state.history.bodyweight].sort((a,b) => new Date(a.date) - new Date(b.date));
        const rawPoints = sorted.map(e => ({ x: new Date(e.date).setHours(0,0,0,0), y: e.weight }));
        const smaData = utils.calculateSMA(rawPoints, 7);
        const accentCol = utils.getCssVar('--accent-color', '#ff3b30');
        const warnCol = utils.getCssVar('--warning', '#ff9500');
        const textSec = utils.getCssVar('--text-secondary', '#8e8e93');
        const showCals = store.state.settings.showCaloriesOnBwChart !== false;
        const uLbl = utils.unitLabel();
        let datasets = [
            { label: `7d Trend (${uLbl})`, data: smaData, borderColor: accentCol, backgroundColor: 'transparent', borderWidth: 3, tension: 0.4, pointRadius: 0, yAxisID: 'y' },
            { label: `Daily (${uLbl})`, data: rawPoints, borderColor: textSec, backgroundColor: textSec, borderWidth: 0, pointRadius: 3, showLine: false, yAxisID: 'y' }
        ];
        const opts = this.getChartOptions();
        if (showCals) {
            const nutSorted = [...store.state.history.nutrition].filter(n => n.cal > 0).sort((a,b) => new Date(a.date) - new Date(b.date));
            const calPoints = nutSorted.map(n => ({ x: new Date(n.date).setHours(0,0,0,0), y: Math.round(n.cal) }));
            const calSma = utils.calculateSMA(calPoints, 7);
            datasets.push({
                label: 'Calories (7d Avg kcal)',
                data: calSma,
                borderColor: warnCol,
                backgroundColor: 'rgba(255, 149, 0, 0.12)',
                borderWidth: 2,
                borderDash: [4, 4],
                tension: 0.35,
                pointRadius: 2,
                fill: true,
                yAxisID: 'y1'
            });
            opts.scales.y1 = {
                position: 'right',
                grid: { drawOnChartArea: false },
                ticks: { color: warnCol, callback: (v) => v + ' kcal' }
            };
        }
        if(this.charts.bw) this.charts.bw.destroy();
        this.charts.bw = new Chart(ctx, { type: 'line', data: { datasets }, options: opts });
    },
    updateVolumeChart() {
        const ctx = document.getElementById('volChart'); if(!ctx) return;
        const filterEl = document.getElementById('vol-chart-filter');
        const filterVal = filterEl ? filterEl.value : (store.state.settings.lastVolFilter || 'total');
        store.state.settings.lastVolFilter = filterVal; store.save();
        const volData = utils.getWorkoutVolumeHistory();
        const infoCol = utils.getCssVar('--info', '#0a84ff');
        const accentCol = utils.getCssVar('--accent-color', '#ff3b30');
        const successCol = utils.getCssVar('--success', '#32d74b');
        let rawPoints = [];
        let labelName = 'Total Workout Volume';
        let lineCol = infoCol;
        if (filterVal === 'total') {
            rawPoints = volData.total || [];
            labelName = 'Total Volume (3-Wkt SMA)';
            lineCol = infoCol;
        } else if (filterVal.startsWith('muscle:')) {
            const m = filterVal.split(':')[1];            rawPoints = volData.byMuscle[m] || [];
            labelName = `${m} Volume (3-Wkt SMA)`;
            lineCol = accentCol;
        } else if (filterVal.startsWith('ex:')) {
            const exName = filterVal.substring(3);
            rawPoints = volData.byExercise[exName] || [];
            labelName = `${exName} Volume (3-Wkt SMA)`;
            lineCol = successCol;
        }
        const smaData = utils.calculateSMA(rawPoints, 3);
        const textSec = utils.getCssVar('--text-secondary', '#8e8e93');
        if(this.charts.vol) this.charts.vol.destroy();
        this.charts.vol = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    { label: labelName, data: smaData, borderColor: lineCol, backgroundColor: 'rgba(10, 132, 255, 0.1)', fill: true, borderWidth: 3, tension: 0.4, pointRadius: 0 },
                    { label: 'Session Volume', data: rawPoints, borderColor: textSec, backgroundColor: textSec, borderWidth: 0, pointRadius: 3, showLine: false }
                ]
            },
            options: this.getChartOptions()
        });
    },
    updateExerciseChart() {
        const select = document.getElementById('Analytics-ex-select'); const ctx = document.getElementById('exChart'); if(!select || !ctx) return;
        const [exName, variation] = select.value.split('||'); const history = utils.getExerciseHistory(exName, variation);
        const e1rmPoints = history.map(h => ({ x: h.date, y: parseFloat(h.e1rm.toFixed(1)) })); const weightPoints = history.map(h => ({ x: h.date, y: h.maxWeight }));
        const e1rmSMA = utils.calculateSMA(e1rmPoints, 3); const weightSMA = utils.calculateSMA(weightPoints, 3);
        const accentCol = utils.getCssVar('--accent-color', '#ff3b30'); const successCol = utils.getCssVar('--success', '#32d74b');
        const uLbl = utils.unitLabel();
        if(this.charts.ex) this.charts.ex.destroy();
        this.charts.ex = new Chart(ctx, { type: 'line', data: { datasets: [ { label: `Est 1RM (${uLbl})`, data: e1rmSMA, borderColor: accentCol, borderWidth: 3, tension: 0.4, pointRadius: 2 }, { label: `Max Weight (${uLbl})`, data: weightSMA, borderColor: successCol, borderWidth: 2, borderDash: [5, 5], tension: 0.4, pointRadius: 2 } ] }, options: this.getChartOptions() });
    },
    initNutritionChart() {
        const ctx = document.getElementById('nutChart'); if(!ctx) return;
        const sorted = [...store.state.history.nutrition].filter(e => e.cal > 0).sort((a,b) => new Date(a.date) - new Date(b.date));
        const pCal = sorted.map(e => ({ x: new Date(e.date).setHours(0,0,0,0), y: e.cal })); const pPro = sorted.map(e => ({ x: new Date(e.date).setHours(0,0,0,0), y: e.pro })); const pCar = sorted.map(e => ({ x: new Date(e.date).setHours(0,0,0,0), y: e.car })); const pFat = sorted.map(e => ({ x: new Date(e.date).setHours(0,0,0,0), y: e.fat }));
        const sCal = utils.calculateSMA(pCal, 7); const sPro = utils.calculateSMA(pPro, 7); const sCar = utils.calculateSMA(pCar, 7); const sFat = utils.calculateSMA(pFat, 7);
        const accentCol = utils.getCssVar('--accent-color', '#ff3b30'); const successCol = utils.getCssVar('--success', '#32d74b'); const infoCol = utils.getCssVar('--info', '#0a84ff'); const warnCol = utils.getCssVar('--warning', '#ff9500'); const textSec = utils.getCssVar('--text-secondary', '#8e8e93');
        const opts = this.getChartOptions(); opts.scales.y1 = { position: 'right', grid: { drawOnChartArea: false }, ticks: { color: textSec } };
        if(this.charts.nut) this.charts.nut.destroy();
        this.charts.nut = new Chart(ctx, { type: 'line', data: { datasets: [ { label: 'Calories (kCal)', data: sCal, borderColor: accentCol, yAxisID: 'y', borderWidth: 3, tension: 0.4, pointRadius: 0 }, { label: 'Protein (g)', data: sPro, borderColor: successCol, yAxisID: 'y1', borderWidth: 2, tension: 0.4, pointRadius: 0 }, { label: 'Carbs (g)', data: sCar, borderColor: infoCol, yAxisID: 'y1', borderWidth: 2, tension: 0.4, pointRadius: 0 }, { label: 'Fats (g)', data: sFat, borderColor: warnCol, yAxisID: 'y1', borderWidth: 2, tension: 0.4, pointRadius: 0 } ] }, options: opts });
    }
};
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
