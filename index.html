            <div id="past-inputs-nut" style="display:none; grid-template-columns: 1fr 1fr 1fr 1fr; gap:6px; margin-bottom:8px;">
                <input type="number" id="past-cal" class="edit-input" placeholder="kcal" style="margin:0;">
                <input type="number" id="past-pro" class="edit-input" placeholder="Pro(g)" style="margin:0;">
                <input type="number" id="past-car" class="edit-input" placeholder="Carb(g)" style="margin:0;">
                <input type="number" id="past-fat" class="edit-input" placeholder="Fat(g)" style="margin:0;">
            </div>
            <button class="btn btn-sm btn-primary" style="width:100%;" onclick="app.savePastEntry()"><i class="fas fa-plus"></i> Save Past Entry</button>
        </div>`;

        const bwWeeks = utils.getWeeklyData(store.state.history.bodyweight);
        html += `<div class="card"><h2>Bodyweight Logs</h2><p class="text-muted" style="font-size:12px; margin-bottom:12px;">Tap a week to view or edit daily weigh-ins.</p>`;
        const bwKeys = Object.keys(bwWeeks).sort((a,b) => b - a);
        if(bwKeys.length === 0) html += `<p class="text-muted">No bodyweight entries.</p>`;
        bwKeys.forEach(monTs => {
            const w = bwWeeks[monTs]; const avg = (w.entries.reduce((acc, cur) => acc + cur.weight, 0) / w.entries.length).toFixed(1);
            html += `<div style="border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden;">
                <div class="flex-between" style="padding:12px; background:var(--surface-elevated); cursor:pointer;" onclick="app.toggleAccordion('bw_${monTs}')">
                    <span style="font-weight:bold; font-size:14px;">Week of ${utils.formatDateShort(parseInt(monTs))}</span>
                    <span style="color:var(--accent-color); font-weight:bold; font-size:14px;">Avg: ${avg} kg <i class="fas fa-chevron-down" style="font-size:11px; margin-left:4px;"></i></span>
                </div>
                <div id="bw_${monTs}" style="display:none; padding:12px; background:var(--surface-color);">`;
            w.entries.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(e => {
                html += `<div class="flex-between" style="padding:6px 0; border-bottom:1px solid var(--border);">
                    <span class="text-muted" style="font-size:13px;">${utils.formatDate(e.date)}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="number" step="0.1" class="inline-edit" style="width:70px;" value="${e.weight}" onchange="store.updateBodyweight('${e.date}', this.value)"> <span class="text-muted" style="font-size:12px;">kg</span>
                        <button class="btn-icon text-accent" style="width:28px; height:28px;" onclick="app.deleteLog('bodyweight', '${e.date}')"><i class="fas fa-trash" style="font-size:11px;"></i></button>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
        });
        html += `</div>`;

        const nutWeeks = utils.getWeeklyData(store.state.history.nutrition);
        html += `<div class="card"><h2>Nutrition Logs</h2><p class="text-muted" style="font-size:12px; margin-bottom:12px;">Tap a week to view or edit daily macros.</p>`;
        const nutKeys = Object.keys(nutWeeks).sort((a,b) => b - a);
        if(nutKeys.length === 0) html += `<p class="text-muted">No nutrition entries.</p>`;
        nutKeys.forEach(monTs => {
            const w = nutWeeks[monTs]; const avgCal = Math.round(w.entries.reduce((acc, cur) => acc + (cur.cal||0), 0) / w.entries.length);
            html += `<div style="border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden;">
                <div class="flex-between" style="padding:12px; background:var(--surface-elevated); cursor:pointer;" onclick="app.toggleAccordion('nut_${monTs}')">
                    <span style="font-weight:bold; font-size:14px;">Week of ${utils.formatDateShort(parseInt(monTs))}</span>
                    <span style="color:var(--success); font-weight:bold; font-size:14px;">Avg: ${avgCal} kcal <i class="fas fa-chevron-down" style="font-size:11px; margin-left:4px;"></i></span>
                </div>
                <div id="nut_${monTs}" style="display:none; padding:12px; background:var(--surface-color);">
                    <div class="nut-grid" style="margin-bottom:4px;"><span class="nut-label">Date</span><span class="nut-label">Calories</span><span class="nut-label">Protein</span><span class="nut-label">Carbs</span><span class="nut-label">Fats</span><span></span></div>`;
            w.entries.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(n => {
                html += `<div class="nut-grid" style="padding:6px 0; border-bottom:1px solid var(--border);">
                    <span class="text-muted" style="font-size:11px;">${utils.formatDateShort(n.date)}</span>
                    <input type="number" class="inline-edit" style="width:100%;" value="${n.cal}" onchange="store.updateNutrition('${n.date}', 'cal', this.value)">
                    <input type="number" class="inline-edit" style="width:100%;" value="${n.pro}" onchange="store.updateNutrition('${n.date}', 'pro', this.value)">
                    <input type="number" class="inline-edit" style="width:100%;" value="${n.car}" onchange="store.updateNutrition('${n.date}', 'car', this.value)">
                    <input type="number" class="inline-edit" style="width:100%;" value="${n.fat}" onchange="store.updateNutrition('${n.date}', 'fat', this.value)">
                    <button class="btn-icon text-accent" style="width:26px; height:26px;" onclick="app.deleteLog('nutrition', '${n.date}')"><i class="fas fa-trash" style="font-size:10px;"></i></button>
                </div>`;
            });
            html += `</div></div>`;
        });
        html += `</div>`;

        const wWeeks = utils.getWeeklyData(store.state.history.workouts);
        html += `<div class="card"><h2>Workout History</h2><p class="text-muted" style="font-size:12px; margin-bottom:12px;">Grouped by week. Tap to expand sessions.</p>`;
        const wKeys = Object.keys(wWeeks).sort((a,b) => b - a);
        if(wKeys.length === 0) html += `<p class="text-muted">No workouts logged.</p>`;
        wKeys.forEach(monTs => {
            const w = wWeeks[monTs]; const validSessions = w.entries.filter(x => !x.isSkipped).length;
            html += `<div style="border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden;">
                <div class="flex-between" style="padding:12px; background:var(--surface-elevated); cursor:pointer;" onclick="app.toggleAccordion('w_${monTs}')">
                    <span style="font-weight:bold; font-size:14px;">Week of ${utils.formatDateShort(parseInt(monTs))}</span>
                    <span style="color:var(--info); font-weight:bold; font-size:14px;">${validSessions} Sessions <i class="fas fa-chevron-down" style="font-size:11px; margin-left:4px;"></i></span>
                </div>
                <div id="w_${monTs}" style="display:none; padding:12px; background:var(--surface-color);">`;
            w.entries.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(session => {
                let badge = `<span style="color:var(--accent-color); font-size:12px;">${utils.calcVolume(session.exercises ? session.exercises.flatMap(e=>e.sets) : [])} kg</span>`;
                if (session.isSkipped) badge = `<span style="color:var(--warning); font-size:12px;">Rest Day</span>`;
                else if (session.isActivity) badge = `<span style="color:var(--success); font-size:12px;">Activity</span>`;
                html += `<div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border);">
                    <div><div style="font-weight:bold; font-size:14px;">${session.name}</div><div class="text-muted" style="font-size:11px;">${utils.formatDate(session.date)} • ${session.duration || 0}m</div></div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        ${badge}
                        <button class="btn-icon" style="width:28px; height:28px;" onclick="app.editHistoricalWorkout('${session.id}')"><i class="fas fa-pen" style="font-size:11px;"></i></button>
                        <button class="btn-icon text-accent" style="width:28px; height:28px;" onclick="app.deleteWorkoutById('${session.id}')"><i class="fas fa-trash" style="font-size:11px;"></i></button>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
        });
        html += `</div>`;
        return html;
    }
};

const app = {
    currentView: 'home', charts: {},
    init() {
        store.load();
        this.applyTheme(store.state.settings.theme || 'olympus');
        this.navigate('home');
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-item').forEach((btn, idx) => {
                const map = ['home', 'workouts', 'analytics', 'nutrition', 'data'];
                btn.onclick = () => this.navigate(map[idx]);
            });
        });
    },
    sym(key) {
        const t = store.state.settings.theme || 'olympus';
        return (THEME_MAP[t] && THEME_MAP[t].symbols[key]) ? THEME_MAP[t].symbols[key] : THEME_MAP.basic.symbols[key];
    },
    applyTheme(themeName) {
        document.documentElement.setAttribute('data-theme', themeName);
        const t = THEME_MAP[themeName] || THEME_MAP.olympus;
        const navBar = document.getElementById('nav-bar');
        if (navBar) {
            const labels = ['Home', 'Workouts', 'Analytics', 'Nutrition', 'Data'];
            const viewsList = ['home', 'workouts', 'analytics', 'nutrition', 'data'];
            navBar.innerHTML = viewsList.map((v, i) => `
                <div class="nav-item ${this.currentView === v ? 'active' : ''}" onclick="app.navigate('${v}')">
                    <i class="fas ${t.nav[i]}"></i>
                    <span>${labels[i]}</span>
                </div>
            `).join('');
        }
    },
    setTheme(themeName) {
        store.state.settings.theme = themeName;
        store.save();
        this.applyTheme(themeName);
        this.navigate(this.currentView);
    },
    navigate(view) {
        this.currentView = view;
        const content = document.getElementById('main-content');
        this.applyTheme(store.state.settings.theme || 'olympus');
        if (view === 'home') content.innerHTML = views.renderHome();
        else if (view === 'workouts') content.innerHTML = views.renderWorkouts();
        else if (view === 'analytics') {
            content.innerHTML = views.renderAnalytics();
            setTimeout(() => { this.setDefaultHypertrophyWeek(); this.renderCharts(); }, 50);
        }
        else if (view === 'nutrition') content.innerHTML = views.renderNutrition();
        else if (view === 'data') content.innerHTML = views.renderData();
        window.scrollTo(0, 0);
    },
    toggleAccordion(id) { const el = document.getElementById(id); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; },
    deleteLog(type, dateStr) { if(confirm("Delete this log entry?")) { store.deleteEntry(type, dateStr); this.navigate('data'); } },
    deleteWorkoutById(id) { if(confirm("Delete this workout session?")) { store.state.history.workouts = store.state.history.workouts.filter(w => w.id !== id); store.save(); this.navigate('data'); } },

    editHistoricalWorkout(id) {
        const w = store.state.history.workouts.find(x => x.id === id); if (!w) return;
        if (w.isSkipped || w.isActivity) {
            const newName = prompt("Edit Session Name:", w.name);
            if (newName) { w.name = newName; store.save(); this.navigate('data'); }
            return;
        }
        const modal = document.getElementById('start-workout-modal');
        let html = `<div class="page-header"><button class="btn btn-sm" onclick="document.getElementById('start-workout-modal').style.display='none'">Cancel</button><h2 style="margin:0;">Edit Past Workout</h2><button class="btn btn-sm btn-primary" onclick="app.saveHistoricalWorkout('${w.id}')">Save</button></div><div style="overflow-y:auto; flex:1; padding-bottom:40px;">`;
        (w.exercises || []).forEach((ex, exIdx) => {
            html += `<div class="card"><h3>${ex.name} ${ex.variation && ex.variation !== 'Standard' ? `<span class="text-muted" style="font-size:12px;">(${ex.variation})</span>` : ''}</h3>`;
            (ex.sets || []).forEach((s, sIdx) => {
                html += `<div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                    <span class="text-muted" style="width:40px; font-size:12px;">Set ${sIdx+1}</span>
                    <input type="number" step="0.5" class="edit-input hist-w-${exIdx}-${sIdx}" value="${s.weight}" style="margin:0;" placeholder="kg">
                    <span class="text-muted" style="font-size:12px;">kg</span>
                    <input type="number" class="edit-input hist-r-${exIdx}-${sIdx}" value="${s.reps}" style="margin:0;" placeholder="reps">
                    <span class="text-muted" style="font-size:12px;">reps</span>
                </div>`;
            });
            html += `</div>`;
        });
        html += `</div>`; modal.innerHTML = html; modal.style.display = 'flex';
    },
    saveHistoricalWorkout(id) {
        const w = store.state.history.workouts.find(x => x.id === id); if (!w) return;
        (w.exercises || []).forEach((ex, exIdx) => {
            (ex.sets || []).forEach((s, sIdx) => {
                const wInput = document.querySelector(`.hist-w-${exIdx}-${sIdx}`); const rInput = document.querySelector(`.hist-r-${exIdx}-${sIdx}`);
                if (wInput) s.weight = parseFloat(wInput.value) || 0;
                if (rInput) s.reps = parseFloat(rInput.value) || 0;
            });
        });
        store.save(); document.getElementById('start-workout-modal').style.display = 'none'; this.navigate('data');
    },
    togglePastEntryInputs() {
        const type = document.getElementById('past-type').value;
        document.getElementById('past-inputs-bw').style.display = type === 'bw' ? 'block' : 'none';
        document.getElementById('past-inputs-nut').style.display = type === 'nut' ? 'grid' : 'none';
    },
    savePastEntry() {
        const dateVal = document.getElementById('past-date').value; const type = document.getElementById('past-type').value;
        if (!dateVal) return alert("Please select a date.");
        const isoDate = new Date(dateVal + 'T12:00:00').toISOString();
        if (type === 'bw') {
            const w = parseFloat(document.getElementById('past-bw-val').value);
            if (!w) return alert("Enter a valid weight.");
            store.addBodyweight(w, isoDate); alert(`Bodyweight (${w}kg) saved for ${dateVal}!`);
        } else if (type === 'nut') {
            const cal = parseFloat(document.getElementById('past-cal').value) || 0; const pro = parseFloat(document.getElementById('past-pro').value) || 0;
            const car = parseFloat(document.getElementById('past-car').value) || 0; const fat = parseFloat(document.getElementById('past-fat').value) || 0;
            if (!cal) return alert("Enter calories.");
            const existing = store.state.history.nutrition.find(n => n && n.date && utils.getLocalISODate(n.date) === dateVal);
            if (existing) { existing.cal = cal; existing.pro = pro; existing.car = car; existing.fat = fat; }
            else { store.state.history.nutrition.push({ date: isoDate, cal, pro, car, fat, water: 0, loggedMeals: [] }); }
            store.save(); alert(`Nutrition saved for ${dateVal}!`);
        }
        this.navigate('data');
    },
    exportData() {
        const dataStr = JSON.stringify(store.state, null, 2); const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        const dateStr = utils.getLocalISODate(new Date()); a.href = url; a.download = `OlympusGym_Backup_${dateStr}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    },
    importData(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const importedState = JSON.parse(e.target.result);
                if (importedState && importedState.history && importedState.user) {
                    store.state = store.migrate(importedState); store.save();
                    alert("Backup successfully restored!"); app.init();
                } else { alert("Invalid backup file format."); }
            } catch (err) { alert("Error reading backup file."); }
        };
        reader.readAsText(file);
    },
    openChallengeSetup() { document.getElementById('main-content').innerHTML = views.renderChallengeSetup(); window.scrollTo(0,0); },
    openChallengeDashboard() { document.getElementById('main-content').innerHTML = views.renderChallengeDashboard(); window.scrollTo(0,0); },
    toggleChallengeGoalInputs() {
        const type = document.getElementById('new-goal-type').value; const container = document.getElementById('goal-dynamic-inputs');
        if (type === 'workout') container.innerHTML = `<label class="text-muted" style="font-size:12px;">Required Workouts Per Day</label><input type="number" id="goal-workout-count" class="edit-input" value="1" min="1" max="5">`;
        else if (type === 'weight' || type === 'cardio') container.innerHTML = ``;
        else if (type === 'nutrition') container.innerHTML = `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;"><div><label class="text-muted" style="font-size:12px;">Rule</label><select id="goal-nut-type" class="edit-input"><option value="max">Stay Under (Cut)</option><option value="min">Hit Minimum (Bulk)</option><option value="log">Just Log Macros</option></select></div><div><label class="text-muted" style="font-size:12px;">Calories (kcal)</label><input type="number" id="goal-nut-cal" class="edit-input" value="2500"></div></div>`;
        else if (type === 'custom') container.innerHTML = `<label class="text-muted" style="font-size:12px;">Habit / Goal Description</label><input type="text" id="goal-custom-text" class="edit-input" placeholder="e.g. Drink 4L Water, Read 10 Pages">`;
    },
    addChallengeGoal() {
        const type = document.getElementById('new-goal-type').value; const c = store.state.tempChallenge;
        const newGoal = { id: utils.generateId(), type: type };
        if (type === 'workout') { const count = parseInt(document.getElementById('goal-workout-count').value) || 1; newGoal.count = count; newGoal.text = `Complete ${count} Workout(s)`; }
        else if (type === 'weight') { newGoal.text = `Log Bodyweight`; }
        else if (type === 'cardio') { newGoal.text = `Complete Daily Walk`; }
        else if (type === 'nutrition') {
            const tType = document.getElementById('goal-nut-type').value; const cal = parseInt(document.getElementById('goal-nut-cal').value) || 2000;
            newGoal.targetType = tType; newGoal.calories = cal;
            if (tType === 'max') newGoal.text = `Stay under ${cal} kcal`; else if (tType === 'min') newGoal.text = `Eat at least ${cal} kcal`; else newGoal.text = `Log Daily Nutrition`;
        } else if (type === 'custom') {
            const txt = document.getElementById('goal-custom-text').value.trim(); if (!txt) return alert("Please enter a description."); newGoal.text = txt;
        }
        c.goals.push(newGoal); document.getElementById('main-content').innerHTML = views.buildChallengeSetupHTML();
    },
    removeChallengeGoal(idx) { store.state.tempChallenge.goals.splice(idx, 1); document.getElementById('main-content').innerHTML = views.buildChallengeSetupHTML(); },
    saveAndStartChallenge() {
        const c = store.state.tempChallenge;
        if (!c.title.trim()) return alert("Please enter a Challenge Title.");

    toggleCustomGoal(dateStr, goalId) {

    endChallenge() { if(confirm("End this challenge?")) { store.state.challenge.isActive = false; store.save(); this.navigate('home'); } },

    switchRoutine(id) { store.state.activeRoutineId = id; store.save(); this.navigate('workouts'); },
    createNewRoutine() {
        const name = prompt("Enter a name for your new Workout Split:"); if (!name || !name.trim()) return;

        store.state.routines.push({ id: newId, name: name.trim(), days: [ { day: 1, workouts: [] }, { day: 2, workouts: [] }, { day: 3, workouts: [] }, { day: 4, workouts: [] }, { day: 5, workouts: [] }, { day: 6, workouts: [] }, { day: 0, workouts: [] } ] });

    renameRoutine() { const r = utils.getActiveRoutine(); const newName = prompt("Rename Workout Split:", r.name); if (newName && newName.trim()) { r.name = newName.trim(); store.save(); this.navigate('workouts'); } },

    openStartWorkoutModal() {
        const modal = document.getElementById('start-workout-modal'); const todayProg = utils.getTodayProgram(); const activeRoutine = utils.getActiveRoutine();
        let html = `<div class="page-header"><h2 style="margin:0;">Select Session</h2><button class="btn btn-sm" onclick="document.getElementById('start-workout-modal').style.display='none'">Close</button></div><div style="overflow-y:auto; flex:1; padding-bottom:40px;">`;

        modal.innerHTML = html; modal.style.display = 'flex';

    startSelectedWorkout(w) {

    startCustomActivity() {

    },

    logSavedMeal(id) {

        if (!nut.loggedMeals) nut.loggedMeals = [];

    setDefaultHypertrophyWeek() {
        const input = document.getElementById('hypertrophy-week'); if (!input) return;
        const now = new Date(); const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
        const dayNum = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1)); const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        input.value = `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    },

    renderCharts() {
        Chart.defaults.color = utils.getCssVar('--text-secondary', '#8e8e93');
        Chart.defaults.borderColor = utils.getCssVar('--border', '#2c2c2e');
        const range = store.state.settings.chartRange || '90';
        const cutoff = range === 'all' ? 0 : Date.now() - (parseInt(range) * 86400000);
        const cAccent = utils.getCssVar('--accent-color', '#d4af37');
        const cSuccess = utils.getCssVar('--success', '#4cd964');
        const cWarning = utils.getCssVar('--warning', '#e69900');
        const cInfo = utils.getCssVar('--info', '#5ac8fa');
        const cPrimary = utils.getCssVar('--text-primary', '#ffffff');

        // 1. Hypertrophy Chart
        const ctxHyp = document.getElementById('hypertrophyChart');
        if (ctxHyp) {
            if (this.charts.hyp) this.charts.hyp.destroy();
            const weekVal = document.getElementById('hypertrophy-week').value;
            let weekStart = utils.getMonday(new Date());
            if (weekVal) {
                const [y, w] = weekVal.split('-W'); const simple = new Date(y, 0, 1 + (w - 1) * 7); const dow = simple.getDay();
                weekStart = simple; if (dow <= 4) weekStart.setDate(simple.getDate() - simple.getDay() + 1); else weekStart.setDate(simple.getDate() + 8 - simple.getDay());
                weekStart.setHours(0,0,0,0); weekStart = weekStart.getTime();
            }
            const weekEnd = weekStart + (7 * 86400000); const setsByMuscle = {}; HYPERTROPHY_GROUPS.forEach(m => setsByMuscle[m] = 0);
            store.state.history.workouts.forEach(w => {
                if (w.isSkipped || w.isActivity) return; const ts = new Date(w.date).getTime();
                if (ts >= weekStart && ts < weekEnd) {
                    (w.exercises || []).forEach(ex => {
                        const completedSets = (ex.sets || []).filter(s => s.completed).length;
                        utils.getMuscles(ex).forEach(m => { if (setsByMuscle[m] !== undefined) setsByMuscle[m] += completedSets; });
                    });
                }
            });
            const dataVals = HYPERTROPHY_GROUPS.map(m => setsByMuscle[m]);
            const bgColors = dataVals.map(v => v >= 10 && v <= 20 ? cSuccess : (v > 20 ? cAccent : cWarning));
            this.charts.hyp = new Chart(ctxHyp, {
                type: 'bar', data: { labels: HYPERTROPHY_GROUPS, datasets: [{ label: 'Completed Sets', data: dataVals, backgroundColor: bgColors, borderRadius: 6 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, suggestedMax: 22 } } }
            });
        }

        // 2. Bodyweight + Toggleable Calorie Overlay Chart
        const ctxBw = document.getElementById('bwChart');
        if (ctxBw) {
            if (this.charts.bw) this.charts.bw.destroy();
            const showCalorieOverlay = store.state.settings.showCalorieOverlay !== false;
            const rawBw = store.state.history.bodyweight.filter(b => b && b.date && new Date(b.date).getTime() >= cutoff).sort((a,b) => new Date(a.date) - new Date(b.date)).map(b => ({ x: new Date(b.date).getTime(), y: b.weight }));
            const smaBw = utils.calculateSMA(rawBw, 7);
            const rawCal = store.state.history.nutrition.filter(n => n && n.date && n.cal > 0 && new Date(n.date).getTime() >= cutoff).sort((a,b) => new Date(a.date) - new Date(b.date)).map(n => ({ x: new Date(n.date).getTime(), y: n.cal }));
            const smaCal = utils.calculateSMA(rawCal, 7);

            const summaryEl = document.getElementById('bw-analytics-summary');
            if (rawBw.length >= 2) {
                const first = rawBw[0].y; const last = rawBw[rawBw.length - 1].y; const diff = (last - first).toFixed(1);
                const goal = store.state.settings.weightGoal; let color = 'var(--text-primary)';
                if (goal === 'bulking') color = diff > 0 ? 'var(--success)' : 'var(--accent-color)';
                else if (goal === 'cutting') color = diff < 0 ? 'var(--success)' : 'var(--accent-color)';
                else color = Math.abs(diff) <= 1.5 ? 'var(--success)' : 'var(--warning)';
                summaryEl.innerHTML = `Period Change: <span style="color:${color};">${diff > 0 ? '+' : ''}${diff} kg</span> (${first}kg → ${last}kg)`;
            } else { summaryEl.innerHTML = `<span class="text-muted">Log at least 2 weigh-ins in this period to see trend.</span>`; }

            const datasets = [
                { label: '7-Period Trend (Weight)', data: smaBw, borderColor: cWarning, backgroundColor: 'transparent', borderWidth: 3, tension: 0.4, pointRadius: 0, yAxisID: 'y' },
                { label: 'Daily Weight (kg)', data: rawBw, borderColor: 'rgba(255,255,255,0.25)', backgroundColor: cWarning, borderWidth: 1, borderDash: [4, 4], pointRadius: 3, tension: 0.1, yAxisID: 'y' }
            ];

            if (showCalorieOverlay) {
                datasets.push({ label: '7-Period Trend (kcal)', data: smaCal, borderColor: cInfo, backgroundColor: 'rgba(90, 200, 250, 0.08)', fill: true, borderWidth: 2, tension: 0.4, pointRadius: 0, yAxisID: 'y1' });
            }

            const scalesConfig = {
                x: { type: 'time', time: { unit: 'day', displayFormats: { day: 'MMM d' } } },
                y: { type: 'linear', display: true, position: 'left', beginAtZero: false, title: { display: true, text: 'Weight (kg)', color: cWarning, font: { size: 10 } } }
            };
            if (showCalorieOverlay) {
                scalesConfig.y1 = { type: 'linear', display: true, position: 'right', beginAtZero: false, grid: { drawOnChartArea: false }, title: { display: true, text: 'Calories (kcal)', color: cInfo, font: { size: 10 } } };
            }

            this.charts.bw = new Chart(ctxBw, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: true, labels: { boxWidth: 10, font: { size: 10 }, color: cPrimary } } },
                    scales: scalesConfig
                }
            });
        }

        // 3. Volume Load Chart
        const ctxVol = document.getElementById('volChart');
        if (ctxVol) {
            if (this.charts.vol) this.charts.vol.destroy();
            const filter = document.getElementById('vol-filter') ? document.getElementById('vol-filter').value : (store.state.settings.lastVolFilter || 'm_Chest');
            let rawVol = [];
            if (filter.startsWith('m_')) {
                const muscle = filter.replace('m_', ''); const volData = utils.getWorkoutVolumeHistory();
                rawVol = (volData.muscles[muscle] || []).filter(d => d.x >= cutoff);
            } else if (filter.startsWith('e_')) {
                const exName = filter.replace('e_', '');
                store.state.history.workouts.forEach(w => {
                    if (w.isSkipped || w.isActivity) return; const ts = new Date(w.date).getTime(); if (ts < cutoff) return;
                    let sessionVol = 0; (w.exercises || []).forEach(ex => { if (ex.name === exName) sessionVol += utils.calcVolume(ex.sets); });
                    if (sessionVol > 0) rawVol.push({ x: ts, y: sessionVol });
                });
            }
            rawVol.sort((a,b) => a.x - b.x);
            const smaVol = utils.calculateSMA(rawVol, 4);
            const volSumEl = document.getElementById('vol-analytics-summary');
            if (rawVol.length >= 2) {
                const first = rawVol[0].y; const last = rawVol[rawVol.length - 1].y;
                const diff = last - first; const pct = ((diff / first) * 100).toFixed(1);
                const color = diff >= 0 ? 'var(--success)' : 'var(--accent-color)';
                volSumEl.innerHTML = `Volume Progression: <span style="color:${color};">${diff >= 0 ? '+' : ''}${diff} kg (${diff >= 0 ? '+' : ''}${pct}%)</span>`;
            } else { volSumEl.innerHTML = `<span class="text-muted">Log at least 2 sessions for this selection to see progression.</span>`; }

            this.charts.vol = new Chart(ctxVol, {
                type: 'line',
                data: {
                    datasets: [
                        { label: '4-Session Trend', data: smaVol, borderColor: cInfo, backgroundColor: 'rgba(0, 122, 255, 0.1)', fill: true, borderWidth: 3, tension: 0.4, pointRadius: 0 },
                        { label: 'Session Volume', data: rawVol, borderColor: 'rgba(255,255,255,0.2)', backgroundColor: cInfo, borderWidth: 1, borderDash: [4, 4], pointRadius: 3, tension: 0.1 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, labels: { boxWidth: 12, font: { size: 10 }, color: cPrimary } } }, scales: { x: { type: 'time', time: { unit: 'day', displayFormats: { day: 'MMM d' } } } } }
            });
        }
    }
};

app.init();
</script>
</body>
</html>
