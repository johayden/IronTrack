<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <title>IronTrack OS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* BASIC THEME (DEFAULT) */
        :root, [data-theme="basic"] {
            --bg-color: #0b0b0d; --surface-color: #1a1a1f; --surface-elevated: #26262d;
            --accent-color: #ff3b30; --accent-dim: rgba(255, 59, 48, 0.15);
            --text-primary: #ffffff; --text-secondary: #8e8e93;
            --success: #34c759; --success-dim: rgba(52, 199, 89, 0.15); --success-glow: 0 0 15px rgba(52, 199, 89, 0.2);
            --pending: #ff453a; --pending-dim: rgba(255, 69, 58, 0.05);
            --warning: #ff9500; --warning-dim: rgba(255, 149, 0, 0.15);
            --info: #007aff; --info-dim: rgba(0, 122, 255, 0.15); --info-glow: 0 0 15px rgba(0, 122, 255, 0.3);
            --border: #333336;
            --streak-bg1: #2a1111; --streak-bg2: #1a0a0a;
            --pr-bg1: #1a0a0a; --pr-bg2: #2a1111;
            --bw-bg1: #1a1205; --bw-bg2: #2a1b0a;
            --vol-bg1: #05101a; --vol-bg2: #0a182a;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 20px); --safe-top: env(safe-area-inset-top, 24px);
            --app-backdrop: radial-gradient(circle at 50% 0%, #1a1a1f 0%, #0b0b0d 80%);
            --card-radius: 16px; --card-border: 1px solid var(--border);
        }
        /* OLYMPUS (GREEK GOD) THEME */
        [data-theme="olympus"] {
            --bg-color: #16120b; --surface-color: rgba(36, 28, 18, 0.85); --surface-elevated: rgba(48, 38, 24, 0.95);
            --accent-color: #ffd700; --accent-dim: rgba(255, 215, 0, 0.15);
            --text-primary: #fff8eb; --text-secondary: #cba876;
            --success: #4caf50; --success-dim: rgba(76, 175, 80, 0.15); --success-glow: 0 0 15px rgba(76, 175, 80, 0.25);
            --pending: #ef5350; --pending-dim: rgba(239, 83, 80, 0.08);
            --warning: #ffa726; --warning-dim: rgba(255, 167, 38, 0.15);
            --info: #29b6f6; --info-dim: rgba(41, 182, 246, 0.15); --info-glow: 0 0 15px rgba(41, 182, 246, 0.3);
            --border: #4a3b22;
            --streak-bg1: #33250c; --streak-bg2: #1f1606;
            --pr-bg1: #1f1606; --pr-bg2: #33250c;
            --bw-bg1: #2b1d0c; --bw-bg2: #1a1106;
            --vol-bg1: #0c202b; --vol-bg2: #06121a;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --app-backdrop: radial-gradient(circle at 50% 0%, #2e2415 0%, #16120b 75%);
            --card-radius: 16px; --card-border: 1px solid #594627;
        }
        /* CYBERPUNK THEME */
        [data-theme="cyberpunk"] {
            --bg-color: #05050a; --surface-color: rgba(15, 16, 28, 0.9); --surface-elevated: rgba(25, 27, 45, 0.95);
            --accent-color: #00f0ff; --accent-dim: rgba(0, 240, 255, 0.15);
            --text-primary: #e0faff; --text-secondary: #687c99;
            --success: #00ff66; --success-dim: rgba(0, 255, 102, 0.15); --success-glow: 0 0 15px rgba(0, 255, 102, 0.3);
            --pending: #ff0055; --pending-dim: rgba(255, 0, 85, 0.1);
            --warning: #ffea00; --warning-dim: rgba(255, 234, 0, 0.15);
            --info: #b026ff; --info-dim: rgba(176, 38, 255, 0.15); --info-glow: 0 0 15px rgba(176, 38, 255, 0.3);
            --border: #1b2845;
            --streak-bg1: #002633; --streak-bg2: #00131a;
            --pr-bg1: #2b001a; --pr-bg2: #1a000f;
            --bw-bg1: #262300; --bw-bg2: #141200;
            --vol-bg1: #1a0033; --vol-bg2: #0d001a;
            --font-family: "Courier New", Courier, monospace;
            --app-backdrop: linear-gradient(180deg, #0a0b16 0%, #05050a 100%);
            --card-radius: 8px; --card-border: 1px solid #00f0ff44;
        }
        /* TACTICAL THEME */
        [data-theme="tactical"] {
            --bg-color: #0f120e; --surface-color: #191f17; --surface-elevated: #232b20;
            --accent-color: #ff6b00; --accent-dim: rgba(255, 107, 0, 0.15);
            --text-primary: #e2e8dd; --text-secondary: #7b8a74;
            --success: #4ade80; --success-dim: rgba(74, 222, 128, 0.15); --success-glow: 0 0 15px rgba(74, 222, 128, 0.2);
            --pending: #ef4444; --pending-dim: rgba(239, 68, 68, 0.08);
            --warning: #eab308; --warning-dim: rgba(234, 179, 8, 0.15);
            --info: #38bdf8; --info-dim: rgba(56, 189, 248, 0.15); --info-glow: 0 0 15px rgba(56, 189, 248, 0.2);
            --border: #2f3b2b;
            --streak-bg1: #29180a; --streak-bg2: #1a0f05;
            --pr-bg1: #1f261c; --pr-bg2: #141912;
            --bw-bg1: #262110; --bw-bg2: #171408;
            --vol-bg1: #102129; --vol-bg2: #091317;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --app-backdrop: radial-gradient(circle at 50% 0%, #191f17 0%, #0f120e 80%);
            --card-radius: 12px; --card-border: 1px solid #384733;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        input, textarea, select { user-select: auto; }
        body {
            background: var(--bg-color); background-image: var(--app-backdrop); background-attachment: fixed;
            color: var(--text-primary); font-family: var(--font-family);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        #main-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(95px + var(--safe-bottom)); }
        h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.3px; }
        .text-muted { color: var(--text-secondary); }
        .text-accent { color: var(--accent-color); }
        .text-info { color: var(--info); }
        .text-warning { color: var(--warning); }
        .text-success { color: var(--success); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }

        .card {
            background: var(--surface-color); border: var(--card-border); border-radius: var(--card-radius);
            padding: 16px; margin-bottom: 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: calc(12px + var(--safe-top)); margin-bottom: 16px;
        }
        .btn {
            background: var(--surface-elevated); color: var(--text-primary); border: 1px solid var(--border);
            padding: 12px 16px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            transition: transform 0.12s ease, opacity 0.12s ease;
        }
        .btn:active { transform: scale(0.97); opacity: 0.9; }
        .btn-primary { background: var(--accent-color); color: var(--bg-color); border: none; }
        .btn-success { background: var(--success); color: var(--bg-color); border: none; }
        .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; width: auto; }
        .btn-icon { width: 38px; height: 38px; padding: 0; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-primary); cursor: pointer; }

        .edit-input {
            width: 100%; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border);
            padding: 10px 12px; border-radius: 10px; font-size: 14px !important; margin-bottom: 8px; outline: none;
        }
        .edit-input:focus { border-color: var(--accent-color); }
        .inline-edit {
            background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border);
            border-radius: 8px; padding: 6px 8px; font-size: 14px !important; font-weight: 800; text-align: center; width: 100%;
        }

        .progress-bg { width: 100%; height: 8px; background: var(--surface-elevated); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
        .progress-fill { height: 100%; border-radius: 99px; transition: width 0.35s ease; }

        .objective-row {
            display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px;
            background: var(--surface-elevated); border: 1px solid var(--border); cursor: pointer;
        }
        .objective-row.completed { border-color: var(--success); background: var(--success-dim); }
        .check-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--text-secondary);
            display: flex; align-items: center; justify-content: center; color: transparent; flex-shrink: 0;
        }
        .objective-row.completed .check-circle { background: var(--success); border-color: var(--success); color: var(--bg-color); }

        #nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(68px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom); background: rgba(18, 18, 22, 0.94);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-secondary); font-size: 11px; font-weight: 700; gap: 4px; flex: 1; height: 100%; cursor: pointer;
        }
        .nav-item i { font-size: 19px; }
        .nav-item.active { color: var(--accent-color); }

        .streak-flame {
            padding: 6px 12px; border-radius: 99px; font-weight: 900; font-size: 14px;
            background: var(--surface-elevated); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 4px;
        }
        .streak-tier-2 { border-color: var(--warning); color: var(--warning); }
        .streak-tier-3 { border-color: var(--accent-color); color: var(--accent-color); box-shadow: 0 0 10px var(--accent-dim); }
        .streak-tier-4 { background: var(--accent-color); color: var(--bg-color); border-color: var(--accent-color); }

        .level-badge {
            padding: 6px 10px; border-radius: 99px; font-weight: 900; font-size: 12px;
            background: var(--surface-elevated); border: 1px solid var(--accent-color); color: var(--accent-color);
            display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
        }

        /* R6 Ranked Stage Styles */
        .r6-stage-card {
            background: radial-gradient(circle at 50% 25%, rgba(255,255,255,0.08) 0%, var(--surface-color) 75%);
            border: 1.5px solid var(--border); border-radius: 18px; padding: 20px 16px; margin-bottom: 20px;
        }
        .r6-rank-trio { display: grid; grid-template-columns: 1fr 1.35fr 1fr; align-items: end; gap: 8px; margin-bottom: 16px; }
        .r6-line-wrap { position: relative; height: 6px; background: rgba(255,255,255,0.12); border-radius: 99px; margin: 16px 8px; }
        .r6-line-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
        .r6-line-spark {
            position: absolute; top: 50%; transform: translate(-50%, -50%);
            width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff;
        }
        .r6-req-pill {
            display: inline-block; padding: 6px 18px; border-radius: 99px; background: var(--accent-color);
            color: var(--bg-color); font-weight: 900; font-size: 14px; letter-spacing: 0.6px;
        }
        .rp-contrib-card { border-radius: 16px; padding: 14px; margin-bottom: 12px; }

        /* Challenge Calendar */
        .chal-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
        .chal-cal-day-hdr { text-align: center; font-size: 10px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; padding-bottom: 4px; }
        .chal-cal-cell {
            aspect-ratio: 1/1.08; border-radius: 10px; background: var(--surface-elevated); border: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 2px;
        }
        .chal-cal-cell.cal-pass { border-color: var(--success); background: var(--success-dim); }
        .chal-cal-cell.cal-partial { border-color: var(--warning); background: var(--warning-dim); }
        .chal-cal-cell.cal-fail { border-color: var(--pending); background: var(--pending-dim); }
        .chal-cal-cell.cal-selected { outline: 2px solid var(--accent-color); transform: scale(1.03); }

        /* Nutrition & Carousels */
        .nut-meal-carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .nut-meal-carousel::-webkit-scrollbar { display: none; }
        .nut-meal-tile {
            min-width: 145px; background: var(--surface-color); border: 1px solid var(--border);
            border-radius: 14px; overflow: hidden; cursor: pointer; flex-shrink: 0;
        }
        .nut-meal-tile-img { width: 100%; height: 84px; object-fit: cover; display: block; }
        .nut-meal-tile-body { padding: 8px 10px; text-align: center; }
        .nut-ring-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .nut-ring-card {
            background: var(--surface-color); border: 1px solid var(--border); border-radius: 16px;
            padding: 12px; display: flex; flex-direction: column; align-items: center;
        }
        .nut-grid { display: grid; gap: 8px; }
        .nut-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; font-weight: 800; margin-bottom: 2px; }
        .nut-insight-bullet {
            display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
            margin-bottom: 8px; font-size: 12.5px; line-height: 1.4;
        }
        .nut-insight-good { background: var(--success-dim); border: 1px solid var(--success); color: var(--text-primary); }
        .nut-insight-mid { background: var(--warning-dim); border: 1px solid var(--warning); color: var(--text-primary); }
        .nut-insight-bad { background: var(--pending-dim); border: 1px solid var(--pending); color: var(--text-primary); }

        /* Workout Editor & Active Modals */
        .editor-exercise-row {
            display: flex; align-items: center; gap: 10px; background: var(--surface-elevated);
            padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border);
        }
        .editor-controls { display: flex; flex-direction: column; gap: 4px; }
        .ex-title-wrap { font-weight: 800; color: var(--text-primary); word-break: break-word; line-height: 1.25; }
        .nowrap-pill { white-space: nowrap; display: inline-block; }
        .data-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
        .data-row:last-child { border-bottom: none; }

        .modal-overlay {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 250;
            display: none; flex-direction: column; overflow-y: auto;
            padding: 16px; padding-top: calc(12px + var(--safe-top)); padding-bottom: calc(32px + var(--safe-bottom));
        }
        .set-row {
            display: grid; grid-template-columns: 36px 1fr 1fr 44px 34px; gap: 8px;
            align-items: center; padding: 8px; border-radius: 10px; background: var(--surface-elevated);
            margin-bottom: 8px; border: 1px solid var(--border);
        }
        .set-row.completed-set { border-color: var(--success); background: var(--success-dim); }
    </style>
</head>

        try {
            const raw = localStorage.getItem('irontrack_os_v3');
            if (raw) {
                this.state = this.migrate(JSON.parse(raw));
            } else {
                this.state = this.getDefaultState();
                this.save();
            }
        } catch (e) {
            this.state = this.getDefaultState();
        }
    },
    migrate(s) {
        const def = this.getDefaultState();
        if (!s.user) s.user = def.user;
        if (!s.settings) s.settings = def.settings;
        if (!s.settings.nutritionTargets) s.settings.nutritionTargets = def.settings.nutritionTargets;
        if (!s.prs) s.prs = def.prs;
        if (!s.trackedPRs || !Array.isArray(s.trackedPRs)) s.trackedPRs = ['Bench Press', 'Squat', 'Deadlift'];
        if (!s.customMuscleGroups) s.customMuscleGroups = [];
        if (!s.customExercises) s.customExercises = [];
        if (!s.savedMeals) s.savedMeals = def.savedMeals;
        if (!s.routines || !s.routines.length) s.routines = def.routines;
        if (!s.activeRoutineId) s.activeRoutineId = s.routines[0].id;
        if (!s.challenge) s.challenge = def.challenge;
        if (!s.history) s.history = def.history;
        if (!s.history.workouts) s.history.workouts = [];
        if (!s.history.bodyweight) s.history.bodyweight = [];
        if (!s.history.nutrition) s.history.nutrition = [];
        if (!s.history.cardio) s.history.cardio = [];
        if (!s.history.challengeLogs) s.history.challengeLogs = {};
        if (!s.history.manualPRs) s.history.manualPRs = [];
        return s;
    },
    save() {
        try { localStorage.setItem('irontrack_os_v3', JSON.stringify(this.state)); } catch (e) {}
    },
    addWorkout(w) {
        this.state.history.workouts.push(w);
        this.save();
    },
    addBodyweight(weight, customIsoDate = null) {
        const w = parseFloat(weight);
        if (isNaN(w) || w <= 0) return;
        const iso = customIsoDate || new Date().toISOString();
        this.state.history.bodyweight.push({ date: iso, weight: w });
        if (!customIsoDate) this.state.user.currentWeight = w;
        this.save();
    },
    updateBodyweight(isoDate, newWeight) {
        const w = parseFloat(newWeight);
        if (isNaN(w) || w <= 0) return;
        const entry = this.state.history.bodyweight.find(e => e.date === isoDate);
        if (entry) entry.weight = w;
        const latest = [...this.state.history.bodyweight].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
        if (latest) this.state.user.currentWeight = latest.weight;
        this.save();
    },
    updateNutrition(isoDate, field, val) {
        const entry = this.state.history.nutrition.find(e => e.date === isoDate);
        if (entry) {
            entry[field] = parseFloat(val) || 0;
            this.save();
        }
    },
    deleteEntry(type, isoDate) {
        if (!this.state.history[type]) return;
        this.state.history[type] = this.state.history[type].filter(e => e.date !== isoDate);
        this.save();
    },
    syncExerciseGlobally(oldName, updatedObj) {
        const cleanName = (updatedObj.name || oldName).trim().slice(0, MAX_EX_TITLE_LEN);
        const muscles = Array.isArray(updatedObj.muscles) && updatedObj.muscles.length ? updatedObj.muscles : ['Other'];
        const targetSets = parseInt(updatedObj.targetSets) || 3;
        const targetReps = updatedObj.targetReps || '8-12';

        EXERCISE_DB[cleanName] = { muscles, targetSets, targetReps };
        if (oldName !== cleanName && EXERCISE_DB[oldName]) {
            delete EXERCISE_DB[oldName];
        }

        let idx = this.state.customExercises.findIndex(e => e.name === oldName || e.name === cleanName);
        if (idx !== -1) {
            this.state.customExercises[idx] = { name: cleanName, muscles, targetSets, targetReps };
        } else {
            this.state.customExercises.push({ name: cleanName, muscles, targetSets, targetReps });
        }

        this.state.routines.forEach(r => {
            (r.days || []).forEach(d => {
                (d.workouts || []).forEach(w => {
                    (w.exercises || []).forEach(ex => {
                        if (ex.name === oldName || ex.name === cleanName) {
                            ex.name = cleanName;
                            ex.muscles = [...muscles];
                            ex.targetSets = targetSets;
                            ex.targetReps = targetReps;
                        }
                    });
                });
            });
        });

        if (this.state.activeSession && this.state.activeSession.exercises) {
            this.state.activeSession.exercises.forEach(ex => {
                if (ex.name === oldName || ex.name === cleanName) {
                    ex.name = cleanName;
                    ex.muscles = [...muscles];
                }
            });
        }

        (this.state.history.workouts || []).forEach(w => {
            (w.exercises || []).forEach(ex => {
                if (ex.name === oldName) {
                    ex.name = cleanName;
                    ex.muscles = [...muscles];
                }
            });
        });

        if (this.state.trackedPRs) {
            this.state.trackedPRs = this.state.trackedPRs.map(n => n === oldName ? cleanName : n);
        }

        this.save();
    }
};

const utils = {
    generateId() { return 'id_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36); },
    getLocalISODate(dInput) {
        const d = dInput instanceof Date ? dInput : new Date(dInput);
        if (isNaN(d.getTime())) return '';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    },
    formatDate(dInput) {
        const d = new Date(dInput);
        if (isNaN(d.getTime())) return String(dInput);
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    },
    formatDateShort(dInput) {
        const d = new Date(dInput);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    },
    getDayName(dayIndex) {
        return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dayIndex] || '';
    },
    getCssVar(name, fallback) {
        const val = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return val || fallback;
    },
    getActiveRoutine() {
        return store.state.routines.find(r => r.id === store.state.activeRoutineId) || store.state.routines[0];
    },
    getTodayProgram() {
        const routine = this.getActiveRoutine();
        const todayIdx = new Date().getDay();
        return routine.days.find(d => d.day === todayIdx) || { day: todayIdx, workouts: [] };
    },
    getAllMuscleGroups() {
        return [...new Set([...MUSCLE_GROUPS, ...(store.state.customMuscleGroups || [])])];
    },
    getHypertrophyGroups() {
        return ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Quads', 'Hamstrings'];
    },
    getMasterExercise(name) {
        const custom = (store.state.customExercises || []).find(e => e.name === name);
        if (custom) return { name: custom.name, muscles: custom.muscles || ['Other'], targetSets: custom.targetSets || 3, targetReps: custom.targetReps || '8-12' };
        if (EXERCISE_DB[name]) return { name, muscles: EXERCISE_DB[name].muscles, targetSets: EXERCISE_DB[name].targetSets, targetReps: EXERCISE_DB[name].targetReps };

    getMuscles(ex) {
        if (ex && Array.isArray(ex.muscles) && ex.muscles.length > 0) return ex.muscles;
        const m = this.getMasterExercise(ex?.name || '');

    getPrimaryMuscle(ex) {
        return this.getMuscles(ex)[0] || 'Other';

    getGroupedExercises() {
        let map = {};
        let allNames = new Set([...Object.keys(EXERCISE_DB), ...(store.state.customExercises || []).map(e => e.name)]);
        store.state.routines.forEach(r => (r.days || []).forEach(d => (d.workouts || []).forEach(w => (w.exercises || []).forEach(ex => allNames.add(ex.name)))));
        allNames.forEach(name => {
            const master = this.getMasterExercise(name);
            const pMuscle = this.getPrimaryMuscle(master);

            map[pMuscle].push(master);

    getExerciseImage(exName = '', primaryMuscle = 'Other') {

        let iconPath = `<rect x="18" y="44" width="64" height="12" rx="4" fill="#fff"/><rect x="10" y="30" width="12" height="40" rx="3" fill="${accent}"/><rect x="78" y="30" width="12" height="40" rx="3" fill="${accent}"/>`;

    calculateStreak() {
        let streak = 0;
        let d = new Date();
        for (let i = 0; i < 365; i++) {
            const dStr = this.getLocalISODate(d);
            const hasW = store.state.history.workouts.some(w => this.getLocalISODate(w.date) === dStr);
            const hasBw = store.state.history.bodyweight.some(b => this.getLocalISODate(b.date) === dStr);
            const hasNut = store.state.history.nutrition.some(n => this.getLocalISODate(n.date) === dStr && n.cal > 0);
            if (hasW || hasBw || hasNut) {
                streak++;
            } else if (i > 0) {
                break;
            }
            d.setDate(d.getDate() - 1);
        }
        return streak;
    },
    getMondayOfCurrentWeek() {
        const now = new Date();
        const day = now.getDay();
        const diff = (day === 0 ? -6 : 1) - day;
        const mon = new Date(now);
        mon.setDate(now.getDate() + diff);
        mon.setHours(0, 0, 0, 0);
        return mon;
    },
    getWeeklyHypertrophyStatus() {
        const mon = this.getMondayOfCurrentWeek();
        const hGroups = this.getHypertrophyGroups();
        let weekSets = {};
        hGroups.forEach(g => weekSets[g] = 0);
        store.state.history.workouts.forEach(w => {
            if (w.isSkipped || w.isActivity) return;
            if (new Date(w.date) >= mon) {
                (w.exercises || []).forEach(ex => {
                    const validSets = (ex.sets || []).filter(s => (parseFloat(s.weight) > 0 || parseInt(s.reps) > 0)).length;
                    if (validSets > 0) {
                        const ms = this.getMuscles(ex);
                        ms.forEach((m, idx) => {
                            if (weekSets[m] !== undefined) {
                                weekSets[m] += (idx === 0 ? validSets : Math.ceil(validSets * 0.5));
                            }
                        });
                    }
                });
            }
        });
        let completedCount = 0;
        hGroups.forEach(g => { if (weekSets[g] >= 10) completedCount++; });
        return {
            weekSets,
            completed: completedCount,
            total: hGroups.length,
            allMet: completedCount === hGroups.length
        };
    },
    getWeeklyRPBreakdown() {
        const mon = this.getMondayOfCurrentWeek();
        const hyper = this.getWeeklyHypertrophyStatus();
        const hGroups = this.getHypertrophyGroups();

        const workoutsThisWeek = store.state.history.workouts.filter(w => !w.isSkipped && new Date(w.date) >= mon).length;
        const wPct = Math.min(100, Math.round((workoutsThisWeek / 4) * 100));
        const wRP = Math.min(600, workoutsThisWeek * 150);

        const totalHyperSets = hGroups.reduce((s, g) => s + Math.min(10, hyper.weekSets[g] || 0), 0);
        const maxHyperSets = hGroups.length * 10;
        const hPct = Math.min(100, Math.round((totalHyperSets / maxHyperSets) * 100));
        const hRP = Math.round((totalHyperSets / maxHyperSets) * 600);

        const nutDays = store.state.history.nutrition.filter(n => n.cal > 0 && new Date(n.date) >= mon).length;
        const nPct = Math.min(100, Math.round((nutDays / 7) * 100));
        const nRP = Math.round((Math.min(7, nutDays) / 7) * 500);

        const bwDays = store.state.history.bodyweight.filter(b => new Date(b.date) >= mon).length;
        const cardioDays = store.state.history.cardio.filter(c => new Date(c.date) >= mon).length;
        const habitCount = Math.min(7, bwDays + cardioDays);
        const cPct = Math.min(100, Math.round((habitCount / 7) * 100));
        const cRP = Math.round((habitCount / 7) * 500);

        const tierForPct = (p) => {
            const idx = Math.min(7, Math.floor((p / 100) * 7));
            return { name: RANK_NAMES[idx], color: RANK_COLORS[idx] };
        };

        return [
            {
                title: 'Training Sessions',
                subtitle: 'Target: 4 Workouts / Week',
                icon: 'fa-dumbbell',
                current: workoutsThisWeek,
                total: 4,
                unit: 'Sessions',
                pct: wPct,
                rpEarned: wRP,
                rankName: tierForPct(wPct).name,
                color: tierForPct(wPct).color
            },
            {
                title: 'Hypertrophy Volume Gate',
                subtitle: 'Target: 10+ Hard Sets per Muscle Group',
                icon: 'fa-fire-flame-curved',
                current: hyper.completed,
                total: hyper.total,
                unit: 'Muscles Hit',
                pct: hPct,
                rpEarned: hRP,
                rankName: tierForPct(hPct).name,
                color: tierForPct(hPct).color,
                subMetrics: hGroups.map(g => ({ name: g, sets: hyper.weekSets[g] || 0, met: (hyper.weekSets[g] || 0) >= 10 }))
            },
            {
                title: 'Nutrition Adherence',
                subtitle: 'Target: Log Macros 7 Days / Week',
                icon: 'fa-apple-whole',
                current: nutDays,
                total: 7,
                unit: 'Days',
                pct: nPct,
                rpEarned: nRP,
                rankName: tierForPct(nPct).name,
                color: tierForPct(nPct).color
            },
            {
                title: 'Weigh-Ins & Cardio Habits',
                subtitle: 'Target: 7 Combined Weigh-Ins / Walks',
                icon: 'fa-scale-balanced',
                current: habitCount,
                total: 7,
                unit: 'Logs',
                pct: cPct,
                rpEarned: cRP,
                rankName: tierForPct(cPct).name,
                color: tierForPct(cPct).color
            }
        ];
    },
    getWeeklyRankData() {
        const cats = this.getWeeklyRPBreakdown();
        const hyper = this.getWeeklyHypertrophyStatus();
        let totalRP = cats.reduce((s, c) => s + c.rpEarned, 0);
        let championLockedByHypertrophy = false;

        if (totalRP >= 2100 && !hyper.allMet) {
            totalRP = 2095;
            championLockedByHypertrophy = true;
        }

        const rankIdx = Math.min(7, Math.floor(totalRP / 300));
        const isMax = rankIdx === 7;
        const minDivRP = rankIdx * 300;
        const nextDivRP = isMax ? 2400 : (rankIdx + 1) * 300;
        const progress = isMax ? 100 : Math.min(100, Math.round(((totalRP - minDivRP) / 300) * 100));
        const rpNeededForNext = isMax ? 0 : Math.max(0, nextDivRP - totalRP);

        const roman = ['V', 'IV', 'III', 'II', 'I'];
        const divIdx = Math.min(4, Math.floor(((totalRP - minDivRP) / 300) * 5));
        const division = isMax ? '★' : roman[divIdx];

        return {
            rankIdx,
            name: RANK_NAMES[rankIdx],
            division,
            fullName: isMax ? 'Champion ★' : `${RANK_NAMES[rankIdx]} ${division}`,
            color: RANK_COLORS[rankIdx],
            totalRP,
            minDivRP,
            nextDivRP,
            progress,
            rpNeededForNext,
            isMax,
            championLockedByHypertrophy,
            hyperCompleted: hyper.completed,
            hyperTotal: hyper.total,
            hyperAllMet: hyper.allMet,
            prevRank: rankIdx > 0 ? { fullName: RANK_NAMES[rankIdx - 1], color: RANK_COLORS[rankIdx - 1], division: 'I' } : null,
            nextRank: rankIdx < 7 ? { fullName: RANK_NAMES[rankIdx + 1], color: RANK_COLORS[rankIdx + 1], division: rankIdx + 1 === 7 ? '★' : 'V' } : null
        };

        return (store.state.history.workouts.length * 150) + (store.state.history.nutrition.length * 50) + (store.state.history.bodyweight.length * 25);

    renderRankCrestSVG(color, divText, scale = 1, glow = false) {

    getGoalLabel(g) {
        if (g.type === 'workout') return `Complete ${g.count || 1} Workout(s)`;
        if (g.type === 'nutrition') {
            if (g.targetType === 'max') return `Diet: Max ${g.calories} kcal`;
            if (g.targetType === 'min') return `Diet: Min ${g.calories} kcal`;
            return 'Track Daily Nutrition';
        }
        if (g.type === 'weight') return 'Log Morning Bodyweight';
        if (g.type === 'cardio') return g.title || 'Complete Daily Walk';
        if (g.type === 'water') return `Drink Water (${g.target || '4L'})`;
        if (g.type === 'reading') return `Read (${g.target || '10 Pages'})`;
        return g.title || 'Custom Habit';
    },
    checkGoalSuccess(dateStr, g) {
        const manual = store.state.history.challengeLogs?.[dateStr]?.[g.id];
        if (manual) return true;
        if (g.type === 'workout') {
            const count = store.state.history.workouts.filter(w => this.getLocalISODate(w.date) === dateStr).length;
            return count >= (g.count || 1);
        }
        if (g.type === 'weight') {
            return store.state.history.bodyweight.some(b => this.getLocalISODate(b.date) === dateStr);
        }
        if (g.type === 'cardio') {
            return store.state.history.cardio.some(c => this.getLocalISODate(c.date) === dateStr);
        }
        if (g.type === 'nutrition') {
            const n = store.state.history.nutrition.find(x => this.getLocalISODate(x.date) === dateStr);
            if (!n || n.cal <= 0) return false;
            if (g.targetType === 'max') return n.cal <= g.calories;
            if (g.targetType === 'min') return n.cal >= g.calories;
            return true;
        }
        if (g.type === 'water') {
            const n = store.state.history.nutrition.find(x => this.getLocalISODate(x.date) === dateStr);
            const totalW = (n?.waterLog || []).reduce((s, w) => s + w.amount, 0);
            if (totalW >= 3000) return true;
        }
        return false;
    },
    getDayGoalStats(dateStr) {
        const c = store.state.challenge;
        if (!c || !c.isActive) return { met: 0, possible: 0, pct: 0, allMet: false, passed75: false };
        const activeGoals = (c.goals || []).filter(g => !g.createdAt || dateStr >= g.createdAt);
        const possible = activeGoals.length;
        if (possible === 0) return { met: 0, possible: 0, pct: 100, allMet: true, passed75: true };
        let met = 0;
        activeGoals.forEach(g => { if (this.checkGoalSuccess(dateStr, g)) met++; });
        const pct = Math.round((met / possible) * 100);
        return { met, possible, pct, allMet: met === possible, passed75: pct >= 75 };
    },
    getChallengeStats() {
        const c = store.state.challenge;
        if (!c || !c.isActive) return null;
        const start = new Date(c.startDate + 'T00:00:00');
        const end = new Date(c.endDate + 'T00:00:00');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const dayTotal = Math.max(1, Math.round((end - start) / 86400000) + 1);
        const dayCurrent = Math.max(1, Math.min(dayTotal, Math.round((today - start) / 86400000) + 1));

        let totalMet = 0, totalPossible = 0, streak = 0;
        for (let i = 0; i < dayCurrent; i++) {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            const dStr = this.getLocalISODate(d);
            const st = this.getDayGoalStats(dStr);
            totalMet += st.met;
            totalPossible += st.possible;
            if (st.passed75) streak++; else if (dStr !== this.getLocalISODate(today)) streak = 0;
        }
        const successRate = totalPossible > 0 ? Math.round((totalMet / totalPossible) * 100) : 100;
        return { title: c.title, dayCurrent, dayTotal, streak, successRate };
    },
    getLiftWorldStats(exName) {
        const bw = parseFloat(store.state.user.currentWeight) || 85;
        const cutoff28 = Date.now() - (28 * 86400000);
        let sessionPeaks = [];

        store.state.history.workouts.forEach(w => {
            if (w.isSkipped || w.isActivity) return;
            const ts = new Date(w.date).getTime();
            if (ts < cutoff28) return;
            (w.exercises || []).forEach(ex => {
                if (ex.name.toLowerCase() === exName.toLowerCase()) {
                    let bestSessionE1RM = 0, bestW = 0, bestR = 0;
                    (ex.sets || []).forEach(s => {
                        const sw = parseFloat(s.weight) || 0;
                        const sr = parseInt(s.reps) || 0;
                        if (sw > 0 && sr > 0) {
                            const e1 = sr === 1 ? sw : sw * (1 + sr / 30);
                            if (e1 > bestSessionE1RM) { bestSessionE1RM = e1; bestW = sw; bestR = sr; }
                        }
                    });
                    if (bestSessionE1RM > 0) sessionPeaks.push({ ts, e1rm: bestSessionE1RM, weight: bestW, reps: bestR });
                }
            });
        });

        (store.state.history.manualPRs || []).forEach(m => {
            const ts = new Date(m.date).getTime();
            if (ts >= cutoff28 && m.lift.toLowerCase() === exName.toLowerCase()) {
                sessionPeaks.push({ ts, e1rm: m.e1rm, weight: m.weight, reps: m.reps });
            }
        });

        sessionPeaks.sort((a,b) => a.ts - b.ts);
        let best = { e1rm: 0, weight: 0, reps: 0 };
        sessionPeaks.forEach(p => { if (p.e1rm > best.e1rm) best = p; });

        if (best.e1rm === 0) {
            if (exName === 'Bench Press' && store.state.prs?.Bench) {
                best.weight = store.state.prs.Bench.weight; best.reps = store.state.prs.Bench.reps;
                best.e1rm = best.reps === 1 ? best.weight : best.weight * (1 + best.reps / 30);
            } else if (exName === 'Squat' && store.state.prs?.Squat) {
                best.weight = store.state.prs.Squat.weight; best.reps = store.state.prs.Squat.reps;
                best.e1rm = best.reps === 1 ? best.weight : best.weight * (1 + best.reps / 30);
            } else if (exName === 'Deadlift' && store.state.prs?.Deadlift) {
                best.weight = store.state.prs.Deadlift.weight; best.reps = store.state.prs.Deadlift.reps;
                best.e1rm = best.reps === 1 ? best.weight : best.weight * (1 + best.reps / 30);
            }
        }

        const n = exName.toLowerCase();
        let mults = [0.5, 0.75, 1.0, 1.35, 1.7];
        if (n.includes('squat')) mults = [0.75, 1.1, 1.5, 1.9, 2.4];
        else if (n.includes('deadlift') || n.includes('rdl')) mults = [0.9, 1.3, 1.75, 2.2, 2.75];
        else if (n.includes('bench') || n.includes('chest')) mults = [0.55, 0.85, 1.15, 1.45, 1.8];
        else if (n.includes('ohp') || n.includes('overhead')) mults = [0.35, 0.55, 0.75, 0.95, 1.15];
        else if (n.includes('curl') || n.includes('lateral') || n.includes('tricep')) mults = [0.15, 0.25, 0.4, 0.55, 0.75];

        const anchors = mults.map(m => Math.round(bw * m));
        const e1rm = Math.round(best.e1rm);
        const bwRatio = bw > 0 ? (e1rm / bw).toFixed(2) : '0.00';

        let tier = 'Beginner', color = '#8e8e93', topPercent = 85, nextTierName = 'Novice', nextTargetKg = anchors[1];
        if (e1rm >= anchors[4]) { tier = 'Elite'; color = '#9d00ff'; topPercent = 1; nextTierName = 'World Class'; nextTargetKg = Math.round(anchors[4] * 1.1); }
        else if (e1rm >= anchors[3]) { tier = 'Advanced'; color = '#ffd700'; topPercent = 8; nextTierName = 'Elite'; nextTargetKg = anchors[4]; }
        else if (e1rm >= anchors[2]) { tier = 'Intermediate'; color = '#007aff'; topPercent = 25; nextTierName = 'Advanced'; nextTargetKg = anchors[3]; }
        else if (e1rm >= anchors[1]) { tier = 'Novice'; color = '#34c759'; topPercent = 50; nextTierName = 'Intermediate'; nextTargetKg = anchors[2]; }

        const barFill = Math.min(100, Math.max(5, Math.round((e1rm / anchors[4]) * 100)));
        const hasComparison = sessionPeaks.length >= 2;
        const prevE1RM = hasComparison ? Math.round(sessionPeaks[sessionPeaks.length - 2].e1rm) : 0;
        const overloadDiff = hasComparison ? Math.round((sessionPeaks[sessionPeaks.length - 1].e1rm - sessionPeaks[sessionPeaks.length - 2].e1rm) * 10) / 10 : 0;

        return {
            weight: best.weight, reps: best.reps, e1rm, bwRatio,
            tier, color, topPercent, nextTierName, nextTargetKg, anchors, barFill,
            hasComparison, prevE1RM, overloadDiff
        };
    },
    getMuscleHeatColor(muscle) {
        const cutoff = Date.now() - (28 * 86400000);
        let sets = 0;
        store.state.history.workouts.forEach(w => {
            if (w.isSkipped || w.isActivity) return;
            if (new Date(w.date).getTime() >= cutoff) {
                (w.exercises || []).forEach(ex => {
                    const ms = this.getMuscles(ex);
                    if (ms.includes(muscle)) {
                        sets += (ex.sets || []).filter(s => parseFloat(s.weight) > 0 || parseInt(s.reps) > 0).length;
                    }
                });
            }
        });
        const weeklyAvg = sets / 4;
        if (weeklyAvg <= 0) return '#333333';
        if (weeklyAvg < 5) return '#2e86ab';
        if (weeklyAvg < 10) return '#3498db';
        if (weeklyAvg < 15) return '#f1c40f';
        if (weeklyAvg < 20) return '#e67e22';
        return '#e74c3c';
    },

        </svg>`;
    },
    getWorkoutVolumeHistory() {
        let total = [], muscles = {}, exercises = {};
        const sorted = [...store.state.history.workouts].filter(w => !w.isSkipped && !w.isActivity).sort((a,b) => new Date(a.date) - new Date(b.date));
        sorted.forEach(w => {
            const x = new Date(w.date).getTime();
            let sessionTotal = 0;
            let sessionMuscles = {};
            (w.exercises || []).forEach(ex => {
                let exVol = 0;
                (ex.sets || []).forEach(s => {
                    const weight = parseFloat(s.weight) || 0;
                    const reps = parseInt(s.reps) || 0;
                    exVol += weight * reps;
                });
                if (exVol > 0) {
                    sessionTotal += exVol;
                    if (!exercises[ex.name]) exercises[ex.name] = [];
                    exercises[ex.name].push({ x, y: exVol });
                    this.getMuscles(ex).forEach(m => {
                        sessionMuscles[m] = (sessionMuscles[m] || 0) + exVol;
                    });
                }
            });
            if (sessionTotal > 0) total.push({ x, y: sessionTotal });
            Object.keys(sessionMuscles).forEach(m => {
                if (!muscles[m]) muscles[m] = [];
                muscles[m].push({ x, y: sessionMuscles[m] });
            });
        });
        return { total, muscles, exercises };
    },
    calculateSMA(dataArr, windowSize = 3) {
        return dataArr.map((pt, idx) => {
            const start = Math.max(0, idx - windowSize + 1);
            const slice = dataArr.slice(start, idx + 1);
            const avg = slice.reduce((s, x) => s + x.y, 0) / slice.length;
            return { x: pt.x, y: Math.round(avg * 10) / 10 };
        });
    },
    getWeeklyData(entries) {
        let map = {};
        entries.forEach(e => {
            const d = new Date(e.date);
            const day = d.getDay();
            const diff = (day === 0 ? -6 : 1) - day;
            const mon = new Date(d);
            mon.setDate(d.getDate() + diff);
            mon.setHours(0,0,0,0);
            const key = mon.getTime();
            if (!map[key]) map[key] = { entries: [] };
            map[key].entries.push(e);
        });
        return map;
    },
    getOverloadData(muscleFilter = 'All') {
        const cutoff28 = Date.now() - (28 * 86400000);
        const cutoff7 = Date.now() - (7 * 86400000);
        let map = {};
        const sorted = [...store.state.history.workouts].filter(w => !w.isSkipped && !w.isActivity).sort((a,b) => new Date(a.date) - new Date(b.date));
        sorted.forEach(w => {
            const ts = new Date(w.date).getTime();
            if (ts < cutoff28) return;
            (w.exercises || []).forEach(ex => {
                const ms = this.getMuscles(ex);
                if (muscleFilter !== 'All' && !ms.includes(muscleFilter)) return;
                let bestE1 = 0;
                (ex.sets || []).forEach(s => {
                    const sw = parseFloat(s.weight) || 0;
                    const sr = parseInt(s.reps) || 0;
                    if (sw > 0 && sr > 0) {
                        const e1 = sr === 1 ? sw : sw * (1 + sr / 30);
                        if (e1 > bestE1) bestE1 = e1;
                    }
                });
                if (bestE1 > 0) {
                    const key = `${ex.name}||${ex.variation || ''}`;
                    if (!map[key]) map[key] = { name: ex.name, variation: ex.variation || '', muscles: ms, sessions: [] };
                    map[key].sessions.push({ ts, e1rm: bestE1 });
                }
            });
        });

        let list = Object.values(map).map(item => {
            const len = item.sessions.length;
            const currentE1RM = len > 0 ? item.sessions[len - 1].e1rm : 0;
            const prevE1RM = len >= 2 ? item.sessions[len - 2].e1rm : 0;
            const hasComparison = len >= 2;
            const diff = hasComparison ? (currentE1RM - prevE1RM) : 0;
            const recent7d = len > 0 && item.sessions[len - 1].ts >= cutoff7;
            return { ...item, currentE1RM, prevE1RM, hasComparison, diff, recent7d };
        });

        return list.sort((a,b) => (b.recent7d - a.recent7d) || (b.hasComparison - a.hasComparison) || Math.abs(b.diff) - Math.abs(a.diff));
    },
    getE1RMHistory(daysLimit = 90) {
        const cutoff = daysLimit === 0 ? 0 : Date.now() - (daysLimit * 86400000);
        let res = { bench: [], squat: [], deadlift: [] };
        const sorted = [...store.state.history.workouts].filter(w => !w.isSkipped && !w.isActivity).sort((a,b) => new Date(a.date) - new Date(b.date));
        sorted.forEach(w => {
            const ts = new Date(w.date).getTime();
            if (ts < cutoff) return;
            (w.exercises || []).forEach(ex => {
                const n = ex.name.toLowerCase();
                let best = 0;
                (ex.sets || []).forEach(s => {
                    const sw = parseFloat(s.weight) || 0;
                    const sr = parseInt(s.reps) || 0;
                    if (sw > 0 && sr > 0) {
                        const e1 = sr === 1 ? sw : sw * (1 + sr / 30);
                        if (e1 > best) best = e1;
                    }
                });
                if (best > 0) {
                    if (n.includes('bench')) res.bench.push({ ts, e1rm: best });
                    else if (n.includes('squat')) res.squat.push({ ts, e1rm: best });
                    else if (n.includes('deadlift')) res.deadlift.push({ ts, e1rm: best });
                }
            });
        });
        return res;
    },
    getNutritionScore(nutEntry, targets) {
        const cal = nutEntry?.cal || 0;
        const pro = nutEntry?.pro || 0;
        const water = (nutEntry?.waterLog || []).reduce((s, w) => s + w.amount, 0);
        const mealCount = (nutEntry?.loggedMeals || []).length;

        const proRatio = Math.min(1.1, pro / (targets.pro || 160));
        const proScore = Math.min(35, Math.round(proRatio * 35));

        let calScore = 0;
        if (cal > 0) {
            const diffPct = Math.abs(cal - (targets.cal || 2500)) / (targets.cal || 2500);
            calScore = Math.max(0, Math.round((1 - Math.min(1, diffPct * 2)) * 30));
        }

        const waterScore = Math.min(20, Math.round((water / 3500) * 20));
        const wholeFoodScore = Math.min(15, mealCount * 5);

        const totalScore = proScore + calScore + waterScore + wholeFoodScore;
        let grade = 'NEEDS FUEL', color = 'var(--pending)';
        if (totalScore >= 85) { grade = 'OLYMPIC FUEL'; color = 'var(--success)'; }
        else if (totalScore >= 65) { grade = 'SOLID DAY'; color = 'var(--info)'; }
        else if (totalScore >= 40) { grade = 'BUILDING'; color = 'var(--warning)'; }

        return {
            totalScore, grade, color,
            factors: [
                { name: 'Protein Anchor', score: proScore, max: 35, desc: `${Math.round(pro)}g / ${targets.pro}g target` },
                { name: 'Calorie Precision', score: calScore, max: 30, desc: `${Math.round(cal)} / ${targets.cal} kcal target` },
                { name: 'Hydration Status', score: waterScore, max: 20, desc: `${water} / 3500+ ml water` },
                { name: 'Whole-Food Meal Frequency', score: wholeFoodScore, max: 15, desc: `${mealCount} structured meal(s) logged` }
            ]
        };
    },
    getDailyNutritionInsights(nutEntry, targets) {
        let insights = [];
        const cal = nutEntry?.cal || 0;
        const pro = nutEntry?.pro || 0;
        const water = (nutEntry?.waterLog || []).reduce((s, w) => s + w.amount, 0);

        if (pro >= (targets.pro || 160) * 0.9) {
            insights.push({ tone: 'good', text: `Protein target on lock (${Math.round(pro)}g). High amino availability for muscle protein synthesis.` });
        } else {
            insights.push({ tone: 'mid', text: `Protein is ${Math.round((targets.pro || 160) - pro)}g shy of target. Consider Greek yoghurt, cottage cheese, lean chicken breast, or canned tuna.` });
        }

        if (cal === 0) {
            insights.push({ tone: 'bad', text: `No calories logged yet for this date. Tap a meal card above to log a saved whole-food meal.` });
        } else if (Math.abs(cal - targets.cal) <= targets.cal * 0.1) {
            insights.push({ tone: 'good', text: `Calorie intake (${Math.round(cal)} kcal) is within 10% of your daily energy target.` });
        } else {
            insights.push({ tone: 'mid', text: `Calories at ${Math.round(cal)} kcal vs ${targets.cal} kcal target. Adjust starch portions (rice, kumara, oats) to match training load.` });
        }

        if (water >= 3000) {
            insights.push({ tone: 'good', text: `Hydration is strong (${water} ml). Cellular hydration and training output supported.` });
        } else {
            insights.push({ tone: 'mid', text: `Water intake at ${water} ml. Aim for 3,000–4,000 ml across the day, especially around heavy sessions.` });
        }
        return insights;
    },
    getSavedMealUsageCounts() {
        let counts = {};
        (store.state.history.nutrition || []).forEach(n => {
            (n.loggedMeals || []).forEach(m => {
                const key = m.savedMealId || m.name;
                counts[key] = (counts[key] || 0) + 1;
            });
        });
        return counts;
    },
    getLastExerciseLog(exName) {
        const sorted = [...store.state.history.workouts].filter(w => !w.isSkipped && !w.isActivity).sort((a,b) => new Date(b.date) - new Date(a.date));
        for (let w of sorted) {
            const found = (w.exercises || []).find(e => e.name.toLowerCase() === exName.toLowerCase() && e.sets && e.sets.length > 0);
            if (found) return found;
        }
        return null;
    }
};

        for (let i = 0; i < (parseInt(targetSets) || 3); i++) {

            sets.push({ weight: prev ? prev.weight : '', reps: prev ? prev.reps : '', completed: false });

        this.activeWorkout.exercises.push({

        });

    finish() {
        const w = this.activeWorkout;
        if (!w) return;
        const duration = Math.max(1, Math.round((Date.now() - w.startTime) / 60000));
        const cleanedExercises = (w.exercises || []).map(ex => ({
            name: ex.name,
            variation: ex.variation || '',
            muscles: utils.getMuscles(ex),
            sets: (ex.sets || []).filter(s => s.completed || (parseFloat(s.weight) > 0 && parseInt(s.reps) > 0)).map(s => ({
                weight: parseFloat(s.weight) || 0,
                reps: parseInt(s.reps) || 0
            }))
        })).filter(ex => ex.sets.length > 0);

        store.addWorkout({
            id: w.id,
            date: new Date().toISOString(),
            name: w.name,
            isActivity: !!w.isActivity,
            isSkipped: false,
            duration,
            exercises: cleanedExercises
        });

        store.state.activeSession = null;
        this.activeWorkout = null;
        store.save();
        if (this.timerInterval) clearInterval(this.timerInterval);
        document.getElementById('active-workout-view').style.display = 'none';
        app.navigate('home');

        store.state.activeSession = null;
        this.activeWorkout = null;
        store.save();
        if (this.timerInterval) clearInterval(this.timerInterval);
        document.getElementById('active-workout-view').style.display = 'none';
        if (!silent) app.navigate(app.currentView);
    }
};

        let html = `<div class="page-header"><button class="btn btn-sm btn-icon" onclick="app.navigate('workout')"><i class="fas fa-arrow-left"></i></button><h1 style="margin:0; font-size: 20px;">Edit Split</h1>${!isActive ? `<button class="btn btn-sm" style="background:var(--info); color:var(--bg-color);" onclick="app.setActiveRoutine('${app.draftRoutine.id}')">Set Active</button>` : `<span style="color:var(--success); font-size:12px; font-weight:bold; border:1px solid var(--success); padding:4px 8px; border-radius:6px;">ACTIVE</span>`}</div>
            <div class="card"><label class="text-muted" style="font-size:12px;">Split Name</label><div style="display:flex; gap:8px; margin-top:4px;"><input type="text" class="edit-input" style="font-size:18px !important; font-weight:bold; margin:0;" value="${app.draftRoutine.name}" onchange="app.draftRoutine.name = this.value; app.autoSaveRoutine()">${store.state.routines.length > 1 ? `<button class="btn btn-icon" style="background:var(--accent-dim); color:var(--accent-color); height:42px; width:42px; flex-shrink:0;" onclick="app.deleteRoutine('${app.draftRoutine.id}')"><i class="fas fa-trash"></i></button>` : ''}</div></div>`;
        app.draftRoutine.days.forEach((dayObj, dIdx) => {
            html += `<div class="card"><div class="flex-between" style="border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:12px;"><h2 style="margin:0; color:var(--accent-color);">${utils.getDayName(dayObj.day)}</h2><button class="btn btn-sm" style="background:var(--surface-elevated); padding:4px 8px; font-size:12px;" onclick="app.addWorkoutSession(${dIdx})">+ Add Session</button></div>`;
            if (dayObj.workouts.length === 0) { html += `<p class="text-muted" style="font-size:14px; text-align:center; padding: 10px 0;">Rest Day ${app.sym('rest')}</p>`; } else {
                dayObj.workouts.forEach((w, wIdx) => {
                    html += `<div style="background:var(--bg-color); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px;"><div class="flex-between" style="margin-bottom:8px;"><input type="text" class="edit-input" style="font-weight:bold; font-size:16px !important; margin:0; width:70%; background:var(--surface-color);" value="${w.name}" onchange="app.updateWorkoutName(${dIdx}, ${wIdx}, this.value)" placeholder="Workout Name"><button class="btn-icon" style="background:transparent; color:var(--text-secondary); width:30px; height:30px; border:none;" onclick="app.deleteWorkoutSession(${dIdx}, ${wIdx})"><i class="fas fa-trash"></i></button></div><div style="margin-bottom:8px;">`;
                    w.exercises.forEach((ex, exIdx) => {
                        let mList = utils.getMuscles(ex);
                        const exMoveImg = utils.getExerciseImage(ex.name, mList[0]);
                        const safeName = ex.name.replace(/'/g, "\\'");
                        html += `<div class="editor-exercise-row">
                            <img src="${exMoveImg}" alt="${ex.name}" style="width:42px; height:42px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--border);">
                            <div style="flex:1; min-width:0;">
                                <input type="text" class="edit-input" maxlength="${MAX_EX_TITLE_LEN}" value="${ex.name}" onchange="app.updateExerciseInRoutine(${dIdx}, ${wIdx}, ${exIdx}, 'name', this.value)" placeholder="Exercise Name" style="font-weight:bold; margin-bottom:6px; background:var(--surface-color);">
                                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                                    <span class="text-muted" style="font-size:12px;">Sets:</span>
                                    <input type="number" class="edit-input" value="${ex.targetSets}" onchange="app.updateExerciseInRoutine(${dIdx}, ${wIdx}, ${exIdx}, 'targetSets', this.value)" style="width:55px; margin:0; text-align:center; padding: 4px; background:var(--surface-color);" inputmode="numeric">
                                    <span class="text-muted" style="font-size:12px;">Reps:</span>
                                    <input type="text" class="edit-input" value="${ex.targetReps}" onchange="app.updateExerciseInRoutine(${dIdx}, ${wIdx}, ${exIdx}, 'targetReps', this.value)" style="width:70px; margin:0; text-align:center; padding: 4px; background:var(--surface-color);">
                                    <button class="btn btn-sm" style="padding: 4px 8px; font-size: 11px; background: var(--surface-color); border: 1px solid var(--border); width:auto;" onclick="app.openEditExerciseModal('${safeName}')"><i class="fas fa-sliders"></i> ${mList.join(', ')}</button>
                                </div>
                            </div>
                            <div class="editor-controls">
                                <button class="btn-icon" style="background:var(--surface-color);" onclick="app.moveExercise(${dIdx}, ${wIdx}, ${exIdx}, -1)" ${exIdx===0?'disabled style="opacity:0.3"':''}><i class="fas fa-chevron-up"></i></button>
                                <button class="btn-icon" style="background:var(--surface-color);" onclick="app.moveExercise(${dIdx}, ${wIdx}, ${exIdx}, 1)" ${exIdx===w.exercises.length-1?'disabled style="opacity:0.3"':''}><i class="fas fa-chevron-down"></i></button>
                            </div>
                            <button class="btn-icon" style="background:rgba(255,59,48,0.15); color:var(--accent-color); height:80px; width:36px; border:none;" onclick="app.removeExercise(${dIdx}, ${wIdx}, ${exIdx})"><i class="fas fa-trash"></i></button>
                        </div>`;
                    });
                    html += `</div><button class="btn btn-sm" style="background:var(--surface-elevated); width:100%; border:1px dashed var(--border);" onclick="app.showProgramExerciseModal(${dIdx}, ${wIdx})">+ Add Exercise</button></div>`;
                });
            } html += `</div>`;
        });
        html += `<button class="btn btn-success" style="margin-bottom:32px;" onclick="app.saveProgramChanges()"><i class="fas fa-check"></i> Done Editing</button>`; return html;
    },
    renderNutrition() {
        const todayStr = utils.getLocalISODate(new Date());
        if (!app.selectedNutritionDate) app.selectedNutritionDate = todayStr;
        const activeDateStr = app.selectedNutritionDate;
        let nutEntry = store.state.history.nutrition.find(e => utils.getLocalISODate(e.date) === activeDateStr);
        if (!nutEntry) {
            const parts = activeDateStr.split('-');
            const entryDateIso = activeDateStr === todayStr ? new Date().toISOString() : new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0).toISOString();
            nutEntry = { date: entryDateIso, cal: 0, pro: 0, car: 0, fat: 0, loggedMeals: [], waterLog: [] };
            store.state.history.nutrition.push(nutEntry);
            store.save();
        }
        if (!nutEntry.loggedMeals) nutEntry.loggedMeals = [];
        if (nutEntry.waterLog === undefined) nutEntry.waterLog = [];
        let totalWater = nutEntry.waterLog.reduce((sum, entry) => sum + entry.amount, 0);
        const waterPct = Math.min(100, Math.round((totalWater / 4000) * 100));
        const targets = store.state.settings.nutritionTargets || { cal: 2500, pro: 160, car: 250, fat: 70 };
        const calPct = Math.min(100, Math.round(((nutEntry.cal || 0) / (targets.cal || 2500)) * 100));
        const proPct = Math.min(100, Math.round(((nutEntry.pro || 0) / (targets.pro || 160)) * 100));
        const carPct = Math.min(100, Math.round(((nutEntry.car || 0) / (targets.car || 250)) * 100));
        const fatPct = Math.min(100, Math.round(((nutEntry.fat || 0) / (targets.fat || 70)) * 100));
        const mealCategories = [
            { id: 'Breakfast', title: 'Breakfast', img: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=450&q=80' },
            { id: 'Lunch', title: 'Lunch', img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=450&q=80' },
            { id: 'Dinner', title: 'Dinner', img: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=450&q=80' },
            { id: 'Snack', title: 'Snacks', img: 'https://images.unsplash.com/photo-1505576399279-565b52d4ac71?auto=format&fit=crop&w=450&q=80' }
        ];
        let mealTilesHtml = '';
        mealCategories.forEach(mc => {
            const catMeals = nutEntry.loggedMeals.filter(m => m.type === mc.id);
            const catCals = Math.round(catMeals.reduce((s, m) => s + (m.cal || 0), 0));
            const catPro = Math.round(catMeals.reduce((s, m) => s + (m.pro || 0), 0));
            mealTilesHtml += `
            <div class="nut-meal-tile" onclick="app.openMealSearch('${mc.id}')">
                <div style="position:relative;">
                    <img src="${mc.img}" alt="${mc.title}" class="nut-meal-tile-img">
                    ${catMeals.length > 0 ? `<span style="position:absolute; top:8px; right:8px; background:var(--success); color:var(--bg-color); font-size:10px; font-weight:900; padding:2px 7px; border-radius:10px;">${catCals} kcal</span>` : ''}
                </div>
                <div class="nut-meal-tile-body">
                    <div style="font-weight:800; font-size:15px; color:var(--text-primary);">${mc.title}</div>
                    <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">
                        ${catMeals.length > 0 ? `${catMeals.length} item(s) • ${catPro}g P` : '+ Tap to Add'}
                    </div>
                </div>
            </div>`;
        });
        let loggedMealsSummaryHtml = '';
        mealCategories.forEach(mc => {
            const catMeals = nutEntry.loggedMeals.map((m, idx) => ({ ...m, origIdx: idx })).filter(m => m.type === mc.id);
            if (catMeals.length > 0) {
                const subCal = Math.round(catMeals.reduce((s, m) => s + (m.cal || 0), 0));
                const subPro = Math.round(catMeals.reduce((s, m) => s + (m.pro || 0), 0));
                loggedMealsSummaryHtml += `
                <div style="margin-bottom:12px; background:var(--surface-elevated); border-radius:12px; padding:10px 12px; border:1px solid var(--border);">
                    <div class="flex-between" style="border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:6px;">
                        <span style="font-weight:800; font-size:13px; color:var(--accent-color); text-transform:uppercase;">${mc.title}</span>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="text-muted" style="font-size:11px; font-weight:bold;">${subCal} kcal • ${subPro}g P</span>
                            <button class="btn-icon" style="width:24px; height:24px; font-size:11px;" onclick="app.openMealSearch('${mc.id}')"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>`;
                catMeals.forEach(m => {
                    loggedMealsSummaryHtml += `
                    <div class="flex-between" style="padding:5px 0; font-size:13px;">
                        <div style="flex:1; padding-right:8px;">
                            <div style="font-weight:700; color:var(--text-primary);">${m.name}</div>
                            <div class="text-muted" style="font-size:11px;">${Math.round(m.cal)} kcal • P:${Math.round(m.pro)}g C:${Math.round(m.car)}g F:${Math.round(m.fat)}g</div>
                        </div>
                        <button class="btn-icon" style="width:26px; height:26px; background:transparent; border:none; color:var(--pending);" onclick="app.removeLoggedMeal(${m.origIdx})"><i class="fas fa-times"></i></button>
                    </div>`;
                });
                loggedMealsSummaryHtml += `</div>`;
            }
        });
        const renderRingSVG = (pct, color, iconClass, centerLabel, subLabel) => {
            const radius = 44;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (Math.min(100, Math.max(0, pct)) / 100) * circumference;
            return `
            <div style="position:relative; width:112px; height:112px; display:flex; align-items:center; justify-content:center; margin:6px 0;">
                <svg width="112" height="112" viewBox="0 0 112 112" style="transform:rotate(-90deg);">
                    <circle cx="56" cy="56" r="${radius}" fill="none" stroke="var(--surface-elevated)" stroke-width="9"></circle>
                    <circle cx="56" cy="56" r="${radius}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 0.5s ease;"></circle>
                </svg>
                <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
                    <i class="fas ${iconClass}" style="color:${color}; font-size:13px; margin-bottom:2px;"></i>
                    <div style="font-size:16px; font-weight:900; color:var(--text-primary); line-height:1.1;">${centerLabel}</div>
                    <div style="font-size:9.5px; color:var(--text-secondary); font-weight:700;">${subLabel}</div>
                </div>
            </div>`;
        };
        const nutScore = utils.getNutritionScore(nutEntry, targets);
        let scoreFactorsHtml = '';
        nutScore.factors.forEach(f => {
            const fPct = Math.round((f.score / f.max) * 100);
            const fCol = fPct >= 80 ? 'var(--success)' : (fPct >= 50 ? 'var(--warning)' : 'var(--pending)');
            scoreFactorsHtml += `
            <div style="margin-bottom:8px;">
                <div class="flex-between" style="font-size:11.5px; margin-bottom:3px;">
                    <span style="font-weight:700; color:var(--text-primary);">${f.name}</span>
                    <span style="font-weight:900; color:${fCol};">${f.score} / ${f.max} pts</span>
                </div>
                <div class="progress-bg" style="height:5px; margin:0; background:var(--bg-color);">
                    <div class="progress-fill" style="width:${fPct}%; background:${fCol};"></div>
                </div>
                <div class="text-muted" style="font-size:10px; margin-top:2px;">${f.desc}</div>
            </div>`;
        });
        const insights = utils.getDailyNutritionInsights(nutEntry, targets);
        let insightsHtml = '';
        insights.forEach(item => {
            const cls = item.tone === 'good' ? 'nut-insight-good' : (item.tone === 'mid' ? 'nut-insight-mid' : 'nut-insight-bad');
            const ic = item.tone === 'good' ? 'fa-circle-check' : (item.tone === 'mid' ? 'fa-triangle-exclamation' : 'fa-circle-xmark');
            insightsHtml += `<div class="nut-insight-bullet ${cls}"><i class="fas ${ic}" style="margin-top:3px; flex-shrink:0;"></i><div>${item.text}</div></div>`;
        });
        const pastNutDays = store.state.history.nutrition
            .filter(n => utils.getLocalISODate(n.date) !== activeDateStr && (n.cal > 0 || (n.loggedMeals && n.loggedMeals.length > 0)))
            .sort((a,b) => new Date(b.date) - new Date(a.date))
            .slice(0, 14);
        const activeParts = activeDateStr.split('-');
        const activeDatePretty = activeDateStr === todayStr
            ? 'Today'
            : new Date(activeParts[0], activeParts[1]-1, activeParts[2]).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
        return `
            <div class="page-header" style="margin-bottom: 12px;">
                <h1 style="margin:0; font-size: 24px;">Nutrition</h1>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="btn btn-sm" style="background:var(--surface-elevated); border:1px solid var(--accent-color); color:var(--accent-color); font-size:12px; padding:6px 10px;" onclick="app.openMealCreatorModal(null)">
                        <i class="fas fa-utensils"></i> + Create Meal
                    </button>
                </div>
            </div>
            <div class="card" style="padding:12px 14px; margin-bottom:16px; background:var(--surface-elevated);">
                <div class="flex-between" style="flex-wrap:wrap; gap:8px;">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button class="btn btn-sm btn-icon" onclick="app.shiftNutritionDate(-1)"><i class="fas fa-chevron-left"></i></button>
                        <input type="date" class="edit-input" style="margin:0; width:auto; padding:5px 8px; font-size:13px !important; font-weight:bold;" value="${activeDateStr}" onchange="app.setNutritionDate(this.value)">
                        <button class="btn btn-sm btn-icon" onclick="app.shiftNutritionDate(1)"><i class="fas fa-chevron-right"></i></button>
                        ${activeDateStr !== todayStr ? `<button class="btn btn-sm" style="padding:5px 8px; font-size:11px; background:var(--accent-color); color:var(--bg-color); border:none;" onclick="app.setNutritionDate('${todayStr}')">Today</button>` : ''}
                    </div>
                    ${pastNutDays.length > 0 ? `
                    <div style="display:flex; align-items:center; gap:6px;">
                        <select id="copy-day-select" class="edit-input" style="margin:0; width:auto; max-width:155px; padding:5px 8px; font-size:11.5px !important;">
                            <option value="">Copy Past Day...</option>
                            ${pastNutDays.map(p => {
                                const dIso = utils.getLocalISODate(p.date);
                                return `<option value="${dIso}">${utils.formatDate(p.date)} (${Math.round(p.cal)} kcal)</option>`;
                            }).join('')}
                        </select>
                        <button class="btn btn-sm" style="padding:6px 10px; font-size:11.5px; background:var(--info); color:var(--bg-color); border:none;" onclick="app.copyNutritionFromDate()">Copy</button>
                    </div>` : ''}
                </div>
            </div>
            <div class="flex-between" style="margin-bottom:6px;">
                <h2 style="margin:0; font-size:18px;">Add to ${activeDatePretty}'s Meals</h2>
                <span class="text-muted" style="font-size:11px;">Tap a meal to log Saved Meals</span>
            </div>
            <div class="nut-meal-carousel">${mealTilesHtml}</div>
            ${loggedMealsSummaryHtml ? `
            <div class="card" style="padding:14px; margin-bottom:16px;">
                <div class="flex-between" style="margin-bottom:10px;">
                    <h3 style="margin:0; font-size:14px; color:var(--text-primary); text-transform:uppercase; letter-spacing:0.5px;"><i class="fas fa-clipboard-list text-accent"></i> Logged Items (${activeDatePretty})</h3>
                    <span class="text-muted" style="font-size:11px;">${nutEntry.loggedMeals.length} item(s)</span>
                </div>
                ${loggedMealsSummaryHtml}
            </div>` : ''}
            <div class="flex-between" style="margin-bottom:8px;">
                <h2 style="margin:0; font-size:18px;">Today's Macros</h2>
                <button class="btn btn-sm" style="padding:4px 10px; font-size:11px; background:var(--surface-elevated);" onclick="app.toggleTargetEditor()"><i class="fas fa-sliders"></i> Edit Targets</button>
            </div>
            <div id="target-editor" class="card" style="display:none; background:var(--surface-elevated); margin-bottom:14px; border:1px dashed var(--accent-color);">
                <div class="text-muted" style="font-size:11px; margin-bottom:8px; text-transform:uppercase; font-weight:bold;">Set Daily Macro Goals</div>
                <div class="nut-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
                    <div><div class="nut-label">Calories</div><input type="number" id="t-cal" class="inline-edit" value="${targets.cal}"></div>
                    <div><div class="nut-label">Protein (g)</div><input type="number" id="t-pro" class="inline-edit" value="${targets.pro}"></div>
                    <div><div class="nut-label">Carbs (g)</div><input type="number" id="t-car" class="inline-edit" value="${targets.car}"></div>
                    <div><div class="nut-label">Fat (g)</div><input type="number" id="t-fat" class="inline-edit" value="${targets.fat}"></div>
                </div>
                <button class="btn btn-sm btn-primary" style="width:100%; margin-top:10px;" onclick="app.saveTargets()">Save Targets</button>
            </div>
            <div class="nut-ring-grid">
                <div class="nut-ring-card">
                    <div class="flex-between" style="width:100%;">
                        <span style="font-weight:800; font-size:14px;">Calories</span>
                        <span style="font-size:11px; color:var(--text-secondary); font-weight:700;">${calPct}%</span>
                    </div>
                    ${renderRingSVG(calPct, '#ff3b30', 'fa-fire-flame-curved', Math.round(nutEntry.cal || 0), `/ ${targets.cal} kcal`)}
                    <div style="width:100%; display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px;">
                        <span>Override:</span>
                        <input type="number" class="inline-edit" style="width:68px; font-size:12px !important; padding:2px 4px;" value="${Math.round(nutEntry.cal || 0)}" onchange="app.setManualMacro('cal', this.value)" inputmode="numeric">
                    </div>
                </div>
                <div class="nut-ring-card">
                    <div class="flex-between" style="width:100%;">
                        <span style="font-weight:800; font-size:14px;">Protein</span>
                        <span style="font-size:11px; color:var(--text-secondary); font-weight:700;">${proPct}%</span>
                    </div>
                    ${renderRingSVG(proPct, '#34c759', 'fa-drumstick-bite', Math.round(nutEntry.pro || 0) + 'g', `/ ${targets.pro}g`)}
                    <div style="width:100%; display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px;">
                        <span>Override:</span>
                        <input type="number" class="inline-edit" style="width:68px; font-size:12px !important; padding:2px 4px;" value="${Math.round(nutEntry.pro || 0)}" onchange="app.setManualMacro('pro', this.value)" inputmode="numeric">
                    </div>
                </div>
                <div class="nut-ring-card">
                    <div class="flex-between" style="width:100%;">
                        <span style="font-weight:800; font-size:14px;">Carbs</span>
                        <span style="font-size:11px; color:var(--text-secondary); font-weight:700;">${carPct}%</span>
                    </div>
                    ${renderRingSVG(carPct, '#007aff', 'fa-bowl-rice', Math.round(nutEntry.car || 0) + 'g', `/ ${targets.car}g`)}
                    <div style="width:100%; display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px;">
                        <span>Override:</span>
                        <input type="number" class="inline-edit" style="width:68px; font-size:12px !important; padding:2px 4px;" value="${Math.round(nutEntry.car || 0)}" onchange="app.setManualMacro('car', this.value)" inputmode="numeric">
                    </div>
                </div>
                <div class="nut-ring-card">
                    <div class="flex-between" style="width:100%;">
                        <span style="font-weight:800; font-size:14px;">Fat</span>
                        <span style="font-size:11px; color:var(--text-secondary); font-weight:700;">${fatPct}%</span>
                    </div>
                    ${renderRingSVG(fatPct, '#ff9500', 'fa-cheese', Math.round(nutEntry.fat || 0) + 'g', `/ ${targets.fat}g`)}
                    <div style="width:100%; display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px;">
                        <span>Override:</span>
                        <input type="number" class="inline-edit" style="width:68px; font-size:12px !important; padding:2px 4px;" value="${Math.round(nutEntry.fat || 0)}" onchange="app.setManualMacro('fat', this.value)" inputmode="numeric">
                    </div>
                </div>

            <div class="card" style="border: 1.5px solid ${nutScore.color}; background: linear-gradient(145deg, var(--surface-elevated), var(--surface-color));">
                <div class="flex-between" style="margin-bottom:12px;">
                    <div>
                        <div style="font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:1px; color:${nutScore.color};"><i class="fas fa-award"></i> Athlete Nutrition Score</div>
                        <h2 style="margin:2px 0 0 0; font-size:20px;">Daily Fuel Rating</h2>
                    </div>

        const oldName = this.editingExOriginalName;
