            dB.workouts = tmp;
            this.renderRoutineEditorModal();
        }
    },
    addDraftWorkoutToDay(dayIdx) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (!d) return;
        d.workouts.push({ id: 'w_' + utils.generateId(), name: 'New Session', exercises: [] });
        this.renderRoutineEditorModal();
    },
    updateDraftWorkoutName(dayIdx, wIdx, val) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx]) d.workouts[wIdx].name = val;
    },
    removeDraftWorkout(dayIdx, wIdx) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d) { d.workouts.splice(wIdx, 1); this.renderRoutineEditorModal(); }
    },
    updateDraftExercise(dayIdx, wIdx, exIdx, field, val) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx] && d.workouts[wIdx].exercises[exIdx]) {
            d.workouts[wIdx].exercises[exIdx][field] = field === 'targetSets' ? (parseInt(val) || 3) : val;
        }
    },
    removeDraftExercise(dayIdx, wIdx, exIdx) {
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx]) {
            d.workouts[wIdx].exercises.splice(exIdx, 1);
            this.renderRoutineEditorModal();
        }
    },
    promptAddDraftExercise(dayIdx, wIdx) {
        const exName = prompt("Enter Exercise Name (e.g. Bench Press, Squat, Lat Pulldown):");
        if (!exName || !exName.trim()) return;
        const master = utils.getMasterExercise(exName.trim());
        const d = this.draftRoutine.days.find(x => x.day === dayIdx);
        if (d && d.workouts[wIdx]) {
            d.workouts[wIdx].exercises.push({
                name: master.name,
                muscles: utils.getMuscles(master),
                targetSets: master.targetSets || 3,
                targetReps: master.targetReps || '8-12'
            });
            this.renderRoutineEditorModal();
        }
    },
    saveRoutineEditor() {
        const idx = store.state.routines.findIndex(x => x.id === this.draftRoutine.id);
        if (idx > -1) store.state.routines[idx] = this.draftRoutine;
        else store.state.routines.push(this.draftRoutine);
        store.save();
        document.getElementById('routine-editor-modal').style.display = 'none';
        this.navigate(this.currentPage, true);
    },
    deleteRoutine(rId) {
        if (store.state.routines.length <= 1) return;
        if (confirm("Delete this training split?")) {
            store.state.routines = store.state.routines.filter(x => x.id !== rId);
            if (store.state.activeRoutineId === rId) store.state.activeRoutineId = store.state.routines[0].id;
            store.save();
            document.getElementById('routine-editor-modal').style.display = 'none';
            this.navigate(this.currentPage, true);
        }
    },
    /* ANALYTICS CONTROLS & CHARTS */
    setChartRange(val) {
        store.state.settings.chartRange = val;
        store.save();
        this.navigate('analytics', true);
    },
    setVolFilter(val) {
        store.state.settings.lastVolFilter = val;
        store.state.settings.overloadExerciseFilter = 'ALL_MUSCLE';
        store.save();
        this.navigate('analytics', true);
    },
    setOverloadExerciseFilter(val) {
        store.state.settings.overloadExerciseFilter = val;
        store.save();
        this.navigate('analytics', true);
    },
    cycleWeightGoal() {
        const goals = ['cutting', 'bulking', 'maintaining'];
        const cur = store.state.settings.weightGoal || 'cutting';
        const next = goals[(goals.indexOf(cur) + 1) % goals.length];
        store.state.settings.weightGoal = next;
        store.save();
        this.navigate('analytics', true);
    },
    toggleCaloriesOnBwChart() {
        store.state.settings.showCaloriesOnBwChart = !store.state.settings.showCaloriesOnBwChart;
        store.save();
        this.navigate('analytics', true);
    },
    promptTrackExercisePR() {
        const grouped = utils.getGroupedExercises();
        const allNames = [];
        Object.values(grouped).forEach(list => list.forEach(e => { if (!allNames.includes(e.name)) allNames.push(e.name); }));
        const input = prompt(`Enter Exercise Name to track in PR Zone (e.g. ${allNames.slice(0, 6).join(', ')}):`);
        if (!input || !input.trim()) return;
        const clean = input.trim();
        if (!store.state.trackedPRs) store.state.trackedPRs = ['Bench Press', 'Squat', 'Deadlift'];
        if (!store.state.trackedPRs.some(x => x.toLowerCase() === clean.toLowerCase())) {
            store.state.trackedPRs.push(clean);
            store.save();
            this.navigate('analytics', true);
        }
    },
    removeTrackedPR(liftName) {
        if (!store.state.trackedPRs) return;
        store.state.trackedPRs = store.state.trackedPRs.filter(x => x !== liftName);
        store.save();
        this.navigate('analytics', true);
    },
    saveManualPROverride(liftName, idx) {
        const wEl = document.getElementById(`pr-w-${idx}`);
        const rEl = document.getElementById(`pr-r-${idx}`);
        const w = wEl ? parseFloat(wEl.value) : 0;
        const r = rEl ? parseInt(rEl.value) : 1;
        if (isNaN(w) || w <= 0 || isNaN(r) || r <= 0) return;
        store.addManualPR(liftName, w, r);
        this.navigate('analytics', true);
    },
    initCharts() {
        Object.values(this.chartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });
        this.chartInstances = {};
        const range = store.state.settings.chartRange || '90';
        const daysLimit = range === 'ALL' ? 0 : parseInt(range);
        const cutoff = daysLimit ? (Date.now() - daysLimit * 86400000) : 0;
        const volCtx = document.getElementById('volChart');
        if (volCtx && window.Chart) {
            const volHist = utils.getWorkoutVolumeHistory();
            const filter = store.state.settings.lastVolFilter || 'total';
            const exFilter = store.state.settings.overloadExerciseFilter || 'ALL_MUSCLE';
            let rawSeries = [];
            let labelName = 'Total Volume';
            if (filter === 'total') {
                rawSeries = volHist.total || [];
            } else if (exFilter && exFilter !== 'ALL_MUSCLE') {
                rawSeries = (volHist.byExercise && volHist.byExercise[exFilter]) || [];
                labelName = exFilter;
            } else {
                rawSeries = (volHist.byMuscle && volHist.byMuscle[filter]) || [];
                labelName = `${filter} Volume`;
            }
            const filtered = rawSeries.filter(p => !cutoff || p.x >= cutoff);
            const sma = utils.calculateSMA(filtered, 3);
            this.chartInstances.vol = new Chart(volCtx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: labelName,
                            data: filtered,
                            borderColor: 'rgba(2, 136, 209, 0.35)',
                            backgroundColor: 'rgba(2, 136, 209, 0.12)',
                            borderWidth: 1.5,
                            pointRadius: 3,
                            fill: true,
                            tension: 0.25
                        },
                        {
                            label: '3-Session Trend',
                            data: sma,
                            borderColor: '#0288d1',
                            borderWidth: 3,
                            pointRadius: 0,
                            fill: false,
                            tension: 0.35
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#a89f91', boxWidth: 18 } } },
                    scales: {
                        x: { type: 'time', time: { unit: 'day' }, ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }
        const bwCtx = document.getElementById('bwChart');
        if (bwCtx && window.Chart) {
            const bwRaw = store.state.history.bodyweight
                .map(b => ({ x: new Date(b.date).setHours(0,0,0,0), y: b.weight }))
                .filter(p => !cutoff || p.x >= cutoff)
                .sort((a, b) => a.x - b.x);
            const bwSma = utils.calculateSMA(bwRaw, 7);
            const targetW = parseFloat(store.state.user.targetWeight) || 85;
            const targetLine = bwRaw.length >= 2
                ? [{ x: bwRaw[0].x, y: targetW }, { x: bwRaw[bwRaw.length - 1].x, y: targetW }]
                : [{ x: Date.now() - 7*86400000, y: targetW }, { x: Date.now(), y: targetW }];
            const datasets = [
                {
                    label: 'Daily Weight',
                    data: bwRaw,
                    borderColor: 'rgba(245, 124, 0, 0.35)',
                    backgroundColor: 'rgba(245, 124, 0, 0.35)',
                    borderWidth: 1.5,
                    pointRadius: 3.5,
                    yAxisID: 'y'
                },
                {
                    label: '7-Day Moving Avg',
                    data: bwSma,
                    borderColor: '#ff9500',
                    borderWidth: 3,
                    pointRadius: 0,
                    tension: 0.35,
                    yAxisID: 'y'
                },
                {
                    label: 'Goal Weight',
                    data: targetLine,
                    borderColor: '#34c759',
                    borderDash: [6, 6],
                    borderWidth: 2,
                    pointRadius: 0,
                    yAxisID: 'y'
                }
            ];
            if (store.state.settings.showCaloriesOnBwChart) {
                const calData = store.state.history.nutrition
                    .filter(n => n.cal > 0)
                    .map(n => ({ x: new Date(n.date).setHours(0,0,0,0), y: n.cal }))
                    .filter(p => !cutoff || p.x >= cutoff)
                    .sort((a, b) => a.x - b.x);
                datasets.push({
                    label: 'Calories (kcal)',
                    data: calData,
                    borderColor: 'rgba(50, 215, 75, 0.5)',
                    backgroundColor: 'rgba(50, 215, 75, 0.1)',
                    borderWidth: 1.5,
                    pointRadius: 2,
                    yAxisID: 'y1'
                });
            }
            const scales = {
                x: { type: 'time', time: { unit: 'day' }, ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                y: { position: 'left', ticks: { color: '#ff9500' }, grid: { color: 'rgba(255,255,255,0.05)' } }
            };
            if (store.state.settings.showCaloriesOnBwChart) {
                scales.y1 = { position: 'right', ticks: { color: '#34c759' }, grid: { drawOnChartArea: false } };
            }
            this.chartInstances.bw = new Chart(bwCtx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#a89f91', boxWidth: 16 } } },
                    scales
                }
            });
        }
        const hyperCtx = document.getElementById('hyperChart');
        if (hyperCtx && window.Chart) {
            const hyper = utils.getWeeklyHypertrophyStatus();
            const labels = HYPERTROPHY_GROUPS;
            const dataVals = labels.map(m => hyper.setsByGroup[m] || 0);
            const colors = dataVals.map(v => v >= 10 ? '#34c759' : (v >= 5 ? '#ff9500' : '#ff3b30'));
            this.chartInstances.hyper = new Chart(hyperCtx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Weekly Hard Sets',
                        data: dataVals,
                        backgroundColor: colors,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#a89f91' }, grid: { display: false } },
                        y: { beginAtZero: true, suggestedMax: 20, ticks: { color: '#a89f91' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }
    },

    /* ============================================================================
       COMPLETE NUTRITION, MEAL LOGGING, RAW INGREDIENT & MEAL BUILDER SYSTEM
       ============================================================================ */
    getOrCreateNutritionDay(dateStr) {
        const dStr = dateStr || this.selectedNutritionDate || utils.getLocalISODate(new Date());
        let entry = store.state.history.nutrition.find(n => utils.getLocalISODate(n.date) === dStr);
        if (!entry) {
            entry = {
                date: dStr + 'T12:00:00.000Z',
                cal: 0,
                pro: 0,
                car: 0,
                fat: 0,
                loggedMeals: [],
                waterLog: []
            };
            store.state.history.nutrition.push(entry);
        }
        if (!Array.isArray(entry.loggedMeals)) entry.loggedMeals = [];
        if (!Array.isArray(entry.waterLog)) entry.waterLog = [];
        return entry;
    },
    recalcNutritionDayTotals(nutEntry) {
        if (!nutEntry) return;
        const meals = nutEntry.loggedMeals || [];
        let cal = 0, pro = 0, car = 0, fat = 0;
        meals.forEach(m => {
            cal += parseFloat(m.cal) || 0;
            pro += parseFloat(m.pro) || 0;
            car += parseFloat(m.car) || 0;
            fat += parseFloat(m.fat) || 0;
        });
        nutEntry.cal = Math.round(cal);
        nutEntry.pro = Math.round(pro * 10) / 10;
        nutEntry.car = Math.round(car * 10) / 10;
        nutEntry.fat = Math.round(fat * 10) / 10;
        store.save();
        this.checkRankPromotion();
    },
    changeNutritionDate(newDateStr) {
        if (!newDateStr) return;
        this.selectedNutritionDate = newDateStr;
        this.navigate('nutrition', true);
    },

    saveQuickMacroFromModal(dateStr, mealWindowType) {

        const car = parseFloat(carEl ? carEl.value : 0) || 0;

            id: utils.generateId(),
            type: mType,

            cal: Math.round(cal),

    copyPastNutritionDay(targetDateStr) {
        const dStr = targetDateStr || this.selectedNutritionDate || utils.getLocalISODate(new Date());
        const pastDays = store.state.history.nutrition
            .filter(n => utils.getLocalISODate(n.date) !== dStr && (n.cal > 0 || (n.loggedMeals && n.loggedMeals.length > 0)))
            .sort((a, b) => new Date(b.date) - new Date(a.date));
        if (pastDays.length === 0) {
            alert("No previous nutrition days found to copy from yet.");
            return;
        }
        const latest = pastDays[0];
        const latestIso = utils.getLocalISODate(latest.date);
        if (!confirm(`Copy ${latest.loggedMeals ? latest.loggedMeals.length : 0} meals (${Math.round(latest.cal)} kcal, ${Math.round(latest.pro)}g P) from ${latestIso} into ${dStr}?`)) return;
        const targetEntry = this.getOrCreateNutritionDay(dStr);
        if (latest.loggedMeals && latest.loggedMeals.length > 0) {
            latest.loggedMeals.forEach(m => {
                targetEntry.loggedMeals.push(JSON.parse(JSON.stringify(m)));
            });
            this.recalcNutritionDayTotals(targetEntry);
        } else {
            targetEntry.cal = latest.cal;
            targetEntry.pro = latest.pro;
            targetEntry.car = latest.car;
            targetEntry.fat = latest.fat;
            store.save();
        }
        this.navigate('nutrition', true);
    },

    promptAddIngredientToBuilder(foodId) {

        const draft = this.draftMealBuilder;

            alert("Add at least 1 ingredient to save a meal.");
            return;

        const name = (draft.name && draft.name.trim()) ? draft.name.trim() : `Custom ${mealWindowType} Bowl`;

        draft.ingredients.forEach(i => {
            cal += i.cal || 0;
            pro += i.pro || 0;
            car += i.car || 0;
            fat += i.fat || 0;
        });
        const newMeal = {
            id: 'sm_' + utils.generateId(),
            name,
            cal: Math.round(cal),
            pro: Math.round(pro * 10) / 10,
            car: Math.round(car * 10) / 10,
            fat: Math.round(fat * 10) / 10,
            ingredients: JSON.parse(JSON.stringify(draft.ingredients))
        };
        if (!store.state.savedMeals) store.state.savedMeals = [];
        store.state.savedMeals.unshift(newMeal);

    handleProgressPhotoUpload(event) {

            const dataUrl = e.target.result;
            if (!store.state.history.progressPhotos) store.state.history.progressPhotos = [];
            store.state.history.progressPhotos.unshift({
                id: utils.generateId(),
                date: new Date().toISOString(),
                dataUrl
            });
            if (workoutEngine.activeWorkout) {
                if (!workoutEngine.activeWorkout.sessionPhotos) workoutEngine.activeWorkout.sessionPhotos = [];
                workoutEngine.activeWorkout.sessionPhotos.push(dataUrl);
                workoutEngine.saveSessionState();
                workoutEngine.renderActiveWorkout(true);
            }
            store.save();
            this.navigate(this.currentPage, true);
        };
        reader.readAsDataURL(file);
    },
    deleteProgressPhoto(idx) {
        if (!confirm("Delete this progress photo?")) return;
        store.state.history.progressPhotos.splice(idx, 1);
        store.save();
        this.navigate('data', true);
    },
    openSettingsModal() {
        const s = store.state.settings;
        const f = s.features || {};
        const modal = document.getElementById('settings-modal');
        modal.innerHTML = `
            <div class="workout-header-sticky">
                <button type="button" class="btn btn-sm" style="width:auto;" onclick="document.getElementById('settings-modal').style.display='none'">Done</button>
                <div style="font-weight:bold; font-size:16px;">IronTrack OS Settings</div>
                <div style="width:60px;"></div>
            </div>
            <div style="padding:16px; overflow-y:auto; flex:1; padding-bottom:80px;">
                <div class="card">
                    <h3 style="margin-top:0;">Appearance & Units</h3>
                    <label style="font-size:11px; color:var(--text-secondary); font-weight:bold; text-transform:uppercase;">Theme</label>
                    <select class="edit-input" onchange="app.applyTheme(this.value); app.openSettingsModal(); app.navigate(app.currentPage, true);">
                        <option value="olympus" ${s.theme === 'olympus' ? 'selected' : ''}>Olympus Gold (Default)</option>
                        <option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Cyber Dark</option>
                        <option value="light" ${s.theme === 'light' ? 'selected' : ''}>Daylight Clean</option>
                    </select>
                    <label style="font-size:11px; color:var(--text-secondary); font-weight:bold; text-transform:uppercase;">Weight Units</label>
                    <select class="edit-input" onchange="store.state.settings.units = this.value; store.save(); app.navigate(app.currentPage, true);">
                        <option value="kg" ${s.units === 'kg' ? 'selected' : ''}>Kilograms (kg)</option>
                        <option value="lbs" ${s.units === 'lbs' ? 'selected' : ''}>Pounds (lbs)</option>
                    </select>
                    <label style="font-size:11px; color:var(--text-secondary); font-weight:bold; text-transform:uppercase;">Default Rest Timer (Seconds)</label>
                    <input type="number" class="edit-input" value="${s.restTimer || 120}" onchange="store.state.settings.restTimer = parseInt(this.value)||90; store.save();">
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">World Strength Standards</h3>
                    <label style="font-size:11px; color:var(--text-secondary); font-weight:bold; text-transform:uppercase;">Sex / Division</label>
                    <select class="edit-input" onchange="store.state.settings.gender = this.value; store.save(); app.navigate(app.currentPage, true);">
                        <option value="male" ${s.gender !== 'female' ? 'selected' : ''}>Men's Standards</option>
                        <option value="female" ${s.gender === 'female' ? 'selected' : ''}>Women's Standards</option>
                    </select>
                    <label style="font-size:11px; color:var(--text-secondary); font-weight:bold; text-transform:uppercase;">Comparison Pool</label>
                    <select class="edit-input" onchange="store.state.settings.worldRankBasis = this.value; store.save(); app.navigate(app.currentPage, true);">
                        <option value="lifters" ${s.worldRankBasis !== 'population' ? 'selected' : ''}>Active Gym Lifters</option>
                        <option value="population" ${s.worldRankBasis === 'population' ? 'selected' : ''}>General World Population</option>
                    </select>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">Dashboard Widgets</h3>
                    ${[
                        ['showQuote', 'Daily Stoic Quote'],
                        ['showRankBanner', 'Weekly Ranked Banner'],
                        ['showHeatmap', '28-Day Recovery Anatomy Map'],
                        ['showWeekStrip', 'Weekly Consistency Strip'],
                        ['showActivityGrid', '48-Day Heatmap & Lock-In Bento']
                    ].map(([key, label]) => `
                        <div class="data-row flex-between">
                            <span>${label}</span>
                            <input type="checkbox" ${f[key] !== false ? 'checked' : ''} onchange="store.state.settings.features['${key}'] = this.checked; store.save(); app.navigate(app.currentPage, true);" style="width:20px; height:20px;">
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        modal.style.display = 'flex';
    },
    exportJSON() {
        const dataStr = JSON.stringify(store.state, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `IronTrack_Backup_${utils.getLocalISODate(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    },
    importJSONPrompt() {
        const inp = document.getElementById('json-file-input');
        if (inp) { inp.value = ''; inp.click(); }
    },
    handleJSONFileImport(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const parsed = JSON.parse(e.target.result);
                if (parsed && parsed.history) {
                    store.state = Object.assign(store.state, parsed);
                    store.save();
                    this.applyTheme(store.state.settings.theme || 'olympus');
                    this.navigate('home', false);
                    alert("Backup restored successfully!");
                } else {
                    alert("Invalid IronTrack JSON backup file.");
                }
            } catch (err) {
                alert("Failed to parse JSON file.");
            }
        };
        reader.readAsText(file);
    }
};
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
<input type="file" id="progress-photo-input" accept="image/*" style="display:none;" onchange="app.handleProgressPhotoUpload(event)">
<input type="file" id="fit-file-input" accept=".fit" style="display:none;" onchange="app.handleWorkoutFileUpload(event, 'fit')">
<input type="file" id="csv-file-input" accept=".csv,text/csv" style="display:none;" onchange="app.handleWorkoutFileUpload(event, 'csv')">
<input type="file" id="json-file-input" accept=".json,application/json" style="display:none;" onchange="app.handleJSONFileImport(event)">
</body>
</html>
